; 细筛严格匹配阈值（score_anchor_asset_residual.glsl 逐体素合取判定）。
; 每次放置运行时由 VoxelPlacementGenerator._load_score_match_config 重读——
; 改完保存、在编辑器里重跑放置即生效，无需重启编辑器。
; 逐调用 settings 字典里的同名键优先级更高（config < settings）。
; ⚠ 保存须用 UTF-8 无 BOM：带 BOM 会让 ConfigFile.load 解析失败并回退默认值
; （PowerShell 的 Set-Content/Out-File -Encoding UTF8 会写 BOM，勿用它改本文件）。
;
; 判定规则：一个 footprint 体素只有在“目标此处要内容（occupied）、
; color / collision 的 post-compose 值与 TargetSV 的差不超各自阈值、
; complexity 不过填超阈值（非对称：仅拒过填，欠填/精确放行）、
; 且写入是净改善（improved）”时才计入匹配；任一项超差即整个体素不算有效匹配。
; 候选有效 = 匹配加权占比 > min_match_fraction。占比分母只算落在 occupied 目标上的
; footprint 体素——采样到空目标的体素被直接丢弃、不参与评分（既不稀释也不惩罚）。

[score_match]

; 候选有效所需的最低匹配占比（0..1）。越高越苛刻。
min_match_fraction = 0.05

; 颜色预算：post-compose rgb 与目标 rgb 的 L1 距离（0..3）。
; 参考：同色系波动 ~0.3；绿叶(0,1,0) vs 灰岩(0.33) ≈ 1.33。
color_match_max_l1 = 0.3

; 碰撞预算：|pred - target|（0..1）。目标碰撞近二值，0.5 = 允许半档漂移、
; 拒绝往无碰撞目标里写实心。
collision_match_max = 0.25

; 复杂度过填容差（非对称，仅过填 overfill 被拒）：post-compose complexity 满足
; pred.a <= target.a * (1 + N/100) 才算达标——欠填 / 精确 / ≤N% 过填全放行，
; 只有比目标稠密超过 N% 才判该维超差。N = 本值（百分比；0 = 只准精确/欠填、不许任何过填）。
; 纯比例：不再有绝对松弛项（旧 complexity_match_max 已移除）。
complexity_overfill_percent = 20

; 细筛 residual-gain 五维权重（"improved" 净改善项 + tiebreak 的逐维加权）。
; 三个 color 通道共享一个权重，故 3 个旋钮 = 5 个有效维（collision / complexity / R=G=B）。
; 由编辑器 Volume Score 工具栏 "Weights" 弹窗读写本段（ConfigFile 读、保注释手写存，UTF-8 无 BOM）；
; VoxelPlacementGenerator._load_score_match_config 每次放置重读——改完重跑 Score/Place 即生效。
[residual_weights]

collision = 1.0
complexity = 1.0
color = 0.34
