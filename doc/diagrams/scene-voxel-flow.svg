<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1060" viewBox="0 0 1660 1060" role="img" aria-labelledby="title desc">
  <title id="title">SceneVoxel Source Commit and Resident Field Flow</title>
  <desc id="desc">Scene voxel field system flow from scene-voxel-field-system.md.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#ea580c"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <pattern id="autoobject-dot-bg" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#cffafe"/>
      <circle cx="3" cy="3" r="1.25" fill="#0891b2" opacity="0.256281"/>
      <circle cx="9" cy="9" r="1.25" fill="#0891b2" opacity="0.256281"/>
    </pattern>
    <pattern id="descriptor-grid" patternUnits="userSpaceOnUse" width="9.3334" height="9.3334">
      <rect width="9.3334" height="9.3334" fill="#dcfce7"/>
      <path d="M4.6667 0H0V4.6667" stroke="#16a34a" stroke-width="0.3333" opacity="0.257576"/>
      <path d="M0 4.6667L4.6667 0" stroke="#16a34a" stroke-width="0.3333" opacity="0.257576"/>
    </pattern>
    <pattern id="sv-stripe-blue" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#dbeafe"/>
      <rect y="1" width="10" height="2" fill="#0284c7" opacity="0.235023"/>
      <rect y="6" width="10" height="1.5" fill="#0284c7" opacity="0.235023"/>
    </pattern>
    <pattern id="sv-stripe-amber" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#fef3c7"/>
      <rect y="1" width="10" height="2" fill="#d97706" opacity="0.264249"/>
      <rect y="6" width="10" height="1.5" fill="#d97706" opacity="0.264249"/>
    </pattern>
    <pattern id="note-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#f1f5f9"/>
      <rect x="0" y="0" width="10" height="2" fill="#64748b" opacity="0.361702"/>
    </pattern>
  </defs>
  <style>
    :root { color-scheme: light; }
    .bg { fill: #f8fafc; }
    .grid { stroke: #e2e8f0; stroke-width: 1; opacity: 0.7; }
    .title { fill: #0f172a; font: 700 34px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .subtitle { fill: #475569; font: 500 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .lane-title { fill: #334155; font: 700 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .node-title { fill: #0f172a; font: 700 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .small { fill: #475569; font: 500 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .mono { fill: #334155; font: 600 11px Consolas, "Cascadia Mono", monospace; letter-spacing: 0; }
    .note-text { fill: #0f172a; font: 600 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .lane { fill: #ffffff; stroke: #dbe3ef; stroke-width: 1.2; filter: url(#shadow); }
    .node { stroke-width: 1.5; filter: url(#shadow); }
    .edge { stroke: #334155; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
    .edge-blue { stroke: #2563eb; stroke-width: 2.2; fill: none; marker-end: url(#arrow-blue); }
    .edge-green { stroke: #059669; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
    .edge-orange { stroke: #ea580c; stroke-width: 2.2; fill: none; marker-end: url(#arrow-orange); }
    .edge-dash { stroke: #64748b; stroke-width: 1.9; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    .edge-warn { stroke: #dc2626; stroke-width: 2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
  </style>

  <rect class="bg" x="0" y="0" width="1660" height="1060"/>
  <g opacity="0.65"><line class="grid" x1="40" y1="86" x2="40" y2="1024"/><line class="grid" x1="120" y1="86" x2="120" y2="1024"/><line class="grid" x1="200" y1="86" x2="200" y2="1024"/><line class="grid" x1="280" y1="86" x2="280" y2="1024"/><line class="grid" x1="360" y1="86" x2="360" y2="1024"/><line class="grid" x1="440" y1="86" x2="440" y2="1024"/><line class="grid" x1="520" y1="86" x2="520" y2="1024"/><line class="grid" x1="600" y1="86" x2="600" y2="1024"/><line class="grid" x1="680" y1="86" x2="680" y2="1024"/><line class="grid" x1="760" y1="86" x2="760" y2="1024"/><line class="grid" x1="840" y1="86" x2="840" y2="1024"/><line class="grid" x1="920" y1="86" x2="920" y2="1024"/><line class="grid" x1="1000" y1="86" x2="1000" y2="1024"/><line class="grid" x1="1080" y1="86" x2="1080" y2="1024"/><line class="grid" x1="1160" y1="86" x2="1160" y2="1024"/><line class="grid" x1="1240" y1="86" x2="1240" y2="1024"/><line class="grid" x1="1320" y1="86" x2="1320" y2="1024"/><line class="grid" x1="1400" y1="86" x2="1400" y2="1024"/><line class="grid" x1="1480" y1="86" x2="1480" y2="1024"/><line class="grid" x1="1560" y1="86" x2="1560" y2="1024"/><line class="grid" x1="1640" y1="86" x2="1640" y2="1024"/><line class="grid" x1="30" y1="120" x2="1630" y2="120"/><line class="grid" x1="30" y1="200" x2="1630" y2="200"/><line class="grid" x1="30" y1="280" x2="1630" y2="280"/><line class="grid" x1="30" y1="360" x2="1630" y2="360"/><line class="grid" x1="30" y1="440" x2="1630" y2="440"/><line class="grid" x1="30" y1="520" x2="1630" y2="520"/><line class="grid" x1="30" y1="600" x2="1630" y2="600"/><line class="grid" x1="30" y1="680" x2="1630" y2="680"/><line class="grid" x1="30" y1="760" x2="1630" y2="760"/><line class="grid" x1="30" y1="840" x2="1630" y2="840"/><line class="grid" x1="30" y1="920" x2="1630" y2="920"/><line class="grid" x1="30" y1="1000" x2="1630" y2="1000"/></g>
  <text class="title" x="48" y="54">SceneVoxel Source Commit and Resident Field Flow</text>
  <text class="subtitle" x="48" y="82">Dirty SceneVoxelTiles rebuild source intent; commit_scene_voxels publishes minimal payload and SV resident fields.</text>
  <g>
    <rect class="lane" x="45" y="115" width="355" height="800" rx="8"/>
    <text class="lane-title" x="63" y="141">WRITE INTENT</text>
    <rect class="lane" x="440" y="115" width="355" height="800" rx="8"/>
    <text class="lane-title" x="458" y="141">SOURCE STREAMS</text>
    <rect class="lane" x="835" y="115" width="355" height="800" rx="8"/>
    <text class="lane-title" x="853" y="141">COMMIT / PUBLIC READ</text>
    <rect class="lane" x="1230" y="115" width="385" height="800" rx="8"/>
    <text class="lane-title" x="1248" y="141">SV RESIDENT OWNER</text>
  </g>
  <g>
    <path class="edge-green" d="M 360 212 L 480 230"/>
    <path class="edge-orange" d="M 360 588 L 480 230"/>
    <path class="edge-orange" d="M 360 588 L 480 430"/>
    <path class="edge" d="M 755 230 L 875 245"/>
    <path class="edge" d="M 755 430 L 875 245"/>
    <path class="edge-warn" d="M 755 632 L 875 245"/>
    <path class="edge" d="M 1012 310 L 1012 405"/>
    <path class="edge-blue" d="M 1012 535 L 1012 635"/>
    <path class="edge-blue" d="M 1150 470 L 1270 235"/>
    <path class="edge" d="M 1420 300 L 1420 390"/>
    <path class="edge" d="M 1420 515 L 1420 610"/>
    <path class="edge-dash" d="M 1270 675 L 85 398"/>
    <text class="mono" x="610" y="820">next tick read input</text>
    <path class="edge-blue" d="M 360 398 L 85 340"/>
  </g>
  <g>
    <g id="descriptor-/-brush-edit">
    <rect class="node" x="85" y="155" width="275" height="115" rx="8" fill="url(#descriptor-grid)" stroke="#16a34a"/>
    <text class="node-title" x="103" y="183">Dirty producers</text>
    <text class="small"><tspan x="103" y="205">AutoObject / brush / profile</tspan><tspan x="103" y="222">mark SceneVoxelTile dirty</tspan><tspan x="103" y="239">Target guidance is separate</tspan></text>
    </g>
    <g id="blendsv[t---1]-/-sv[t---1]">
    <rect class="node" x="85" y="340" width="275" height="115" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
    <text class="node-title" x="103" y="368">BlendSV[t - 1] / SV[t - 1]</text>
    <text class="small"><tspan x="103" y="390">stable previous read input</tspan><tspan x="103" y="407">complexity_field + collision_field</tspan><tspan x="103" y="424">used by physical sampling</tspan></text>
    </g>
    <g id="instance_stamp_write_spec">
    <rect class="node" x="85" y="530" width="275" height="115" rx="8" fill="url(#sv-stripe-amber)" stroke="#d97706"/>
    <text class="node-title" x="103" y="558">ISWS</text>
    <text class="small"><tspan x="103" y="580">instance stamp write spec</tspan><tspan x="103" y="597">prepared source record</tspan><tspan x="103" y="614">SharedPropertyType normalized</tspan></text>
    </g>
    <g id="autoscenevoxel[tick]">
    <rect class="node" x="480" y="170" width="275" height="120" rx="8" fill="url(#sv-stripe-amber)" stroke="#d97706"/>
    <text class="node-title" x="498" y="198">AutoSceneVoxel[tick]</text>
    <text class="small"><tspan x="498" y="220">auto placement write intent</tspan><tspan x="498" y="237">source metadata / priority</tspan><tspan x="498" y="254">collision samples</tspan></text>
    </g>
    <g id="brushscenevoxel[tick]">
    <rect class="node" x="480" y="370" width="275" height="120" rx="8" fill="url(#sv-stripe-amber)" stroke="#d97706"/>
    <text class="node-title" x="498" y="398">BrushSceneVoxel[tick]</text>
    <text class="small"><tspan x="498" y="420">SVBrush/source stamp intent</tspan><tspan x="498" y="437">rebuilt from dirty tiles</tspan><tspan x="498" y="454">not direct committed write</tspan></text>
    </g>
    <g id="targetscenevoxel-skipped">
    <rect class="node" x="480" y="580" width="275" height="105" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text class="node-title" x="498" y="608">TargetSceneVoxel skipped</text>
    <text class="small"><tspan x="498" y="630">guidance metadata only</tspan><tspan x="498" y="647">does not enter source stream</tspan></text>
    </g>
    <g id="commit_scene_voxels(tick)">
    <rect class="node" x="875" y="180" width="275" height="130" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
    <text class="node-title" x="893" y="208">commit_scene_voxels(tick)</text>
    <text class="small"><tspan x="893" y="230">merge auto + brush</tspan><tspan x="893" y="247">read GPU payloads</tspan><tspan x="893" y="264">publish committed read model</tspan></text>
    </g>
    <g id="scenevoxel-public-payload">
    <rect class="node" x="875" y="405" width="275" height="130" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
    <text class="node-title" x="893" y="433">SceneVoxel public payload</text>
    <text class="small"><tspan x="893" y="455">complexity</tspan><tspan x="893" y="472">color</tspan><tspan x="893" y="489">collision</tspan><tspan x="893" y="506">optional auto_mix only</tspan></text>
    </g>
    <g id="result-feedback">
    <rect class="node" x="875" y="635" width="275" height="105" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
    <text class="node-title" x="893" y="663">Result feedback</text>
    <text class="small"><tspan x="893" y="685">compare BlendSV[tick]</tspan><tspan x="893" y="702">against TargetSV_B / TargetSV</tspan><tspan x="893" y="719">post-commit helper</tspan></text>
    </g>
    <g id="scenevoxelcommitter">
    <rect class="node" x="1270" y="170" width="300" height="130" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
    <text class="node-title" x="1288" y="198">SceneVoxelCommitter</text>
    <text class="small"><tspan x="1288" y="220">owns committed SceneVoxel</tspan><tspan x="1288" y="237">complexity_field / collision_field</tspan><tspan x="1288" y="254">grid metadata</tspan></text>
    </g>
    <g id="terrain-base-collision">
    <rect class="node" x="1270" y="390" width="300" height="125" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
    <text class="node-title" x="1288" y="418">Terrain base collision</text>
    <text class="small"><tspan x="1288" y="440">preserved below terrain height</tspan><tspan x="1288" y="457">normal erase cannot lower it</tspan><tspan x="1288" y="474">future carve source required</tspan></text>
    </g>
    <g id="dirty-regions-/-tiles">
    <rect class="node" x="1270" y="610" width="300" height="130" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
    <text class="node-title" x="1288" y="638">SceneVoxelTile dirty</text>
    <text class="small"><tspan x="1288" y="660">only normal update entry</tspan><tspan x="1288" y="677">rebuild source/object ranges</tspan><tspan x="1288" y="694">full rebuild = dirty all tiles</tspan></text>
    </g>
  </g>
  <g>
    <g>
    <rect x="85" y="795" width="700" height="80" rx="8" fill="url(#note-hatch)" stroke="#64748b" stroke-width="1.3"/>
    <text class="note-text" x="99" y="819">Payload contract</text>
    <text class="small"><tspan x="99" y="840">SceneVoxelTile dirty is the update boundary; source stamps are rebuilt write intent.</tspan><tspan x="99" y="857">No direct committed payload upload; channel stays source/write context.</tspan></text>
  </g>
  </g>
</svg>
