<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">TargetSceneVoxel Current Guidance Flow</title>
  <desc id="desc">TargetSceneVoxel projection and guidance boundary from target-scene-voxel-projection.md.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#ea580c"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <pattern id="autoobject-dot-bg" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#cffafe"/>
      <circle cx="3" cy="3" r="1.25" fill="#0891b2" opacity="0.256281"/>
      <circle cx="9" cy="9" r="1.25" fill="#0891b2" opacity="0.256281"/>
    </pattern>
    <pattern id="descriptor-grid" patternUnits="userSpaceOnUse" width="9.3334" height="9.3334">
      <rect width="9.3334" height="9.3334" fill="#dcfce7"/>
      <path d="M4.6667 0H0V4.6667" stroke="#16a34a" stroke-width="0.3333" opacity="0.257576"/>
      <path d="M0 4.6667L4.6667 0" stroke="#16a34a" stroke-width="0.3333" opacity="0.257576"/>
    </pattern>
    <pattern id="sv-stripe-blue" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#dbeafe"/>
      <rect y="1" width="10" height="2" fill="#0284c7" opacity="0.235023"/>
      <rect y="6" width="10" height="1.5" fill="#0284c7" opacity="0.235023"/>
    </pattern>
    <pattern id="sv-stripe-amber" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#fef3c7"/>
      <rect y="1" width="10" height="2" fill="#d97706" opacity="0.264249"/>
      <rect y="6" width="10" height="1.5" fill="#d97706" opacity="0.264249"/>
    </pattern>
    <pattern id="note-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#f1f5f9"/>
      <rect x="0" y="0" width="10" height="2" fill="#64748b" opacity="0.361702"/>
    </pattern>
  </defs>
  <style>
    :root { color-scheme: light; }
    .bg { fill: #f8fafc; }
    .grid { stroke: #e2e8f0; stroke-width: 1; opacity: 0.7; }
    .title { fill: #0f172a; font: 700 34px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .subtitle { fill: #475569; font: 500 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .lane-title { fill: #334155; font: 700 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .node-title { fill: #0f172a; font: 700 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .small { fill: #475569; font: 500 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .mono { fill: #334155; font: 600 11px Consolas, "Cascadia Mono", monospace; letter-spacing: 0; }
    .note-text { fill: #0f172a; font: 600 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .lane { fill: #ffffff; stroke: #dbe3ef; stroke-width: 1.2; filter: url(#shadow); }
    .node { stroke-width: 1.5; filter: url(#shadow); }
    .edge { stroke: #334155; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
    .edge-blue { stroke: #2563eb; stroke-width: 2.2; fill: none; marker-end: url(#arrow-blue); }
    .edge-green { stroke: #059669; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
    .edge-orange { stroke: #ea580c; stroke-width: 2.2; fill: none; marker-end: url(#arrow-orange); }
    .edge-dash { stroke: #64748b; stroke-width: 1.9; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    .edge-warn { stroke: #dc2626; stroke-width: 2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
  </style>

  <rect class="bg" x="0" y="0" width="1600" height="980"/>
  <g opacity="0.65"><line class="grid" x1="40" y1="86" x2="40" y2="944"/><line class="grid" x1="120" y1="86" x2="120" y2="944"/><line class="grid" x1="200" y1="86" x2="200" y2="944"/><line class="grid" x1="280" y1="86" x2="280" y2="944"/><line class="grid" x1="360" y1="86" x2="360" y2="944"/><line class="grid" x1="440" y1="86" x2="440" y2="944"/><line class="grid" x1="520" y1="86" x2="520" y2="944"/><line class="grid" x1="600" y1="86" x2="600" y2="944"/><line class="grid" x1="680" y1="86" x2="680" y2="944"/><line class="grid" x1="760" y1="86" x2="760" y2="944"/><line class="grid" x1="840" y1="86" x2="840" y2="944"/><line class="grid" x1="920" y1="86" x2="920" y2="944"/><line class="grid" x1="1000" y1="86" x2="1000" y2="944"/><line class="grid" x1="1080" y1="86" x2="1080" y2="944"/><line class="grid" x1="1160" y1="86" x2="1160" y2="944"/><line class="grid" x1="1240" y1="86" x2="1240" y2="944"/><line class="grid" x1="1320" y1="86" x2="1320" y2="944"/><line class="grid" x1="1400" y1="86" x2="1400" y2="944"/><line class="grid" x1="1480" y1="86" x2="1480" y2="944"/><line class="grid" x1="1560" y1="86" x2="1560" y2="944"/><line class="grid" x1="30" y1="120" x2="1570" y2="120"/><line class="grid" x1="30" y1="200" x2="1570" y2="200"/><line class="grid" x1="30" y1="280" x2="1570" y2="280"/><line class="grid" x1="30" y1="360" x2="1570" y2="360"/><line class="grid" x1="30" y1="440" x2="1570" y2="440"/><line class="grid" x1="30" y1="520" x2="1570" y2="520"/><line class="grid" x1="30" y1="600" x2="1570" y2="600"/><line class="grid" x1="30" y1="680" x2="1570" y2="680"/><line class="grid" x1="30" y1="760" x2="1570" y2="760"/><line class="grid" x1="30" y1="840" x2="1570" y2="840"/><line class="grid" x1="30" y1="920" x2="1570" y2="920"/></g>
  <text class="title" x="48" y="54">TargetSceneVoxel Current Guidance Flow</text>
  <text class="subtitle" x="48" y="82">TargetSV and BrushSV compose TargetSV_B, the guidance read buffer for prefilter, scoring, and feedback.</text>
  <g>
    <rect class="lane" x="45" y="115" width="345" height="720" rx="8"/>
    <text class="lane-title" x="63" y="141">SOURCE TARGET CANVAS</text>
    <rect class="lane" x="430" y="115" width="345" height="720" rx="8"/>
    <text class="lane-title" x="448" y="141">COMPOSITION + PERSISTENCE</text>
    <rect class="lane" x="815" y="115" width="345" height="720" rx="8"/>
    <text class="lane-title" x="833" y="141">RUNTIME CONSUMERS</text>
    <rect class="lane" x="1200" y="115" width="350" height="720" rx="8"/>
    <text class="lane-title" x="1218" y="141">BOUNDARIES + PLANS</text>
  </g>
  <g>
    <path class="edge" d="M 217 275 L 217 335"/>
    <path class="edge-blue" d="M 350 397 L 470 225"/>
    <path class="edge-blue" d="M 350 397 L 470 408"/>
    <path class="edge-blue" d="M 602 465 L 602 535"/>
    <path class="edge-blue" d="M 735 595 L 855 228"/>
    <path class="edge-blue" d="M 735 595 L 855 408"/>
    <path class="edge" d="M 988 285 L 988 350"/>
    <path class="edge" d="M 988 465 L 988 530"/>
    <path class="edge-warn" d="M 1120 590 L 1240 445"/>
    <path class="edge-dash" d="M 350 590 L 1240 650"/>
  </g>
  <g>
    <g id="target-generator">
    <rect class="node" x="85" y="160" width="265" height="115" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
    <text class="node-title" x="103" y="188">Target generator</text>
    <text class="small"><tspan x="103" y="210">target_scene_voxel_generator.gd</tspan><tspan x="103" y="227">target_scene_voxel.glsl</tspan><tspan x="103" y="244">procedural transition path</tspan></text>
    </g>
    <g id="targetsv-source-buffers">
    <rect class="node" x="85" y="335" width="265" height="125" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
    <text class="node-title" x="103" y="363">TargetSV source buffers</text>
    <text class="small"><tspan x="103" y="385">visual rgba8</tspan><tspan x="103" y="402">collision r8</tspan><tspan x="103" y="419">color + complexity + solid intent</tspan></text>
    </g>
    <g id="future-sources">
    <rect class="node" x="85" y="535" width="265" height="110" rx="8" fill="#f5f3ff" stroke="#8b5cf6"/>
    <text class="node-title" x="103" y="563">Future sources</text>
    <text class="small"><tspan x="103" y="585">stamp rasterizer plan</tspan><tspan x="103" y="602">external VDB import plan</tspan><tspan x="103" y="619">projection cache plan</tspan></text>
    </g>
    <g id="persisted-target-files">
    <rect class="node" x="470" y="165" width="265" height="120" rx="8" fill="url(#sv-stripe-amber)" stroke="#d97706"/>
    <text class="node-title" x="488" y="193">Persisted target files</text>
    <text class="small"><tspan x="488" y="215">target_scene_voxel_visual</tspan><tspan x="488" y="232">target_scene_voxel_collision</tspan><tspan x="488" y="249">metadata JSON + preview PNG</tspan></text>
    </g>
    <g id="brushsv">
    <rect class="node" x="470" y="350" width="265" height="115" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
    <text class="node-title" x="488" y="378">BrushSV</text>
    <text class="small"><tspan x="488" y="400">brush delta / override</tspan><tspan x="488" y="417">recomposed with TargetSV</tspan><tspan x="488" y="434">not committed SceneVoxel</tspan></text>
    </g>
    <g id="targetsv_b">
    <rect class="node" x="470" y="535" width="265" height="120" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
    <text class="node-title" x="488" y="563">TargetSV_B</text>
    <text class="small"><tspan x="488" y="585">brush-composited read target</tspan><tspan x="488" y="602">target_scene_voxel_b_* files</tspan><tspan x="488" y="619">default runtime guidance</tspan></text>
    </g>
    <g id="target_occupancy">
    <rect class="node" x="855" y="170" width="265" height="115" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
    <text class="node-title" x="873" y="198">target_occupancy</text>
    <text class="small"><tspan x="873" y="220">complexity / collision intent</tspan><tspan x="873" y="237">mapped from TargetSV_B</tspan><tspan x="873" y="254">input to scoring</tspan></text>
    </g>
    <g id="target_color">
    <rect class="node" x="855" y="350" width="265" height="115" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
    <text class="node-title" x="873" y="378">target_color</text>
    <text class="small"><tspan x="873" y="400">packed RGBA8</tspan><tspan x="873" y="417">rgb = color</tspan><tspan x="873" y="434">a = complexity</tspan></text>
    </g>
    <g id="consumers">
    <rect class="node" x="855" y="530" width="265" height="135" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text class="node-title" x="873" y="558">Consumers</text>
    <text class="small"><tspan x="873" y="580">AutoObject probe prefilter</tspan><tspan x="873" y="597">candidate routing</tspan><tspan x="873" y="614">score_voxel_tile.glsl</tspan><tspan x="873" y="631">result feedback comparison</tspan></text>
    </g>
    <g id="not-asset-selection">
    <rect class="node" x="1240" y="175" width="270" height="125" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text class="node-title" x="1258" y="203">Not asset selection</text>
    <text class="small"><tspan x="1258" y="225">no asset_type / asset_group</tspan><tspan x="1258" y="242">no placement_role</tspan><tspan x="1258" y="259">no committed source metadata</tspan></text>
    </g>
    <g id="not-source-write">
    <rect class="node" x="1240" y="385" width="270" height="125" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text class="node-title" x="1258" y="413">Not source write</text>
    <text class="small"><tspan x="1258" y="435">TargetSceneVoxel guidance record</tspan><tspan x="1258" y="452">skips AutoSceneVoxel/BrushSceneVoxel</tspan><tspan x="1258" y="469">does not enter blend_scene_voxels()</tspan></text>
    </g>
    <g id="plans-stay-optional">
    <rect class="node" x="1240" y="595" width="270" height="110" rx="8" fill="#f5f3ff" stroke="#8b5cf6"/>
    <text class="node-title" x="1258" y="623">Plans stay optional</text>
    <text class="small"><tspan x="1258" y="645">stamp draws target intent</tspan><tspan x="1258" y="662">projection reranks within candidates</tspan><tspan x="1258" y="679">VDB import is offline plan</tspan></text>
    </g>
  </g>
  <g>
    <g>
    <rect x="470" y="760" width="650" height="70" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7" stroke-width="1.3"/>
    <text class="note-text" x="484" y="784">Sampling boundary</text>
    <text class="small"><tspan x="484" y="805">TargetSV_B samples clamp inside valid target bounds.</tspan><tspan x="484" y="821">It guides placement and feedback but never becomes committed SceneVoxel state.</tspan></text>
  </g>
  </g>
</svg>
