<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 690" width="1180" height="690" font-family="Segoe UI, Noto Sans SC, sans-serif">
  <defs>
    <pattern id="autoobject-dot-bg" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#cffafe"/>
      <circle cx="3" cy="3" r="1.25" fill="#0891b2" opacity="0.256281"/>
      <circle cx="9" cy="9" r="1.25" fill="#0891b2" opacity="0.256281"/>
    </pattern>
    <pattern id="retained-stripe-bg" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#fef3c7"/>
      <rect y="1" width="10" height="2" fill="#d97706" opacity="0.264249"/>
      <rect y="6" width="10" height="1.5" fill="#d97706" opacity="0.264249"/>
    </pattern>
    <pattern id="descriptor-grid" patternUnits="userSpaceOnUse" width="9.3334" height="9.3334">
      <rect width="9.3334" height="9.3334" fill="#dcfce7"/>
      <path d="M4.6667 0H0V4.6667" stroke="#16a34a" stroke-width="0.3333" opacity="0.257576"/>
      <path d="M0 4.6667L4.6667 0" stroke="#16a34a" stroke-width="0.3333" opacity="0.257576"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
  </defs>

  <style>
    .lane        { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
    .lane-label  { font-size: 13px; font-weight: 700; fill: #64748b; letter-spacing: .06em; }
    .autoobject  { fill: url(#autoobject-dot-bg); stroke: #0e7490; stroke-width: 1.6; }
    .emit-kernel { fill: #ede9fe; stroke: #6d28d9; stroke-width: 1.6; }
    .resident    { fill: url(#retained-stripe-bg); stroke: #b45309; stroke-width: 1.6; }
    .descriptor  { fill: url(#descriptor-grid); stroke: #15803d; stroke-width: 1.6; }
    .consumer    { fill: #ffffff; stroke: #475569; stroke-width: 1.4; }
    .absent      { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .title       { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .sub         { font-size: 11.5px; fill: #334155; }
    .mono        { font-size: 11.5px; fill: #1e293b; font-family: Consolas, monospace; }
    .mono-dim    { font-size: 11px; fill: #64748b; font-family: Consolas, monospace; }
    .edge        { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .edge-dim    { stroke: #94a3b8; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow-dim); }
    .edge-label  { font-size: 11px; fill: #475569; font-family: Consolas, monospace; }
  </style>

  <text x="24" y="30" style="font-size:17px;font-weight:700;fill:#0f172a">GPU 直提渲染 — AutoObject instance emit</text>
  <text x="24" y="50" class="sub">常驻对象池 → 三趟 emit → 绘制载荷 / 点选 OBB。CPU 不解码 mat4、不打包 float、不按 profile_id 分组。</text>

  <!-- lanes -->
  <rect class="lane" x="24"   y="70" width="252" height="560" rx="8"/>
  <rect class="lane" x="296"  y="70" width="300" height="560" rx="8"/>
  <rect class="lane" x="616"  y="70" width="252" height="560" rx="8"/>
  <rect class="lane" x="888"  y="70" width="268" height="560" rx="8"/>
  <text class="lane-label" x="40"  y="92">输入（借用）</text>
  <text class="lane-label" x="312" y="92">emit kernel · local device</text>
  <text class="lane-label" x="632" y="92">renderer 自有常驻输出</text>
  <text class="lane-label" x="904" y="92">消费者</text>

  <!-- inputs -->
  <rect class="autoobject" x="42" y="112" width="216" height="118" rx="7"/>
  <text class="title" x="56" y="134">GPUAutoObjectRuntime</text>
  <text class="mono"  x="56" y="154">alive · profile · object_flags</text>
  <text class="mono"  x="56" y="172">asset_index · bounds_min</text>
  <text class="mono"  x="56" y="190">transform (mat4)</text>
  <text class="sub"   x="56" y="212">set 0，只读借用（6 binding）</text>

  <rect class="descriptor" x="42" y="250" width="216" height="80" rx="7"/>
  <text class="title" x="56" y="272">ScenePlacementRuntime</text>
  <text class="mono"  x="56" y="292">mesh_description（128 B/资产）</text>
  <text class="sub"   x="56" y="312">OBB 半长来源，set 1 binding 4</text>

  <rect class="resident" x="42" y="350" width="216" height="86" rx="7"/>
  <text class="title" x="56" y="372">terrain_height[]</text>
  <text class="mono"  x="56" y="392">res × res，宿主注入</text>
  <text class="sub"   x="56" y="412">缺失时不猜：保持平 Y</text>
  <text class="sub"   x="56" y="428">并清 TERRAIN_REBASED 位</text>

  <!-- kernel passes -->
  <rect class="emit-kernel" x="314" y="112" width="264" height="96" rx="7"/>
  <text class="title" x="328" y="134">pass 0 · count</text>
  <text class="sub"   x="328" y="154">统计每批存活数（atomicAdd）</text>
  <text class="sub"   x="328" y="172">顺带整块清 instance_render /</text>
  <text class="sub"   x="328" y="190">instance_pick（GPU 清比上传零便宜）</text>

  <rect class="emit-kernel" x="314" y="234" width="264" height="86" rx="7"/>
  <text class="title" x="328" y="256">pass 1 · prefix</text>
  <text class="sub"   x="328" y="276">单线程独占扫描 → instance_start</text>
  <text class="sub"   x="328" y="294">游标归零，写 instance_dispatch</text>
  <text class="mono-dim" x="328" y="312">dispatch (1,1,1)</text>

  <rect class="emit-kernel" x="314" y="346" width="264" height="96" rx="7"/>
  <text class="title" x="328" y="368">pass 2 · scatter</text>
  <text class="mono"  x="328" y="388">slot = instance_start[b]</text>
  <text class="mono"  x="328" y="406">     + atomicAdd(cursor[b], 1)</text>
  <text class="sub"   x="328" y="426">同一 slot 写渲染与点选两块</text>

  <rect x="314" y="462" width="264" height="66" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
  <text class="title" x="328" y="484" style="fill:#9a3412">段间必须插屏障</text>
  <text class="sub"   x="328" y="504">prefix 读 count 的结果，scatter 读</text>
  <text class="sub"   x="328" y="520">prefix 的 start/cursor —— 少一道即静默错位</text>

  <!-- outputs -->
  <rect class="resident" x="634" y="112" width="216" height="84" rx="7"/>
  <text class="title" x="648" y="134">instance_render[]</text>
  <text class="mono"  x="648" y="154">80 B = 20 float / 实例</text>
  <text class="sub"   x="648" y="174">row0-2 · color · custom（MultiMesh 形状）</text>

  <rect class="resident" x="634" y="212" width="216" height="84" rx="7"/>
  <text class="title" x="648" y="234">instance_pick[]</text>
  <text class="mono"  x="648" y="254">128 B = 32 word / 实例</text>
  <text class="sub"   x="648" y="274">OBB 中心/半长/yaw · ids · flags</text>

  <rect class="resident" x="634" y="312" width="216" height="76" rx="7"/>
  <text class="title" x="648" y="334">batch_header[]</text>
  <text class="mono"  x="648" y="354">64 B / 批，一个 asset 一批</text>
  <text class="sub"   x="648" y="374">batch_index == asset_index（不变式）</text>

  <rect class="resident" x="634" y="404" width="216" height="76" rx="7"/>
  <text class="title" x="648" y="426">instance_dispatch</text>
  <text class="mono"  x="648" y="446">[groups_x, 1, 1, live_count]</text>
  <text class="sub"   x="648" y="466">消费者只准按它间接派发</text>

  <!-- consumers -->
  <rect class="consumer" x="906" y="112" width="232" height="132" rx="7"/>
  <text class="title" x="920" y="134">PlacedInstanceDisplay</text>
  <text class="sub"   x="920" y="154">主设备 · 每批一个</text>
  <text class="mono"  x="920" y="172">MultiMeshInstance3D</text>
  <text class="sub"   x="920" y="194">模式 a：一次整块 buffer_get_data</text>
  <text class="sub"   x="920" y="212">+ set_buffer（本仓恒走此条）</text>
  <text class="sub"   x="920" y="232" style="fill:#b91c1c">无任何 set_instance_* 调用点</text>

  <rect class="absent" x="906" y="264" width="232" height="86" rx="7"/>
  <text class="title" x="920" y="286" style="fill:#64748b">模式 b（未实现）</text>
  <text class="mono-dim" x="920" y="306">multimesh_get_buffer_rd_rid</text>
  <text class="sub"   x="920" y="326" style="fill:#64748b">要求 emit 设备 == 主设备；</text>
  <text class="sub"   x="920" y="342" style="fill:#64748b">SPA 用 local device ⇒ 不可达</text>

  <rect class="absent" x="906" y="372" width="232" height="86" rx="7"/>
  <text class="title" x="920" y="394" style="fill:#64748b">UnifiedPickGPU（待接线）</text>
  <text class="mono-dim" x="920" y="414">BIT_AUTOOBJECT</text>
  <text class="sub"   x="920" y="434" style="fill:#64748b">在 GPU 上直接读 instance_pick，</text>
  <text class="sub"   x="920" y="450" style="fill:#64748b">按 instance_dispatch 间接派发</text>

  <rect class="consumer" x="906" y="480" width="232" height="80" rx="7"/>
  <text class="title" x="920" y="502">AssetDescriptor</text>
  <text class="mono"  x="920" y="522">get_mesh() / material</text>
  <text class="sub"   x="920" y="542" style="fill:#b91c1c">无 mesh 即丢批，绝不代理盒</text>

  <!-- edges -->
  <path class="edge" d="M258 171 H296"/>
  <path class="edge" d="M258 290 H286 V300 H314"/>
  <path class="edge" d="M258 393 H286 V400 H314"/>
  <path class="edge" d="M578 160 H606 V154 H634"/>
  <path class="edge" d="M578 277 H606 V254 H634"/>
  <path class="edge" d="M578 277 H606 V350 H634"/>
  <path class="edge" d="M578 394 H606 V442 H634"/>
  <path class="edge" d="M850 154 H878 V178 H906"/>
  <text class="edge-label" x="856" y="146">handoff</text>
  <path class="edge-dim" d="M850 254 H878 V414 H906"/>
  <path class="edge-dim" d="M850 442 H878 V450 H906"/>
  <path class="edge" d="M906 520 H896 V200 H906"/>
  <text class="edge-label" x="912" y="580">按 asset_index 取 mesh / material</text>

  <!-- legend -->
  <rect x="24" y="644" width="1132" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="38"  y="653" width="16" height="16" rx="3" class="autoobject"/>
  <text class="sub" x="60"  y="666">runtime 常驻 SoA（借用）</text>
  <rect x="228" y="653" width="16" height="16" rx="3" class="descriptor"/>
  <text class="sub" x="250" y="666">descriptor / profile 侧</text>
  <rect x="404" y="653" width="16" height="16" rx="3" class="resident"/>
  <text class="sub" x="426" y="666">renderer 自有常驻 buffer</text>
  <rect x="614" y="653" width="16" height="16" rx="3" class="emit-kernel"/>
  <text class="sub" x="636" y="666">emit kernel pass</text>
  <rect x="770" y="653" width="16" height="16" rx="3" class="absent"/>
  <text class="sub" x="792" y="666">未实现 / 待接线</text>
</svg>
