<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1080" viewBox="0 0 1660 1080" role="img" aria-labelledby="title desc">
  <title id="title">ScenePlacementActor Runtime Orchestration</title>
  <desc id="desc">ScenePlacementActor owns asset registry and runtime profile GPU buffers while borrowing SV and GPU runtime owners for the prefilter, placement, and commit pipeline.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#ea580c"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <pattern id="autoobject-dot-bg" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#cffafe"/>
      <circle cx="3" cy="3" r="1.25" fill="#0891b2" opacity="0.256281"/>
      <circle cx="9" cy="9" r="1.25" fill="#0891b2" opacity="0.256281"/>
    </pattern>
    <pattern id="descriptor-grid" patternUnits="userSpaceOnUse" width="9.3334" height="9.3334">
      <rect width="9.3334" height="9.3334" fill="#dcfce7"/>
      <path d="M4.6667 0H0V4.6667" stroke="#16a34a" stroke-width="0.3333" opacity="0.257576"/>
      <path d="M0 4.6667L4.6667 0" stroke="#16a34a" stroke-width="0.3333" opacity="0.257576"/>
    </pattern>
    <pattern id="sv-stripe-blue" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#dbeafe"/>
      <rect y="1" width="10" height="2" fill="#0284c7" opacity="0.235023"/>
      <rect y="6" width="10" height="1.5" fill="#0284c7" opacity="0.235023"/>
    </pattern>
    <pattern id="sv-stripe-amber" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#fef3c7"/>
      <rect y="1" width="10" height="2" fill="#d97706" opacity="0.264249"/>
      <rect y="6" width="10" height="1.5" fill="#d97706" opacity="0.264249"/>
    </pattern>
    <pattern id="legacy-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#f1f5f9"/>
      <rect x="0" y="0" width="10" height="2" fill="#64748b" opacity="0.361702"/>
    </pattern>
  </defs>

  <style>
    :root { color-scheme: light; }
    .bg { fill: #f8fafc; }
    .grid { stroke: #e2e8f0; stroke-width: 1; opacity: 0.7; }
    .title { fill: #0f172a; font: 700 34px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .subtitle { fill: #475569; font: 500 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .lane-title { fill: #334155; font: 700 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .node-title { fill: #0f172a; font: 700 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .small { fill: #475569; font: 500 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .mono { fill: #334155; font: 600 11px Consolas, "Cascadia Mono", monospace; letter-spacing: 0; }
    .tag { fill: #ffffff; font: 700 10px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .note-text { fill: #0f172a; font: 600 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .lane { fill: #ffffff; stroke: #dbe3ef; stroke-width: 1.2; filter: url(#shadow); }
    .node { stroke-width: 1.5; filter: url(#shadow); }
    .edge { stroke: #334155; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
    .edge-blue { stroke: #2563eb; stroke-width: 2.2; fill: none; marker-end: url(#arrow-blue); }
    .edge-green { stroke: #059669; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
    .edge-orange { stroke: #ea580c; stroke-width: 2.2; fill: none; marker-end: url(#arrow-orange); }
    .edge-dash { stroke: #64748b; stroke-width: 1.9; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    .edge-dash-orange { stroke: #ea580c; stroke-width: 1.9; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow-orange); }
  </style>

  <rect class="bg" x="0" y="0" width="1660" height="1080"/>
  <g opacity="0.65">
    <line class="grid" x1="40" y1="86" x2="40" y2="1044"/><line class="grid" x1="120" y1="86" x2="120" y2="1044"/><line class="grid" x1="200" y1="86" x2="200" y2="1044"/><line class="grid" x1="280" y1="86" x2="280" y2="1044"/><line class="grid" x1="360" y1="86" x2="360" y2="1044"/><line class="grid" x1="440" y1="86" x2="440" y2="1044"/><line class="grid" x1="520" y1="86" x2="520" y2="1044"/><line class="grid" x1="600" y1="86" x2="600" y2="1044"/><line class="grid" x1="680" y1="86" x2="680" y2="1044"/><line class="grid" x1="760" y1="86" x2="760" y2="1044"/><line class="grid" x1="840" y1="86" x2="840" y2="1044"/><line class="grid" x1="920" y1="86" x2="920" y2="1044"/><line class="grid" x1="1000" y1="86" x2="1000" y2="1044"/><line class="grid" x1="1080" y1="86" x2="1080" y2="1044"/><line class="grid" x1="1160" y1="86" x2="1160" y2="1044"/><line class="grid" x1="1240" y1="86" x2="1240" y2="1044"/><line class="grid" x1="1320" y1="86" x2="1320" y2="1044"/><line class="grid" x1="1400" y1="86" x2="1400" y2="1044"/><line class="grid" x1="1480" y1="86" x2="1480" y2="1044"/><line class="grid" x1="1560" y1="86" x2="1560" y2="1044"/><line class="grid" x1="1640" y1="86" x2="1640" y2="1044"/>
    <line class="grid" x1="30" y1="120" x2="1630" y2="120"/><line class="grid" x1="30" y1="200" x2="1630" y2="200"/><line class="grid" x1="30" y1="280" x2="1630" y2="280"/><line class="grid" x1="30" y1="360" x2="1630" y2="360"/><line class="grid" x1="30" y1="440" x2="1630" y2="440"/><line class="grid" x1="30" y1="520" x2="1630" y2="520"/><line class="grid" x1="30" y1="600" x2="1630" y2="600"/><line class="grid" x1="30" y1="680" x2="1630" y2="680"/><line class="grid" x1="30" y1="760" x2="1630" y2="760"/><line class="grid" x1="30" y1="840" x2="1630" y2="840"/><line class="grid" x1="30" y1="920" x2="1630" y2="920"/><line class="grid" x1="30" y1="1000" x2="1630" y2="1000"/>
  </g>

  <text class="title" x="48" y="54">ScenePlacementActor Runtime Orchestration</text>
  <text class="subtitle" x="48" y="82">SPA owns descriptor registration and profile GPU buffers; SV committer, GPU runtime, and TargetSV_B remain borrowed owners.</text>

  <g>
    <rect class="lane" x="45" y="115" width="355" height="805" rx="8"/>
    <text class="lane-title" x="63" y="141">ASSET INPUTS</text>
    <rect class="lane" x="440" y="115" width="355" height="805" rx="8"/>
    <text class="lane-title" x="458" y="141">SPA OWNED STATE</text>
    <rect class="lane" x="835" y="115" width="355" height="805" rx="8"/>
    <text class="lane-title" x="853" y="141">PIPELINE WORKERS</text>
    <rect class="lane" x="1230" y="115" width="385" height="805" rx="8"/>
    <text class="lane-title" x="1248" y="141">BORROWED OWNERS</text>
  </g>

  <g>
    <path class="edge-green" d="M 222 280 L 222 325"/>
    <path class="edge-blue" d="M 222 445 L 222 495"/>
    <path class="edge-blue" d="M 360 565 L 430 565 L 430 405 L 475 405"/>
    <path class="edge-dash" d="M 222 635 L 222 695"/>
    <path class="edge-green" d="M 615 485 L 615 535"/>
    <path class="edge-green" d="M 755 410 L 830 410 L 830 220 L 870 220"/>
    <path class="edge-green" d="M 755 425 L 870 560"/>
    <path class="edge-dash" d="M 1270 215 L 1195 215 L 1195 200 L 1155 200"/>
    <path class="edge-dash" d="M 1270 382 L 1195 382 L 1195 240 L 1155 240"/>
    <path class="edge" d="M 1012 285 L 1012 325"/>
    <path class="edge" d="M 1012 440 L 1012 495"/>
    <path class="edge-orange" d="M 1012 625 L 1012 695"/>
    <path class="edge-orange" d="M 1150 752 L 1265 565"/>
    <path class="edge-dash-orange" d="M 1150 560 L 1265 752"/>
    <path class="edge-dash" d="M 1420 625 L 1420 680"/>
    <text class="mono" x="642" y="396">profile buffers</text>
    <text class="mono" x="1028" y="676">accepted placements</text>
    <text class="mono" x="1182" y="642">writeback</text>
  </g>

  <g>
    <g id="descriptor-source">
      <rect class="node" x="85" y="165" width="275" height="115" rx="8" fill="url(#descriptor-grid)" stroke="#16a34a"/>
      <text class="node-title" x="103" y="193">AssetDescriptor</text>
      <text class="small"><tspan x="103" y="215">asset semantic source</tspan><tspan x="103" y="232">probes / collision / pivots</tspan><tspan x="103" y="249">descriptor-backed defaults</tspan></text>
    </g>

    <g id="register-asset">
      <rect class="node" x="85" y="330" width="275" height="115" rx="8" fill="#ffffff" stroke="#2563eb"/>
      <rect x="85" y="330" width="275" height="26" rx="8" fill="#2563eb"/>
      <text class="tag" x="103" y="348">register_asset()</text>
      <text class="small"><tspan x="103" y="378">register_descriptor()</tspan><tspan x="103" y="395">upload_profiles() immediately</tspan><tspan x="103" y="412">returns stable profile_id</tspan></text>
    </g>

    <g id="asset-registry">
      <rect class="node" x="85" y="500" width="275" height="135" rx="8" fill="#eff6ff" stroke="#2563eb"/>
      <text class="node-title" x="103" y="528">Asset registry</text>
      <text class="mono"><tspan x="103" y="552">_registered_descriptors[i]</tspan><tspan x="103" y="570">_registered_profile_ids[i]</tspan><tspan x="103" y="588">_registered_mesh[i]</tspan><tspan x="103" y="606">_registered_autoobject_refs[i]</tspan></text>
    </g>

    <g id="lightweight-wrapper-cache">
      <rect class="node" x="85" y="700" width="275" height="105" rx="8" fill="url(#legacy-hatch)" stroke="#64748b"/>
      <text class="node-title" x="103" y="728">Lightweight wrappers</text>
      <text class="small"><tspan x="103" y="750">created only when scene node is absent</tspan><tspan x="103" y="767">meta: asset_id + profile_id</tspan></text>
    </g>

    <g id="scene-placement-actor">
      <rect class="node" x="480" y="160" width="275" height="125" rx="8" fill="url(#autoobject-dot-bg)" stroke="#0891b2"/>
      <text class="node-title" x="498" y="188">ScenePlacementActor</text>
      <text class="small"><tspan x="498" y="210">single runtime entry</tspan><tspan x="498" y="227">owns profile container lifecycle</tspan><tspan x="498" y="244">orchestrates prefilter / VPG / commit</tspan></text>
    </g>

    <g id="runtime-profile-container">
      <rect class="node" x="480" y="340" width="275" height="145" rx="8" fill="url(#descriptor-grid)" stroke="#16a34a"/>
      <text class="node-title" x="498" y="368">RuntimeProfileContainer</text>
      <text class="small"><tspan x="498" y="390">profile_table buffer</tspan><tspan x="498" y="407">probe_records buffer</tspan><tspan x="498" y="424">pivot_records buffer</tspan><tspan x="498" y="441">GPU resident after upload</tspan></text>
    </g>

    <g id="gpu-readiness-api">
      <rect class="node" x="480" y="540" width="275" height="110" rx="8" fill="#dbeafe" stroke="#0284c7"/>
      <text class="node-title" x="498" y="568">GPU readiness API</text>
      <text class="small"><tspan x="498" y="590">is_gpu_ready()</tspan><tspan x="498" y="607">get_gpu_readiness_report()</tspan><tspan x="498" y="624">get_merged_gpu_buffer_summary()</tspan></text>
    </g>

    <g id="brush-control-metadata">
      <rect class="node" x="480" y="700" width="275" height="105" rx="8" fill="#f8fafc" stroke="#64748b"/>
      <text class="node-title" x="498" y="728">BrushSV control metadata</text>
      <text class="small"><tspan x="498" y="750">owner / lifecycle / dirty keys</tspan><tspan x="498" y="767">no content mirror in CPU state</tspan></text>
    </g>

    <g id="prefilter-worker">
      <rect class="node" x="875" y="160" width="275" height="125" rx="8" fill="#eff6ff" stroke="#2563eb"/>
      <rect x="875" y="160" width="275" height="26" rx="8" fill="#2563eb"/>
      <text class="tag" x="893" y="178">Phase 0: AutoObjectProbePrefilterGPU</text>
      <text class="small"><tspan x="893" y="210">SV + TargetSV_B sampling</tspan><tspan x="893" y="227">borrowed probe_records</tspan><tspan x="893" y="244">transient probe_range_buf</tspan><tspan x="893" y="261">output: candidate regions</tspan></text>
    </g>

    <g id="candidate-regions">
      <rect class="node" x="875" y="330" width="275" height="110" rx="8" fill="#f1f5f9" stroke="#64748b"/>
      <text class="node-title" x="893" y="358">candidate_voxel_regions_by_asset</text>
      <text class="small"><tspan x="893" y="380">readback route view</tspan><tspan x="893" y="397">per asset candidate region list</tspan><tspan x="893" y="414">stored only in last result</tspan></text>
    </g>

    <g id="placement-worker">
      <rect class="node" x="875" y="500" width="275" height="125" rx="8" fill="#eff6ff" stroke="#2563eb"/>
      <rect x="875" y="500" width="275" height="26" rx="8" fill="#2563eb"/>
      <text class="tag" x="893" y="518">Phase 1: VoxelPlacementGenerator</text>
      <text class="small"><tspan x="893" y="550">candidate regions -> placements</tspan><tspan x="893" y="567">profile / collision / pivot buffers</tspan><tspan x="893" y="584">same-type exclusion + physical score</tspan><tspan x="893" y="601">optional GPU runtime writeback</tspan></text>
    </g>

    <g id="commit-result">
      <rect class="node" x="875" y="700" width="275" height="105" rx="8" fill="url(#sv-stripe-amber)" stroke="#d97706"/>
      <text class="node-title" x="893" y="728">Phase 2: Commit + result</text>
      <text class="small"><tspan x="893" y="750">apply_instance_stamp_write_spec(record)</tspan><tspan x="893" y="767">updates _last_pipeline_result</tspan></text>
    </g>

    <g id="sv-resident-fields">
      <rect class="node" x="1270" y="160" width="300" height="115" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
      <text class="node-title" x="1288" y="188">SV[t - 1] resident fields</text>
      <text class="small"><tspan x="1288" y="210">complexity_field / collision_field</tspan><tspan x="1288" y="227">grid_size / voxel_size / origin</tspan><tspan x="1288" y="244">stable read input</tspan></text>
    </g>

    <g id="target-read-buffers">
      <rect class="node" x="1270" y="330" width="300" height="105" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
      <text class="node-title" x="1288" y="358">TargetSV_B read buffers</text>
      <text class="small"><tspan x="1288" y="380">target_completeness_bytes</tspan><tspan x="1288" y="397">target_visual_rgba8_bytes</tspan><tspan x="1288" y="414">guidance only, caller supplied</tspan></text>
    </g>

    <g id="scene-voxel-committer">
      <rect class="node" x="1270" y="500" width="300" height="125" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
      <text class="node-title" x="1288" y="528">SceneVoxelCommitter</text>
      <text class="small"><tspan x="1288" y="550">borrowed by SPA</tspan><tspan x="1288" y="567">SV grid + source/commit authority</tspan><tspan x="1288" y="584">SceneVoxelTile dirty sidecar</tspan><tspan x="1288" y="601">publishes committed SV</tspan></text>
    </g>

    <g id="gpu-autoobject-runtime">
      <rect class="node" x="1270" y="700" width="300" height="105" rx="8" fill="url(#autoobject-dot-bg)" stroke="#0891b2"/>
      <text class="node-title" x="1288" y="728">GPUAutoObjectRuntime</text>
      <text class="small"><tspan x="1288" y="750">borrowed object SoA buffers</tspan><tspan x="1288" y="767">spawn/update/free writeback</tspan></text>
    </g>
  </g>

  <g>
    <rect class="node" x="85" y="955" width="1490" height="78" rx="8" fill="url(#legacy-hatch)" stroke="#64748b"/>
    <text class="note-text" x="103" y="980">Boundary</text>
    <text class="small"><tspan x="103" y="1002">SPA is the public entry for descriptor registration, GPU buffer readiness, and the per-frame pipeline.</tspan><tspan x="103" y="1019">It owns RuntimeProfileContainer, but it does not own SV grid/commit, GPU object runtime state, TargetSV_B content, or SceneVoxelTile dirty sidecars.</tspan></text>
  </g>
</svg>
