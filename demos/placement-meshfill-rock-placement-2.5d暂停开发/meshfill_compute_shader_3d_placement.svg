<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1100" viewBox="0 0 1700 1100" role="img" aria-labelledby="title desc">
  <title id="title">MeshFill Placement Fitting Pipeline</title>
  <desc id="desc">Compute shader 3D placement and 2.5D heightfield fitting flow from meshfill-rock-placement-flow.md.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#ea580c"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <pattern id="autoobject-dot-bg" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#cffafe"/>
      <circle cx="3" cy="3" r="1.25" fill="#0891b2" opacity="0.256281"/>
      <circle cx="9" cy="9" r="1.25" fill="#0891b2" opacity="0.256281"/>
    </pattern>
    <pattern id="descriptor-grid" patternUnits="userSpaceOnUse" width="9.3334" height="9.3334">
      <rect width="9.3334" height="9.3334" fill="#dcfce7"/>
      <path d="M4.6667 0H0V4.6667" stroke="#16a34a" stroke-width="0.3333" opacity="0.257576"/>
      <path d="M0 4.6667L4.6667 0" stroke="#16a34a" stroke-width="0.3333" opacity="0.257576"/>
    </pattern>
    <pattern id="sv-stripe-blue" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#dbeafe"/>
      <rect y="1" width="10" height="2" fill="#0284c7" opacity="0.235023"/>
      <rect y="6" width="10" height="1.5" fill="#0284c7" opacity="0.235023"/>
    </pattern>
    <pattern id="sv-stripe-amber" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#fef3c7"/>
      <rect y="1" width="10" height="2" fill="#d97706" opacity="0.264249"/>
      <rect y="6" width="10" height="1.5" fill="#d97706" opacity="0.264249"/>
    </pattern>
    <pattern id="note-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#f1f5f9"/>
      <rect x="0" y="0" width="10" height="2" fill="#64748b" opacity="0.361702"/>
    </pattern>
  </defs>
  <style>
    :root { color-scheme: light; }
    .bg { fill: #f8fafc; }
    .grid { stroke: #e2e8f0; stroke-width: 1; opacity: 0.7; }
    .title { fill: #0f172a; font: 700 34px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .subtitle { fill: #475569; font: 500 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .lane-title { fill: #334155; font: 700 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .node-title { fill: #0f172a; font: 700 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .small { fill: #475569; font: 500 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .mono { fill: #334155; font: 600 11px Consolas, "Cascadia Mono", monospace; letter-spacing: 0; }
    .note-text { fill: #0f172a; font: 600 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .lane { fill: #ffffff; stroke: #dbe3ef; stroke-width: 1.2; filter: url(#shadow); }
    .node { stroke-width: 1.5; filter: url(#shadow); }
    .edge { stroke: #334155; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
    .edge-blue { stroke: #2563eb; stroke-width: 2.2; fill: none; marker-end: url(#arrow-blue); }
    .edge-green { stroke: #059669; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
    .edge-orange { stroke: #ea580c; stroke-width: 2.2; fill: none; marker-end: url(#arrow-orange); }
    .edge-dash { stroke: #64748b; stroke-width: 1.9; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    .edge-warn { stroke: #dc2626; stroke-width: 2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
  </style>

  <rect class="bg" x="0" y="0" width="1700" height="1100"/>
  <g opacity="0.65"><line class="grid" x1="40" y1="86" x2="40" y2="1064"/><line class="grid" x1="120" y1="86" x2="120" y2="1064"/><line class="grid" x1="200" y1="86" x2="200" y2="1064"/><line class="grid" x1="280" y1="86" x2="280" y2="1064"/><line class="grid" x1="360" y1="86" x2="360" y2="1064"/><line class="grid" x1="440" y1="86" x2="440" y2="1064"/><line class="grid" x1="520" y1="86" x2="520" y2="1064"/><line class="grid" x1="600" y1="86" x2="600" y2="1064"/><line class="grid" x1="680" y1="86" x2="680" y2="1064"/><line class="grid" x1="760" y1="86" x2="760" y2="1064"/><line class="grid" x1="840" y1="86" x2="840" y2="1064"/><line class="grid" x1="920" y1="86" x2="920" y2="1064"/><line class="grid" x1="1000" y1="86" x2="1000" y2="1064"/><line class="grid" x1="1080" y1="86" x2="1080" y2="1064"/><line class="grid" x1="1160" y1="86" x2="1160" y2="1064"/><line class="grid" x1="1240" y1="86" x2="1240" y2="1064"/><line class="grid" x1="1320" y1="86" x2="1320" y2="1064"/><line class="grid" x1="1400" y1="86" x2="1400" y2="1064"/><line class="grid" x1="1480" y1="86" x2="1480" y2="1064"/><line class="grid" x1="1560" y1="86" x2="1560" y2="1064"/><line class="grid" x1="1640" y1="86" x2="1640" y2="1064"/><line class="grid" x1="30" y1="120" x2="1670" y2="120"/><line class="grid" x1="30" y1="200" x2="1670" y2="200"/><line class="grid" x1="30" y1="280" x2="1670" y2="280"/><line class="grid" x1="30" y1="360" x2="1670" y2="360"/><line class="grid" x1="30" y1="440" x2="1670" y2="440"/><line class="grid" x1="30" y1="520" x2="1670" y2="520"/><line class="grid" x1="30" y1="600" x2="1670" y2="600"/><line class="grid" x1="30" y1="680" x2="1670" y2="680"/><line class="grid" x1="30" y1="760" x2="1670" y2="760"/><line class="grid" x1="30" y1="840" x2="1670" y2="840"/><line class="grid" x1="30" y1="920" x2="1670" y2="920"/><line class="grid" x1="30" y1="1000" x2="1670" y2="1000"/><line class="grid" x1="30" y1="1080" x2="1670" y2="1080"/></g>
  <text class="title" x="48" y="54">MeshFill Placement Fitting Pipeline</text>
  <text class="subtitle" x="48" y="82">Heightfield fitting producer used by the rock/cliff consumer, then CPU instancing writes into the scene voxel system.</text>
  <g>
    <rect class="lane" x="45" y="115" width="345" height="820" rx="8"/>
    <text class="lane-title" x="63" y="141">INPUT TEXTURES + ASSETS</text>
    <rect class="lane" x="430" y="115" width="345" height="820" rx="8"/>
    <text class="lane-title" x="448" y="141">SETUP PASSES</text>
    <rect class="lane" x="815" y="115" width="405" height="820" rx="8"/>
    <text class="lane-title" x="833" y="141">ITERATIVE FITTING LOOP</text>
    <rect class="lane" x="1260" y="115" width="395" height="820" rx="8"/>
    <text class="lane-title" x="1278" y="141">READBACK + RUNTIME</text>
  </g>
  <g>
    <path class="edge-blue" d="M 350 225 L 470 207"/>
    <path class="edge-orange" d="M 350 422 L 860 213"/>
    <path class="edge" d="M 602 260 L 602 310"/>
    <path class="edge" d="M 602 415 L 602 465"/>
    <path class="edge" d="M 602 560 L 602 615"/>
    <path class="edge-orange" d="M 735 665 L 860 210"/>
    <path class="edge" d="M 1015 270 L 1015 335"/>
    <path class="edge" d="M 1015 450 L 1015 520"/>
    <path class="edge" d="M 1015 645 L 1015 720"/>
    <path class="edge-dash" d="M 860 772 L 810 772 L 810 212 L 860 212"/>
    <text class="mono" x="820" y="700">iterate</text>
    <path class="edge-green" d="M 1170 772 L 1300 230"/>
    <path class="edge" d="M 1455 290 L 1455 370"/>
    <path class="edge-orange" d="M 1455 495 L 1455 585"/>
    <path class="edge-blue" d="M 1455 705 L 1455 780"/>
  </g>
  <g>
    <g id="scene-input-textures">
    <rect class="node" x="85" y="160" width="265" height="130" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text class="node-title" x="103" y="188">Scene input textures</text>
    <text class="small"><tspan x="103" y="210">scene_depth -&gt; height</tspan><tspan x="103" y="227">scene_normal</tspan><tspan x="103" y="244">object_depth / normal</tspan><tspan x="103" y="261">target_height</tspan></text>
    </g>
    <g id="heightfield-object-assets">
    <rect class="node" x="85" y="360" width="265" height="125" rx="8" fill="#ffedd5" stroke="#ea580c"/>
    <text class="node-title" x="103" y="388">Heightfield object assets</text>
    <text class="small"><tspan x="103" y="410">mesh_height_texture</tspan><tspan x="103" y="427">mesh_size</tspan><tspan x="103" y="444">random rotate / scale</tspan><tspan x="103" y="461">height offset</tspan></text>
    </g>
    <g id="pass-1:-init">
    <rect class="node" x="470" y="155" width="265" height="105" rx="8" fill="url(#sv-stripe-amber)" stroke="#d97706"/>
    <text class="node-title" x="488" y="183">Pass 1: Init</text>
    <text class="small"><tspan x="488" y="205">current_scene_depth</tspan><tspan x="488" y="222">generate_mask</tspan><tspan x="488" y="239">un_generate_mask</tspan></text>
    </g>
    <g id="pass-1.5:-target-flood">
    <rect class="node" x="470" y="310" width="265" height="105" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text class="node-title" x="488" y="338">Pass 1.5: Target flood</text>
    <text class="small"><tspan x="488" y="360">propagate target height</tspan><tspan x="488" y="377">shared-memory 4-neighbor flood</tspan></text>
    </g>
    <g id="pass-1.6:-blur">
    <rect class="node" x="470" y="465" width="265" height="95" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text class="node-title" x="488" y="493">Pass 1.6: Blur</text>
    <text class="small"><tspan x="488" y="515">smooth flood artifacts</tspan><tspan x="488" y="532">Gaussian radius 7</tspan></text>
    </g>
    <g id="pass-2:-extent-mask">
    <rect class="node" x="470" y="615" width="265" height="100" rx="8" fill="url(#sv-stripe-amber)" stroke="#d97706"/>
    <text class="node-title" x="488" y="643">Pass 2: Extent mask</text>
    <text class="small"><tspan x="488" y="665">expand generate mask</tspan><tspan x="488" y="682">allow slight border crossing</tspan></text>
    </g>
    <g id="pass-3:-fill-heightfield-asset">
    <rect class="node" x="860" y="155" width="310" height="115" rx="8" fill="#ffedd5" stroke="#ea580c"/>
    <text class="node-title" x="878" y="183">Pass 3: Fill Heightfield Asset</text>
    <text class="small"><tspan x="878" y="205">evaluate candidate positions</tspan><tspan x="878" y="222">sample 16x16 asset height</tspan><tspan x="878" y="239">score coverage vs blockers</tspan></text>
    </g>
    <g id="pass-4:-find-best-pixel">
    <rect class="node" x="860" y="335" width="310" height="115" rx="8" fill="#ffedd5" stroke="#ea580c"/>
    <text class="node-title" x="878" y="363">Pass 4: Find Best Pixel</text>
    <text class="small"><tspan x="878" y="385">group best candidate</tspan><tspan x="878" y="402">5x5 dedupe</tspan><tspan x="878" y="419">atomic write result buffer</tspan></text>
    </g>
    <g id="pass-5:-update-current-height">
    <rect class="node" x="860" y="520" width="310" height="125" rx="8" fill="#ffedd5" stroke="#ea580c"/>
    <text class="node-title" x="878" y="548">Pass 5: Update Current Height</text>
    <text class="small"><tspan x="878" y="570">stamp selected rock height</tspan><tspan x="878" y="587">new_height = max(current, draw_h)</tspan><tspan x="878" y="604">stamp_overlap controls blending</tspan></text>
    </g>
    <g id="ping-pong-buffers">
    <rect class="node" x="860" y="720" width="310" height="105" rx="8" fill="url(#sv-stripe-amber)" stroke="#d97706"/>
    <text class="node-title" x="878" y="748">Ping-pong buffers</text>
    <text class="small"><tspan x="878" y="770">result_a / result_b</tspan><tspan x="878" y="787">repeat num_iterations</tspan><tspan x="878" y="804">default 50 iterations</tspan></text>
    </g>
    <g id="readback-placement-results">
    <rect class="node" x="1300" y="170" width="310" height="120" rx="8" fill="#ccfbf1" stroke="#0f766e"/>
    <text class="node-title" x="1318" y="198">Readback placement results</text>
    <text class="small"><tspan x="1318" y="220">UV position</tspan><tspan x="1318" y="237">rotation / scale</tspan><tspan x="1318" y="254">mesh index</tspan><tspan x="1318" y="271">result height</tspan></text>
    </g>
    <g id="cpu-object-instancing">
    <rect class="node" x="1300" y="370" width="310" height="125" rx="8" fill="url(#autoobject-dot-bg)" stroke="#0891b2"/>
    <text class="node-title" x="1318" y="398">CPU object instancing</text>
    <text class="small"><tspan x="1318" y="420">convert UV to world position</tspan><tspan x="1318" y="437">copy descriptor-backed asset</tspan><tspan x="1318" y="454">add MeshInstance3D node</tspan></text>
    </g>
    <g id="instance_stamp_write_spec-output">
    <rect class="node" x="1300" y="585" width="310" height="120" rx="8" fill="url(#sv-stripe-amber)" stroke="#d97706"/>
    <text class="node-title" x="1318" y="613">ISWS output</text>
    <text class="small"><tspan x="1318" y="635">instance_stamp_write_spec</tspan><tspan x="1318" y="652">collision footprint</tspan><tspan x="1318" y="669">source write path</tspan></text>
    </g>
    <g id="scenevoxel-integration">
    <rect class="node" x="1300" y="780" width="310" height="105" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
    <text class="node-title" x="1318" y="808">SceneVoxel integration</text>
    <text class="small"><tspan x="1318" y="830">AutoSceneVoxel source</tspan><tspan x="1318" y="847">blend_scene_voxels()</tspan><tspan x="1318" y="864">resident SV dirty update</tspan></text>
    </g>
  </g>
  <g>
    <g>
    <rect x="470" y="825" width="700" height="78" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
    <text class="note-text" x="484" y="849">Consumer boundary</text>
    <text class="small"><tspan x="484" y="870">PlacementFittingGenerator is the generic heightfield fitting producer; object placement is one consumer that instantiates descriptor-backed assets after readback.</tspan></text>
  </g>
  </g>
</svg>
