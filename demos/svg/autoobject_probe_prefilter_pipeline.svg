<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="980" viewBox="0 0 1640 980" role="img" aria-labelledby="title desc">
  <title id="title">AutoObject Probe Prefilter Pipeline</title>
  <desc id="desc">AutoObject probe prefilter pipeline from autoobject-probe-prefilter.md.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#ea580c"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <pattern id="autoobject-dot-bg" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#cffafe"/>
      <circle cx="3" cy="3" r="1.25" fill="#0891b2" opacity="0.256281"/>
      <circle cx="9" cy="9" r="1.25" fill="#0891b2" opacity="0.256281"/>
    </pattern>
    <pattern id="descriptor-grid" patternUnits="userSpaceOnUse" width="9.3334" height="9.3334">
      <rect width="9.3334" height="9.3334" fill="#dcfce7"/>
      <path d="M4.6667 0H0V4.6667" stroke="#16a34a" stroke-width="0.3333" opacity="0.257576"/>
      <path d="M0 4.6667L4.6667 0" stroke="#16a34a" stroke-width="0.3333" opacity="0.257576"/>
    </pattern>
    <pattern id="sv-stripe-blue" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#dbeafe"/>
      <rect y="1" width="10" height="2" fill="#0284c7" opacity="0.235023"/>
      <rect y="6" width="10" height="1.5" fill="#0284c7" opacity="0.235023"/>
    </pattern>
    <pattern id="sv-stripe-amber" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#fef3c7"/>
      <rect y="1" width="10" height="2" fill="#d97706" opacity="0.264249"/>
      <rect y="6" width="10" height="1.5" fill="#d97706" opacity="0.264249"/>
    </pattern>
    <pattern id="note-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#f1f5f9"/>
      <rect x="0" y="0" width="10" height="2" fill="#64748b" opacity="0.361702"/>
    </pattern>
  </defs>
  <style>
    :root { color-scheme: light; }
    .bg { fill: #f8fafc; }
    .grid { stroke: #e2e8f0; stroke-width: 1; opacity: 0.7; }
    .title { fill: #0f172a; font: 700 34px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .subtitle { fill: #475569; font: 500 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .lane-title { fill: #334155; font: 700 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .node-title { fill: #0f172a; font: 700 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .small { fill: #475569; font: 500 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .mono { fill: #334155; font: 600 11px Consolas, "Cascadia Mono", monospace; letter-spacing: 0; }
    .note-text { fill: #0f172a; font: 600 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .lane { fill: #ffffff; stroke: #dbe3ef; stroke-width: 1.2; filter: url(#shadow); }
    .node { stroke-width: 1.5; filter: url(#shadow); }
    .edge { stroke: #334155; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
    .edge-blue { stroke: #2563eb; stroke-width: 2.2; fill: none; marker-end: url(#arrow-blue); }
    .edge-green { stroke: #059669; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
    .edge-orange { stroke: #ea580c; stroke-width: 2.2; fill: none; marker-end: url(#arrow-orange); }
    .edge-dash { stroke: #64748b; stroke-width: 1.9; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    .edge-warn { stroke: #dc2626; stroke-width: 2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
  </style>

  <rect class="bg" x="0" y="0" width="1640" height="980"/>
  <g opacity="0.65"><line class="grid" x1="40" y1="86" x2="40" y2="944"/><line class="grid" x1="120" y1="86" x2="120" y2="944"/><line class="grid" x1="200" y1="86" x2="200" y2="944"/><line class="grid" x1="280" y1="86" x2="280" y2="944"/><line class="grid" x1="360" y1="86" x2="360" y2="944"/><line class="grid" x1="440" y1="86" x2="440" y2="944"/><line class="grid" x1="520" y1="86" x2="520" y2="944"/><line class="grid" x1="600" y1="86" x2="600" y2="944"/><line class="grid" x1="680" y1="86" x2="680" y2="944"/><line class="grid" x1="760" y1="86" x2="760" y2="944"/><line class="grid" x1="840" y1="86" x2="840" y2="944"/><line class="grid" x1="920" y1="86" x2="920" y2="944"/><line class="grid" x1="1000" y1="86" x2="1000" y2="944"/><line class="grid" x1="1080" y1="86" x2="1080" y2="944"/><line class="grid" x1="1160" y1="86" x2="1160" y2="944"/><line class="grid" x1="1240" y1="86" x2="1240" y2="944"/><line class="grid" x1="1320" y1="86" x2="1320" y2="944"/><line class="grid" x1="1400" y1="86" x2="1400" y2="944"/><line class="grid" x1="1480" y1="86" x2="1480" y2="944"/><line class="grid" x1="1560" y1="86" x2="1560" y2="944"/><line class="grid" x1="30" y1="120" x2="1610" y2="120"/><line class="grid" x1="30" y1="200" x2="1610" y2="200"/><line class="grid" x1="30" y1="280" x2="1610" y2="280"/><line class="grid" x1="30" y1="360" x2="1610" y2="360"/><line class="grid" x1="30" y1="440" x2="1610" y2="440"/><line class="grid" x1="30" y1="520" x2="1610" y2="520"/><line class="grid" x1="30" y1="600" x2="1610" y2="600"/><line class="grid" x1="30" y1="680" x2="1610" y2="680"/><line class="grid" x1="30" y1="760" x2="1610" y2="760"/><line class="grid" x1="30" y1="840" x2="1610" y2="840"/><line class="grid" x1="30" y1="920" x2="1610" y2="920"/></g>
  <text class="title" x="48" y="54">AutoObject Probe Prefilter Pipeline</text>
  <text class="subtitle" x="48" y="82">GPU-only coarse filtering from dirty regions to per-asset candidate voxel regions.</text>
  <g>
    <rect class="lane" x="50" y="115" width="340" height="720" rx="8"/>
    <text class="lane-title" x="68" y="141">INPUTS</text>
    <rect class="lane" x="430" y="115" width="520" height="720" rx="8"/>
    <text class="lane-title" x="448" y="141">GPU DISPATCH</text>
    <rect class="lane" x="990" y="115" width="600" height="720" rx="8"/>
    <text class="lane-title" x="1008" y="141">READBACK + PLACEMENT CONTRACT</text>
  </g>
  <g>
    <path class="edge-blue" d="M 350 205 L 470 195"/>
    <path class="edge-blue" d="M 350 368 L 470 338"/>
    <path class="edge-green" d="M 350 530 L 470 338"/>
    <path class="edge" d="M 350 695 L 470 195"/>
    <path class="edge" d="M 625 240 L 625 285"/>
    <path class="edge" d="M 625 390 L 625 445"/>
    <path class="edge" d="M 625 540 L 625 595"/>
    <path class="edge-orange" d="M 780 650 L 1035 210"/>
    <path class="edge" d="M 1185 265 L 1185 330"/>
    <path class="edge" d="M 1185 455 L 1185 525"/>
    <path class="edge-orange" d="M 1185 640 L 1185 705"/>
    <path class="edge-dash" d="M 1335 390 L 1380 410"/>
  </g>
  <g>
    <g id="sv[t---1]-fields">
    <rect class="node" x="85" y="155" width="265" height="105" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
    <text class="node-title" x="103" y="183">SV[t - 1] fields</text>
    <text class="small"><tspan x="103" y="205">complexity_field</tspan><tspan x="103" y="222">collision_field</tspan><tspan x="103" y="239">BlendSV-backed resident input</tspan></text>
    </g>
    <g id="targetsv_b-buffers">
    <rect class="node" x="85" y="315" width="265" height="105" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
    <text class="node-title" x="103" y="343">TargetSV_B buffers</text>
    <text class="small"><tspan x="103" y="365">target_occupancy</tspan><tspan x="103" y="382">target_color</tspan><tspan x="103" y="399">brush-composited target</tspan></text>
    </g>
    <g id="autoobject-registry">
    <rect class="node" x="85" y="475" width="265" height="115" rx="8" fill="url(#autoobject-dot-bg)" stroke="#0891b2"/>
    <text class="node-title" x="103" y="503">AutoObject registry</text>
    <text class="small"><tspan x="103" y="525">descriptor-backed probes</tspan><tspan x="103" y="542">collision footprint</tspan><tspan x="103" y="559">context radius</tspan></text>
    </g>
    <g id="dirty-voxel-regions">
    <rect class="node" x="85" y="650" width="265" height="90" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text class="node-title" x="103" y="678">Dirty voxel regions</text>
    <text class="small"><tspan x="103" y="700">anchor collection scope</tspan><tspan x="103" y="717">dirty tiles</tspan></text>
    </g>
    <g id="collect_sv_anchors.glsl">
    <rect class="node" x="470" y="150" width="310" height="90" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text class="node-title" x="488" y="178">collect_sv_anchors.glsl</text>
    <text class="small"><tspan x="488" y="200">supported candidates</tspan></text>
    </g>
    <g id="score_anchor_asset_probes.glsl">
    <rect class="node" x="470" y="285" width="310" height="105" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text class="node-title" x="488" y="313">score_anchor_asset_probes.glsl</text>
    <text class="small"><tspan x="488" y="335">anchor x asset x probe</tspan><tspan x="488" y="352">sample SV + TargetSV_B</tspan></text>
    </g>
    <g id="select_anchor_topk.glsl">
    <rect class="node" x="470" y="445" width="310" height="95" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text class="node-title" x="488" y="473">select_anchor_topk.glsl</text>
    <text class="small"><tspan x="488" y="495">top-K assets per anchor</tspan><tspan x="488" y="512">internal GPU buffer</tspan></text>
    </g>
    <g id="reduce_anchor_topk_to_voxel_regions.glsl">
    <rect class="node" x="470" y="595" width="310" height="105" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text class="node-title" x="488" y="623">reduce_anchor_topk_to_voxel_regions.glsl</text>
    <text class="small"><tspan x="488" y="645">per-asset voxel-region votes</tspan><tspan x="488" y="662">vote tile only</tspan></text>
    </g>
    <g id="readback-votes">
    <rect class="node" x="1035" y="155" width="300" height="110" rx="8" fill="url(#sv-stripe-amber)" stroke="#d97706"/>
    <text class="node-title" x="1053" y="183">Readback votes</text>
    <text class="small"><tspan x="1053" y="205">decode voted regions</tspan><tspan x="1053" y="222">anchors/debug counts</tspan><tspan x="1053" y="239">no CPU scoring fallback</tspan></text>
    </g>
    <g id="expand-route-profiles">
    <rect class="node" x="1035" y="330" width="300" height="125" rx="8" fill="url(#sv-stripe-amber)" stroke="#d97706"/>
    <text class="node-title" x="1053" y="358">Expand route profiles</text>
    <text class="small"><tspan x="1053" y="380">footprint bounds</tspan><tspan x="1053" y="397">probe offset bounds</tspan><tspan x="1053" y="414">context_sensing_radius</tspan><tspan x="1053" y="431">interpolation guard &gt;= 1</tspan></text>
    </g>
    <g id="candidate_voxel_regions_by_asset">
    <rect class="node" x="1035" y="525" width="300" height="115" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text class="node-title" x="1053" y="553">candidate_voxel_regions_by_asset</text>
    <text class="small"><tspan x="1053" y="575">debug view</tspan><tspan x="1053" y="592">per-asset candidate regions</tspan><tspan x="1053" y="609">empty list means skip</tspan></text>
    </g>
    <g id="voxelplacementgenerator">
    <rect class="node" x="1035" y="705" width="300" height="90" rx="8" fill="#ffedd5" stroke="#ea580c"/>
    <text class="node-title" x="1053" y="733">VoxelPlacementGenerator</text>
    <text class="small"><tspan x="1053" y="755">run_multi_asset()</tspan><tspan x="1053" y="772">physical scoring owns final fit</tspan></text>
    </g>
    <g id="debug-outputs">
    <rect class="node" x="1380" y="350" width="170" height="130" rx="8" fill="url(#note-hatch)" stroke="#64748b"/>
    <text class="node-title" x="1398" y="378">Debug outputs</text>
    <text class="small"><tspan x="1398" y="400">anchors</tspan><tspan x="1398" y="417">route profiles</tspan><tspan x="1398" y="434">candidate regions</tspan><tspan x="1398" y="451">anchor_count</tspan></text>
    </g>
  </g>
  <g>
    <g>
    <rect x="430" y="820" width="910" height="70" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
    <text class="note-text" x="444" y="844">Boundary</text>
    <text class="small"><tspan x="444" y="865">Prefilter reduces candidates only. It never writes SceneVoxel and never replaces score_voxel_tile.glsl physical scoring.</tspan></text>
  </g>
  </g>
</svg>
