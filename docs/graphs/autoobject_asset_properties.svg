  <rect class="node warn" x="78" y="842" width="1344" height="90" rx="18" ry="18"/>
  <text class="rule" x="108" y="876">Ownership rule:</text>
  <text class="label" x="228" y="876">AutoVoxelDescriptor owns defaults; AutoVegetationAsset references it externally; AutoObject builds voxel_write_spec.</text>
  <text class="tiny" x="108" y="906">Legacy mirror fields and AutoVoxelProfile are compatibility fallbacks; channel_entries remain explicit runtime payload entries.</text>
