<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">AutoObject Asset Properties Map</title>
  <desc id="desc">Asset property ownership map generated from asset-properties.md and auto-asset-scripting.md.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#ea580c"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <pattern id="autoobject-dot-bg" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#cffafe"/>
      <circle cx="3" cy="3" r="1.25" fill="#0891b2" opacity="0.256281"/>
      <circle cx="9" cy="9" r="1.25" fill="#0891b2" opacity="0.256281"/>
    </pattern>
    <pattern id="descriptor-grid" patternUnits="userSpaceOnUse" width="9.3334" height="9.3334">
      <rect width="9.3334" height="9.3334" fill="#dcfce7"/>
      <path d="M4.6667 0H0V4.6667" stroke="#16a34a" stroke-width="0.3333" opacity="0.257576"/>
      <path d="M0 4.6667L4.6667 0" stroke="#16a34a" stroke-width="0.3333" opacity="0.257576"/>
    </pattern>
    <pattern id="sv-stripe-blue" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#dbeafe"/>
      <rect y="1" width="10" height="2" fill="#0284c7" opacity="0.235023"/>
      <rect y="6" width="10" height="1.5" fill="#0284c7" opacity="0.235023"/>
    </pattern>
    <pattern id="sv-stripe-amber" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#fef3c7"/>
      <rect y="1" width="10" height="2" fill="#d97706" opacity="0.264249"/>
      <rect y="6" width="10" height="1.5" fill="#d97706" opacity="0.264249"/>
    </pattern>
    <pattern id="note-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#f1f5f9"/>
      <rect x="0" y="0" width="10" height="2" fill="#64748b" opacity="0.361702"/>
    </pattern>
  </defs>
  <style>
    :root { color-scheme: light; }
    .bg { fill: #f8fafc; }
    .grid { stroke: #e2e8f0; stroke-width: 1; opacity: 0.7; }
    .title { fill: #0f172a; font: 700 34px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .subtitle { fill: #475569; font: 500 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .lane-title { fill: #334155; font: 700 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .node-title { fill: #0f172a; font: 700 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .small { fill: #475569; font: 500 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .mono { fill: #334155; font: 600 11px Consolas, "Cascadia Mono", monospace; letter-spacing: 0; }
    .note-text { fill: #0f172a; font: 600 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .lane { fill: #ffffff; stroke: #dbe3ef; stroke-width: 1.2; filter: url(#shadow); }
    .node { stroke-width: 1.5; filter: url(#shadow); }
    .edge { stroke: #334155; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
    .edge-blue { stroke: #2563eb; stroke-width: 2.2; fill: none; marker-end: url(#arrow-blue); }
    .edge-green { stroke: #059669; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
    .edge-orange { stroke: #ea580c; stroke-width: 2.2; fill: none; marker-end: url(#arrow-orange); }
    .edge-dash { stroke: #64748b; stroke-width: 1.9; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    .edge-warn { stroke: #dc2626; stroke-width: 2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
  </style>

  <rect class="bg" x="0" y="0" width="1600" height="1040"/>
  <g opacity="0.65"><line class="grid" x1="40" y1="86" x2="40" y2="1004"/><line class="grid" x1="120" y1="86" x2="120" y2="1004"/><line class="grid" x1="200" y1="86" x2="200" y2="1004"/><line class="grid" x1="280" y1="86" x2="280" y2="1004"/><line class="grid" x1="360" y1="86" x2="360" y2="1004"/><line class="grid" x1="440" y1="86" x2="440" y2="1004"/><line class="grid" x1="520" y1="86" x2="520" y2="1004"/><line class="grid" x1="600" y1="86" x2="600" y2="1004"/><line class="grid" x1="680" y1="86" x2="680" y2="1004"/><line class="grid" x1="760" y1="86" x2="760" y2="1004"/><line class="grid" x1="840" y1="86" x2="840" y2="1004"/><line class="grid" x1="920" y1="86" x2="920" y2="1004"/><line class="grid" x1="1000" y1="86" x2="1000" y2="1004"/><line class="grid" x1="1080" y1="86" x2="1080" y2="1004"/><line class="grid" x1="1160" y1="86" x2="1160" y2="1004"/><line class="grid" x1="1240" y1="86" x2="1240" y2="1004"/><line class="grid" x1="1320" y1="86" x2="1320" y2="1004"/><line class="grid" x1="1400" y1="86" x2="1400" y2="1004"/><line class="grid" x1="1480" y1="86" x2="1480" y2="1004"/><line class="grid" x1="1560" y1="86" x2="1560" y2="1004"/><line class="grid" x1="30" y1="120" x2="1570" y2="120"/><line class="grid" x1="30" y1="200" x2="1570" y2="200"/><line class="grid" x1="30" y1="280" x2="1570" y2="280"/><line class="grid" x1="30" y1="360" x2="1570" y2="360"/><line class="grid" x1="30" y1="440" x2="1570" y2="440"/><line class="grid" x1="30" y1="520" x2="1570" y2="520"/><line class="grid" x1="30" y1="600" x2="1570" y2="600"/><line class="grid" x1="30" y1="680" x2="1570" y2="680"/><line class="grid" x1="30" y1="760" x2="1570" y2="760"/><line class="grid" x1="30" y1="840" x2="1570" y2="840"/><line class="grid" x1="30" y1="920" x2="1570" y2="920"/><line class="grid" x1="30" y1="1000" x2="1570" y2="1000"/></g>
  <text class="title" x="48" y="54">AutoObject Asset Properties Map</text>
  <text class="subtitle" x="48" y="82">Descriptor-owned semantics, descriptor-owned fields, shared fields, write records, and SceneVoxel payload boundaries.</text>
  <g>
    <rect class="lane" x="40" y="110" width="360" height="820" rx="8"/>
    <text class="lane-title" x="58" y="136">AUTHORING INPUTS</text>
    <rect class="lane" x="430" y="110" width="360" height="820" rx="8"/>
    <text class="lane-title" x="448" y="136">CANONICAL ASSET SEMANTICS</text>
    <rect class="lane" x="820" y="110" width="360" height="820" rx="8"/>
    <text class="lane-title" x="838" y="136">RUNTIME WRITE PATH</text>
    <rect class="lane" x="1210" y="110" width="350" height="820" rx="8"/>
    <text class="lane-title" x="1228" y="136">PUBLIC READ / DEBUG</text>
  </g>
  <g>
    <path class="edge-green" d="M 360 210 L 465 210"/>
    <path class="edge-dash" d="M 360 370 L 465 390"/>
    <text class="mono" x="383" y="358">sync</text>
    <path class="edge-orange" d="M 755 225 L 855 220"/>
    <path class="edge-orange" d="M 755 408 L 855 220"/>
    <text class="mono" x="760" y="345">getters</text>
    <path class="edge-orange" d="M 755 580 L 855 220"/>
    <text class="mono" x="764" y="530">normalize</text>
    <path class="edge" d="M 1000 280 L 1000 330"/>
    <path class="edge" d="M 1000 445 L 1000 500"/>
    <path class="edge-blue" d="M 1145 560 L 1245 225"/>
    <path class="edge-dash" d="M 1145 390 L 1245 410"/>
    <path class="edge-dash" d="M 360 540 L 465 580"/>
    <text class="mono" x="382" y="535">excluded</text>
  </g>
  <g>
    <g id="asset-config-/-inspector">
    <rect class="node" x="80" y="160" width="280" height="105" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text class="node-title" x="98" y="188">Asset config / Inspector</text>
    <text class="small"><tspan x="98" y="210">color, complexity, collision</tspan><tspan x="98" y="227">mesh, scatter, pivots</tspan><tspan x="98" y="244">object_type for grouping only</tspan></text>
    </g>
    <g id="descriptor-fields">
    <rect class="node" x="80" y="315" width="280" height="115" rx="8" fill="url(#note-hatch)" stroke="#64748b"/>
    <text class="node-title" x="98" y="343">Compatibility mirrors</text>
    <text class="small"><tspan x="98" y="365">AutoObject same-name fields</tspan><tspan x="98" y="382">sync into descriptor</tspan><tspan x="98" y="399">not a second authority</tspan></text>
    </g>
    <g id="non-shared-scatter-fields">
    <rect class="node" x="80" y="480" width="280" height="120" rx="8" fill="url(#note-hatch)" stroke="#64748b"/>
    <text class="node-title" x="98" y="508">Non-shared scatter fields</text>
    <text class="small"><tspan x="98" y="530">channel</tspan><tspan x="98" y="547">vegetation_channel / radius</tspan><tspan x="98" y="564">scatter-only, not semantic</tspan></text>
    </g>
    <g id="autovoxeldescriptor">
    <rect class="node" x="465" y="160" width="290" height="135" rx="8" fill="url(#descriptor-grid)" stroke="#16a34a"/>
    <text class="node-title" x="483" y="188">AutoVoxelDescriptor</text>
    <text class="small"><tspan x="483" y="210">canonical color</tspan><tspan x="483" y="227">canonical complexity</tspan><tspan x="483" y="244">canonical collision</tspan><tspan x="483" y="261">probes, pivots, mesh defaults</tspan></text>
    </g>
    <g id="autoobject-runtime-node">
    <rect class="node" x="465" y="350" width="290" height="115" rx="8" fill="url(#autoobject-dot-bg)" stroke="#0891b2"/>
    <text class="node-title" x="483" y="378">AutoObject runtime node</text>
    <text class="small"><tspan x="483" y="400">voxel_descriptor entry</tspan><tspan x="483" y="417">runtime identity and placement</tspan><tspan x="483" y="434">descriptor-backed getters</tspan></text>
    </g>
    <g id="sharedpropertytype">
    <rect class="node" x="465" y="520" width="290" height="120" rx="8" fill="url(#descriptor-grid)" stroke="#16a34a"/>
    <text class="node-title" x="483" y="548">SharedPropertyType</text>
    <text class="small"><tspan x="483" y="570">SHARED_FIELD_KEYS</tspan><tspan x="483" y="587">color</tspan><tspan x="483" y="604">complexity</tspan><tspan x="483" y="621">collision only</tspan></text>
    </g>
    <g id="instance_stamp_write_spec">
    <rect class="node" x="855" y="160" width="290" height="120" rx="8" fill="url(#sv-stripe-amber)" stroke="#d97706"/>
    <text class="node-title" x="873" y="188">ISWS</text>
    <text class="small"><tspan x="873" y="210">instance_stamp_write_spec</tspan><tspan x="873" y="227">canonical payload</tspan><tspan x="873" y="244">record/query handle</tspan></text>
    </g>
    <g id="source-write-streams">
    <rect class="node" x="855" y="330" width="290" height="115" rx="8" fill="url(#sv-stripe-amber)" stroke="#d97706"/>
    <text class="node-title" x="873" y="358">Source write streams</text>
    <text class="small"><tspan x="873" y="380">AutoSceneVoxel[tick]</tspan><tspan x="873" y="397">BrushSceneVoxel[tick]</tspan><tspan x="873" y="414">target guidance skipped</tspan></text>
    </g>
    <g id="committed-scenevoxel">
    <rect class="node" x="855" y="500" width="290" height="125" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
    <text class="node-title" x="873" y="528">Committed SceneVoxel</text>
    <text class="small"><tspan x="873" y="550">public payload is minimal</tspan><tspan x="873" y="567">complexity / color / collision</tspan><tspan x="873" y="584">optional auto_mix only</tspan></text>
    </g>
    <g id="sv-resident-fields">
    <rect class="node" x="1245" y="165" width="270" height="120" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
    <text class="node-title" x="1263" y="193">SV resident fields</text>
    <text class="small"><tspan x="1263" y="215">complexity_field</tspan><tspan x="1263" y="232">collision_field</tspan><tspan x="1263" y="249">dirty voxel regions</tspan></text>
    </g>
    <g id="metadata-/-debug-only">
    <rect class="node" x="1245" y="350" width="270" height="120" rx="8" fill="url(#note-hatch)" stroke="#64748b"/>
    <text class="node-title" x="1263" y="378">Metadata / debug only</text>
    <text class="small"><tspan x="1263" y="400">auto_id, source, instance_id</tspan><tspan x="1263" y="417">ISWS handle</tspan><tspan x="1263" y="434">not semantic defaults</tspan></text>
    </g>
    <g id="do-not-duplicate-authority">
    <rect class="node" x="1245" y="535" width="270" height="105" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text class="node-title" x="1263" y="563">Do not duplicate authority</text>
    <text class="small"><tspan x="1263" y="585">metadata is not config</tspan><tspan x="1263" y="602">ISWS is not descriptor</tspan></text>
    </g>
  </g>
  <g>
    <g>
    <rect x="80" y="720" width="670" height="120" rx="8" fill="url(#descriptor-grid)" stroke="#16a34a" stroke-width="1.3"/>
    <text class="note-text" x="94" y="744">Canonical field rule</text>
    <text class="small"><tspan x="94" y="765">New semantic asset fields belong in AutoVoxelDescriptor first.</tspan><tspan x="94" y="781">collision is the placement footprint field.</tspan></text>
  </g>
    <g>
    <rect x="855" y="720" width="660" height="120" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7" stroke-width="1.3"/>
    <text class="note-text" x="869" y="744">Public read rule</text>
    <text class="small"><tspan x="869" y="765">Committed per-voxel reads expose complexity, color, and collision.</tspan><tspan x="869" y="781">occupied, source_type, commit_tick, and record ids stay in source/debug buffers.</tspan></text>
  </g>
  </g>
</svg>
