      .subtitle { font: 16px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #cbd5e1; }
      .section { font: 700 20px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #f8fafc; }
      .label { font: 700 16px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #e2e8f0; }
      .small { font: 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #cbd5e1; }
      .tiny { font: 11px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #94a3b8; }
      .mono { font: 12px Consolas, "Cascadia Mono", monospace; fill: #dbeafe; }
      .mono-strong { font: 700 13px Consolas, "Cascadia Mono", monospace; fill: #ffffff; }
