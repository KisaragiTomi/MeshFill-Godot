      .card { fill: #111827; stroke: #334155; stroke-width: 1.3; filter: url(#shadow); }
      .input { fill: #0f1f2f; stroke: #38bdf8; stroke-width: 1.5; }
      .sv { fill: #182135; stroke: #a78bfa; stroke-width: 1.6; }
      .target { fill: #2b1d35; stroke: #f472b6; stroke-width: 1.5; }
      .scene_voxel_runtime { fill: #10251e; stroke: #22c55e; stroke-width: 2.2; filter: url(#shadow); }
      .gpu { fill: #1e2030; stroke: #60a5fa; stroke-width: 1.6; }
      .runtime { fill: #1b2330; stroke: #94a3b8; stroke-width: 1.3; }
      .warn { fill: #3a2510; stroke: #f59e0b; stroke-width: 1.4; }
      .ok { fill: #0e2a1d; stroke: #22c55e; stroke-width: 1.4; }
      .soft { fill: rgba(148, 163, 184, 0.10); stroke: rgba(148, 163, 184, 0.35); stroke-width: 1; }
      .edge { fill: none; stroke: #94a3b8; stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-green { fill: none; stroke: #22c55e; stroke-width: 2.6; marker-end: url(#arrow-green); }
      .edge-blue { fill: none; stroke: #38bdf8; stroke-width: 2.3; marker-end: url(#arrow-blue); }
      .edge-amber { fill: none; stroke: #f59e0b; stroke-width: 2.3; marker-end: url(#arrow-amber); }
      .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .dash-pink { fill: none; stroke: #f472b6; stroke-width: 2; stroke-dasharray: 8 7; marker-end: url(#arrow-amber); }
      .dash-green { fill: none; stroke: #22c55e; stroke-width: 2; stroke-dasharray: 8 7; marker-end: url(#arrow-green); }
      .pill { fill: rgba(34, 197, 94, 0.16); stroke: rgba(34, 197, 94, 0.55); stroke-width: 1; }
      .pill-blue { fill: rgba(56, 189, 248, 0.14); stroke: rgba(56, 189, 248, 0.55); stroke-width: 1; }
      .pill-pink { fill: rgba(244, 114, 182, 0.14); stroke: rgba(244, 114, 182, 0.55); stroke-width: 1; }
      .pill-amber { fill: rgba(245, 158, 11, 0.14); stroke: rgba(245, 158, 11, 0.55); stroke-width: 1; }
      /* meshfill-graph-style: shared light engineering diagram theme */
      :root { color-scheme: light; }
      .bg, rect[fill="url(#bg)"] { fill: #f8fafc; }
      svg > circle[opacity] { opacity: 0; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .title { font: 700 34px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .subtitle { font: 500 16px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .section, .section-title { font: 700 18px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #1e293b; letter-spacing: 0; }
      .band-title, .lane-title { font: 700 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #334155; letter-spacing: 0; }
      .label, .node-title, .pill-text { font: 700 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .text { font: 500 16px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #1f2937; letter-spacing: 0; }
      .small { font: 500 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .tiny { font: 500 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #64748b; letter-spacing: 0; }
      .mono, .mono-strong, .formula { font: 600 12px Consolas, "Cascadia Mono", monospace; fill: #334155; letter-spacing: 0; }
      .lane, .band, .band2d, .band3d, .band-field, .band-post, .lane-type, .lane-resource, .lane-field, .lane-runtime, .lane-factory, .lane-owner, .lane-tool, .state-band, .target-band, .asset-band, .route-band, .place-band { fill: #ffffff; stroke: #dbe3ef; stroke-width: 1.2; }
      .node, .card, .soft, .tick, .legend { stroke-width: 1.4; filter: url(#shadow); }
      .box, .box-gray, .card, .soft, .support, .tool, .owner, .factory, .downstream, .legacy, .getter, .runtime, .tick, .legend { fill: #ffffff; stroke: #cbd5e1; }
      .box-blue, .input, .entry, .field, .state, .sv, .target, .target-card, .gpu-card, .gpu { fill: #dbeafe; stroke: #2563eb; }
      .box-green, .asset, .resource, .autoobject, .input-card, .source-card, .contract, .sv-card, .ok, .prefilter-card { fill: #dcfce7; stroke: #16a34a; }
      .box-purple, .route, .route-card, .rerank-card, .gate-card, .descriptor, .record-card, .vdb-card, .debug-card { fill: #ede9fe; stroke: #7c3aed; }
      .box-yellow, .placement, .placement-card, .commit-card, .persist-card, .aggregate-card { fill: #fef3c7; stroke: #d97706; }
      .box-red, .hardgate, .prune-card { fill: #fee2e2; stroke: #ef4444; }
      .record, .record-card { fill: #fef3c7; stroke: #d97706; }
      .cache, .cache-card, .scene_voxel_runtime { fill: #ccfbf1; stroke: #0f766e; }
      .note, .warn { fill: #e6edf5; stroke: #b6c4d4; }
      .pill, .pill-blue, .pill-pink, .pill-amber { fill: #f8fafc; stroke: #cbd5e1; }
      rect[fill="#0f172a"], rect[fill="#111827"], rect[fill="#172033"], rect[fill="#16213a"], rect[fill="#101827"], rect[fill="#111c31"], rect[fill="#082f49"], rect[fill="#052e2b"], rect[fill="#052e16"], rect[fill="#064e3b"], rect[fill="#062f26"], rect[fill="#2e1065"], rect[fill="#2b2038"], rect[fill="#2b1d35"], rect[fill="#0f1f2f"], rect[fill="#182135"], rect[fill="#1e2030"], rect[fill="#1b2330"], rect[fill="#3a2510"], rect[fill="#0e2a1d"], rect[fill="#10251e"] { fill: #ffffff; stroke: #cbd5e1; }
      .edge, .arrow, .dash { fill: none; stroke: #334155; stroke-width: 2.2; }
      .edge-soft, .arrow-soft { fill: none; stroke: #64748b; stroke-width: 2; }
      .edge-blue, .arrow-blue { fill: none; stroke: #2563eb; stroke-width: 2.3; }
      .edge-green, .arrow-green, .dash-green { fill: none; stroke: #059669; stroke-width: 2.3; }
      .edge-orange, .edge-amber, .arrow-purple, .dash-purple { fill: none; stroke: #d97706; stroke-width: 2.3; }
      .edge-purple { fill: none; stroke: #7c3aed; stroke-width: 2.3; }
      .arrow-red, .dash-red, .dash-pink { fill: none; stroke: #dc2626; stroke-width: 2.2; }
      .dash, .dash-green, .dash-red, .dash-pink, .dash-purple, .edge-soft, .arrow-soft { stroke-dasharray: 7 7; }
      #arrow path { fill: #334155; }
      #arrowGreen path, #arrow-green path { fill: #059669; }
      #arrowBlue path, #arrow-blue path { fill: #2563eb; }
      #arrowRed path, #arrow-red path { fill: #dc2626; }
      #arrowPurple path, #arrow-purple path, #arrow-orange path, #arrow-amber path { fill: #d97706; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1180"/>
  <circle cx="790" cy="545" r="360" fill="#22c55e" opacity="0.045"/>
  <circle cx="1340" cy="430" r="260" fill="#60a5fa" opacity="0.055"/>
  <circle cx="270" cy="360" r="250" fill="#a78bfa" opacity="0.045"/>

  <text id="title-text" x="54" y="58" class="title">SceneVoxelLocal 交互图</text>
  <text x="54" y="88" class="subtitle">以 SceneVoxelLocal 为中心：维护当前 SV epoch 的 sampling/query buffer，不成为 SV 语义权威。</text>
  <text x="54" y="112" class="subtitle">probe / placement / validation 读取；source write、stamp delta 或下一轮 commit 可刷新。</text>

  <!-- Left inputs -->
  <rect x="42" y="128" width="408" height="626" rx="22" ry="22" class="band"/>
  <text x="70" y="166" class="section">输入与权威来源</text>
  <text x="70" y="190" class="tiny">SceneVoxelLocal 从这些来源构建 / 刷新 sampling view；不拥有最终语义。</text>

  <rect x="70" y="220" width="352" height="166" rx="16" ry="16" class="sv"/>
  <text x="94" y="252" class="label">Committed SceneVoxel</text>
  <text x="94" y="278" class="mono">blend_scene_voxels()</text>
  <text x="94" y="305" class="small">权威 read model：保存最终语义</text>
  <text x="112" y="329" class="mono">value / complexity</text>
  <text x="112" y="351" class="mono">color / channel / collision_voxels</text>
  <text x="112" y="373" class="mono">commit/source metadata sidecar</text>

  <rect x="70" y="414" width="352" height="144" rx="16" ry="16" class="input"/>
  <text x="94" y="446" class="label">SceneVoxel volume cache</text>
  <text x="94" y="472" class="mono">import_from_vegetation_volume()</text>
  <text x="112" y="498" class="small">slices + slice_meta → scene samples</text>
  <text x="112" y="520" class="small">volume["collision_field"] → collision samples</text>
  <text x="112" y="542" class="tiny">从 2D slices 投影到 SceneVoxelLocal 3D grid。</text>

  <rect x="70" y="586" width="352" height="132" rx="16" ry="16" class="input"/>
  <text x="94" y="618" class="label">World-space helpers</text>
  <text x="94" y="644" class="mono">fill_ground_from_depth_image()</text>
  <text x="94" y="666" class="mono">import_collision_from_objects()</text>
  <text x="112" y="692" class="small">terrain / existing AutoObject collision</text>
  <text x="112" y="712" class="tiny">用于初始化或独立测试 SceneVoxelLocal。</text>

  <!-- Center SceneVoxelLocal -->
  <rect x="505" y="216" width="570" height="500" rx="28" ry="28" class="scene_voxel_runtime"/>
  <text x="542" y="258" class="section">SceneVoxelLocal</text>
  <text x="542" y="283" class="mono">scripts/scene_voxel_runtime.gd</text>
  <text x="542" y="308" class="small">runtime sampling/query view；不是 SceneVoxel 语义权威。</text>

  <rect x="542" y="334" width="236" height="138" rx="14" ry="14" class="soft"/>
  <text x="564" y="363" class="label">连续 field buffers</text>
  <text x="564" y="390" class="mono-strong">scene_field[]</text>
  <text x="564" y="414" class="mono-strong">collision_field[]</text>
  <text x="564" y="440" class="tiny">PackedFloat32Array, 0.0-1.0</text>
  <text x="564" y="459" class="tiny">GPU storage buffer friendly</text>

  <rect x="810" y="334" width="226" height="138" rx="14" ry="14" class="soft"/>
  <text x="832" y="363" class="label">网格与寻址</text>
  <text x="832" y="390" class="mono">grid_size</text>
  <text x="832" y="412" class="mono">voxel_size / origin</text>
  <text x="832" y="434" class="mono">index = x + sx*(z + sz*y)</text>
  <text x="832" y="459" class="tiny">world_to_voxel / voxel_to_world</text>

  <rect x="542" y="500" width="236" height="136" rx="14" ry="14" class="soft"/>
  <text x="564" y="529" class="label">Dirty voxel regions</text>
  <text x="564" y="556" class="mono">TILE_SIZE = 8</text>
  <text x="564" y="578" class="mono">_dirty_tiles: Dictionary</text>
  <text x="564" y="600" class="mono">get_dirty_tile_ids()</text>
  <text x="564" y="622" class="tiny">底层 tile_id；高层称 voxel region。</text>

  <rect x="810" y="500" width="226" height="136" rx="14" ry="14" class="soft"/>
  <text x="832" y="529" class="label">读写 API</text>
  <text x="832" y="556" class="mono">set_scene / set_collision</text>
  <text x="832" y="578" class="mono">get_scene / get_collision</text>
  <text x="832" y="600" class="mono">apply_stamp_deltas()</text>
  <text x="832" y="622" class="tiny">写入后自动标记 dirty。</text>

  <rect x="542" y="660" width="494" height="34" rx="12" ry="12" class="warn"/>
  <text x="562" y="682" class="small">边界：保存 sampling fields + dirty 足迹；不保存 source ids。</text>

  <!-- Target guidance -->
  <rect x="1132" y="128" width="414" height="184" rx="22" ry="22" class="target"/>
  <text x="1162" y="166" class="section">TargetSV_B guidance</text>
  <text x="1162" y="192" class="mono">target_occupancy[] / target_color[]</text>
  <text x="1162" y="220" class="small">来自目标画布和 brush-composited projection。</text>
  <text x="1162" y="244" class="small">参与 routing / probe / scoring。</text>
  <rect x="1162" y="264" width="336" height="30" rx="10" ry="10" class="pill-pink"/>
  <text x="1180" y="284" class="tiny">guidance only：不写 committed SceneVoxel，也不成为 SceneVoxelLocal 存储字段。</text>

  <!-- Right consumers -->
  <rect x="1114" y="342" width="448" height="568" rx="22" ry="22" class="band"/>
  <text x="1142" y="380" class="section">SceneVoxelLocal 消费者与 GPU passes</text>

  <rect x="1142" y="410" width="392" height="150" rx="16" ry="16" class="gpu"/>
  <text x="1166" y="442" class="label">AutoObjectProbePrefilterGPU</text>
  <text x="1166" y="468" class="mono">run_probe_prefilter(scene_voxel_runtime, target, autoobjects)</text>
  <text x="1184" y="494" class="small">读取 scene / collision sampling buffers</text>
  <text x="1184" y="516" class="small">读取 dirty voxel regions 和 probes</text>
  <text x="1184" y="538" class="mono">→ candidate voxel regions</text>

  <rect x="1142" y="590" width="392" height="190" rx="16" ry="16" class="gpu"/>
  <text x="1166" y="622" class="label">VoxelPlacementGenerator</text>
  <text x="1166" y="648" class="mono">run_multi_asset() / run_minimal()</text>
  <text x="1184" y="674" class="small">scene_field + collision_field + footprint</text>
  <text x="1184" y="696" class="small">candidate voxel regions constrain dispatch</text>
  <text x="1184" y="720" class="mono">score_voxel_tile.glsl</text>
  <text x="1184" y="742" class="mono">reduce_voxel_tiles.glsl</text>
  <text x="1184" y="764" class="mono">stamp_voxel_field.glsl</text>

  <rect x="1142" y="810" width="392" height="76" rx="16" ry="16" class="runtime"/>
  <text x="1166" y="840" class="label">Validation / debug query</text>
  <text x="1166" y="864" class="small">get_scene(), get_collision(), get_stats(), dirty counts</text>

  <!-- Bottom loop -->
  <rect x="470" y="792" width="628" height="246" rx="22" ry="22" class="card"/>
  <text x="500" y="830" class="section">更新回路：placement result → sampling view / SceneVoxel commit</text>

  <rect x="500" y="860" width="252" height="126" rx="14" ry="14" class="ok"/>
  <text x="522" y="890" class="label">即时 GPU writeback</text>
  <text x="522" y="916" class="mono">scene_field_out</text>
  <text x="522" y="938" class="mono">collision_field_out</text>
  <text x="522" y="960" class="mono">stamp_deltas</text>
  <text x="522" y="980" class="tiny">same-pass blocking / incremental sampling view</text>

  <rect x="790" y="860" width="278" height="126" rx="14" ry="14" class="sv"/>
  <text x="812" y="890" class="label">语义提交回路</text>
  <text x="812" y="916" class="small">world_results → instantiate AutoObject</text>
  <text x="812" y="938" class="small">voxel_write_spec → Auto/Brush source</text>
  <text x="812" y="960" class="mono">blend_scene_voxels()</text>
  <text x="812" y="980" class="tiny">commit 重建；stamp delta 增量刷新。</text>

  <!-- Bottom boundary notes -->
  <rect x="42" y="1070" width="1520" height="74" rx="18" ry="18" class="band"/>
  <text x="70" y="1098" class="small">图例：绿色实线 = committed / derived field 数据流；蓝色实线 = GPU 查询输入；橙色实线 = writeback；粉色虚线 = TargetSV_B guidance only；灰色虚线 = 查询 / 调试。</text>
  <text x="70" y="1122" class="small">不变量：SceneVoxel 是语义权威；SceneVoxelLocal 是当前 SV epoch 的 sampling/query view；TargetSV_B 不进入 blend_scene_voxels()。</text>

  <!-- Edges from inputs to SceneVoxelLocal -->
  <path class="edge-green" d="M422 302 C468 302 468 360 505 360"/>
  <text x="434" y="286" class="tiny">derive value / complexity + collision_voxels</text>
  <path class="edge-blue" d="M422 486 C468 486 468 432 505 432"/>
  <text x="436" y="474" class="tiny">project slices into 3D grid</text>
  <path class="edge-blue" d="M422 652 C472 652 472 548 505 548"/>
  <text x="436" y="636" class="tiny">initialize field samples</text>

  <!-- SceneVoxelLocal to consumers -->
  <path class="edge-blue" d="M1075 430 C1110 430 1110 485 1142 485"/>
  <text x="1088" y="418" class="tiny">scene/collision fields + dirty ids</text>
  <path class="edge-blue" d="M1075 548 C1110 548 1110 674 1142 674"/>
  <text x="1088" y="574" class="tiny">buffers + candidate voxel regions</text>
  <path class="dash" d="M1075 620 C1110 620 1110 848 1142 848"/>
  <text x="1086" y="630" class="tiny">read-only query</text>

  <!-- Target guidance to GPU consumers -->
  <path class="dash-pink" d="M1338 312 C1338 352 1338 370 1338 410"/>
  <path class="dash-pink" d="M1420 312 C1506 390 1506 548 1434 590"/>
  <text x="1394" y="358" class="tiny">target_occupancy / target_color</text>

  <!-- Prefilter to placement -->
  <path class="edge-green" d="M1338 560 C1338 572 1338 578 1338 590"/>
  <text x="1352" y="578" class="tiny">candidate voxel regions by asset</text>

  <!-- Placement outputs to bottom loop -->
  <path class="edge-amber" d="M1142 725 C1098 725 1098 900 1068 900"/>
  <text x="1076" y="748" class="tiny">world_results / field_out / deltas</text>

  <!-- Bottom loop back to SceneVoxelLocal and SV -->
  <path class="edge-amber" d="M626 860 C626 780 620 760 620 716"/>
  <text x="504" y="774" class="tiny">apply_multi_asset_output()</text>
  <path class="edge-amber" d="M752 922 C778 922 770 710 810 636"/>
  <text x="660" y="812" class="tiny">apply_stamp_deltas()</text>
  <path class="edge-green" d="M929 860 C900 778 760 734 760 716"/>
  <text x="814" y="774" class="tiny">new dirty regions</text>
  <path class="edge-green" d="M790 923 C608 1042 180 980 180 386"/>
  <text x="252" y="1018" class="tiny">semantic commit becomes next authoritative SceneVoxel</text>

  <!-- Dirty regions loop to prefilter / placement -->
  <path class="dash-green" d="M640 636 C720 744 1050 590 1142 520"/>
  <text x="812" y="648" class="tiny">dirty regions limit prefilter work</text>
  <path class="dash-green" d="M658 636 C658 760 1098 764 1142 700"/>
  <text x="760" y="752" class="tiny">candidate regions for dirty placement</text>
</svg>
