<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="980" viewBox="0 0 1620 980" role="img" aria-labelledby="title desc">
  <title id="title">AutoObject Probe Scoring Logic</title>
  <desc id="desc">Probe data generation and scoring from asset-semantic-probes.md and autoobject-probe-prefilter.md.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#ea580c"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <pattern id="autoobject-dot-bg" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#cffafe"/>
      <circle cx="3" cy="3" r="1.25" fill="#0891b2" opacity="0.256281"/>
      <circle cx="9" cy="9" r="1.25" fill="#0891b2" opacity="0.256281"/>
    </pattern>
    <pattern id="descriptor-grid" patternUnits="userSpaceOnUse" width="9.3334" height="9.3334">
      <rect width="9.3334" height="9.3334" fill="#dcfce7"/>
      <path d="M4.6667 0H0V4.6667" stroke="#16a34a" stroke-width="0.3333" opacity="0.257576"/>
      <path d="M0 4.6667L4.6667 0" stroke="#16a34a" stroke-width="0.3333" opacity="0.257576"/>
    </pattern>
    <pattern id="sv-stripe-blue" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#dbeafe"/>
      <rect y="1" width="10" height="2" fill="#0284c7" opacity="0.235023"/>
      <rect y="6" width="10" height="1.5" fill="#0284c7" opacity="0.235023"/>
    </pattern>
    <pattern id="sv-stripe-amber" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#fef3c7"/>
      <rect y="1" width="10" height="2" fill="#d97706" opacity="0.264249"/>
      <rect y="6" width="10" height="1.5" fill="#d97706" opacity="0.264249"/>
    </pattern>
    <pattern id="note-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#f1f5f9"/>
      <rect x="0" y="0" width="10" height="2" fill="#64748b" opacity="0.361702"/>
    </pattern>
  </defs>
  <style>
    :root { color-scheme: light; }
    .bg { fill: #f8fafc; }
    .grid { stroke: #e2e8f0; stroke-width: 1; opacity: 0.7; }
    .title { fill: #0f172a; font: 700 34px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .subtitle { fill: #475569; font: 500 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .lane-title { fill: #334155; font: 700 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .node-title { fill: #0f172a; font: 700 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .small { fill: #475569; font: 500 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .mono { fill: #334155; font: 600 11px Consolas, "Cascadia Mono", monospace; letter-spacing: 0; }
    .note-text { fill: #0f172a; font: 600 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .lane { fill: #ffffff; stroke: #dbe3ef; stroke-width: 1.2; filter: url(#shadow); }
    .node { stroke-width: 1.5; filter: url(#shadow); }
    .edge { stroke: #334155; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
    .edge-blue { stroke: #2563eb; stroke-width: 2.2; fill: none; marker-end: url(#arrow-blue); }
    .edge-green { stroke: #059669; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
    .edge-orange { stroke: #ea580c; stroke-width: 2.2; fill: none; marker-end: url(#arrow-orange); }
    .edge-dash { stroke: #64748b; stroke-width: 1.9; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    .edge-warn { stroke: #dc2626; stroke-width: 2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
  </style>

  <rect class="bg" x="0" y="0" width="1620" height="980"/>
  <g opacity="0.65"><line class="grid" x1="40" y1="86" x2="40" y2="944"/><line class="grid" x1="120" y1="86" x2="120" y2="944"/><line class="grid" x1="200" y1="86" x2="200" y2="944"/><line class="grid" x1="280" y1="86" x2="280" y2="944"/><line class="grid" x1="360" y1="86" x2="360" y2="944"/><line class="grid" x1="440" y1="86" x2="440" y2="944"/><line class="grid" x1="520" y1="86" x2="520" y2="944"/><line class="grid" x1="600" y1="86" x2="600" y2="944"/><line class="grid" x1="680" y1="86" x2="680" y2="944"/><line class="grid" x1="760" y1="86" x2="760" y2="944"/><line class="grid" x1="840" y1="86" x2="840" y2="944"/><line class="grid" x1="920" y1="86" x2="920" y2="944"/><line class="grid" x1="1000" y1="86" x2="1000" y2="944"/><line class="grid" x1="1080" y1="86" x2="1080" y2="944"/><line class="grid" x1="1160" y1="86" x2="1160" y2="944"/><line class="grid" x1="1240" y1="86" x2="1240" y2="944"/><line class="grid" x1="1320" y1="86" x2="1320" y2="944"/><line class="grid" x1="1400" y1="86" x2="1400" y2="944"/><line class="grid" x1="1480" y1="86" x2="1480" y2="944"/><line class="grid" x1="1560" y1="86" x2="1560" y2="944"/><line class="grid" x1="30" y1="120" x2="1590" y2="120"/><line class="grid" x1="30" y1="200" x2="1590" y2="200"/><line class="grid" x1="30" y1="280" x2="1590" y2="280"/><line class="grid" x1="30" y1="360" x2="1590" y2="360"/><line class="grid" x1="30" y1="440" x2="1590" y2="440"/><line class="grid" x1="30" y1="520" x2="1590" y2="520"/><line class="grid" x1="30" y1="600" x2="1590" y2="600"/><line class="grid" x1="30" y1="680" x2="1590" y2="680"/><line class="grid" x1="30" y1="760" x2="1590" y2="760"/><line class="grid" x1="30" y1="840" x2="1590" y2="840"/><line class="grid" x1="30" y1="920" x2="1590" y2="920"/></g>
  <text class="title" x="48" y="54">AutoObject Probe Scoring Logic</text>
  <text class="subtitle" x="48" y="82">Descriptor probes score only already-routed anchor/asset candidates and clamp samples into valid SV/TargetSV_B ranges.</text>
  <g>
    <rect class="lane" x="50" y="115" width="360" height="720" rx="8"/>
    <text class="lane-title" x="68" y="141">PROBE SOURCE</text>
    <rect class="lane" x="450" y="115" width="360" height="720" rx="8"/>
    <text class="lane-title" x="468" y="141">GPU PACKING</text>
    <rect class="lane" x="850" y="115" width="360" height="720" rx="8"/>
    <text class="lane-title" x="868" y="141">SAMPLING + FIT</text>
    <rect class="lane" x="1250" y="115" width="320" height="720" rx="8"/>
    <text class="lane-title" x="1268" y="141">SELECTION BOUNDARY</text>
  </g>
  <g>
    <path class="edge-green" d="M 370 220 L 490 215"/>
    <path class="edge-green" d="M 370 425 L 490 410"/>
    <path class="edge" d="M 770 215 L 890 215"/>
    <path class="edge" d="M 1030 275 L 1030 350"/>
    <path class="edge-orange" d="M 1030 490 L 1030 585"/>
    <path class="edge-orange" d="M 1170 645 L 1290 230"/>
    <path class="edge" d="M 1410 290 L 1410 390"/>
    <path class="edge-dash" d="M 1410 515 L 1410 610"/>
    <path class="edge-warn" d="M 370 635 L 490 410"/>
    <text class="mono" x="390" y="594">excluded</text>
  </g>
  <g>
    <g id="autovoxeldescriptor">
    <rect class="node" x="90" y="155" width="280" height="125" rx="8" fill="url(#descriptor-grid)" stroke="#16a34a"/>
    <text class="node-title" x="108" y="183">AutoVoxelDescriptor</text>
    <text class="small"><tspan x="108" y="205">semantic_probe_profile</tspan><tspan x="108" y="222">collision</tspan><tspan x="108" y="239">context_sensing_radius</tspan><tspan x="108" y="256">generated probes</tspan></text>
    </g>
    <g id="generation-priority">
    <rect class="node" x="90" y="350" width="280" height="150" rx="8" fill="url(#descriptor-grid)" stroke="#16a34a"/>
    <text class="node-title" x="108" y="378">Generation priority</text>
    <text class="small"><tspan x="108" y="400">1 convex</tspan><tspan x="108" y="417">2 voxel_interior</tspan><tspan x="108" y="434">3 surface</tspan><tspan x="108" y="451">4 context</tspan><tspan x="108" y="468">5 final fallback</tspan></text>
    </g>
    <g id="not-semantic-inputs">
    <rect class="node" x="90" y="585" width="280" height="105" rx="8" fill="url(#note-hatch)" stroke="#64748b"/>
    <text class="node-title" x="108" y="613">Not semantic inputs</text>
    <text class="small"><tspan x="108" y="635">channel</tspan><tspan x="108" y="652">vegetation_channel</tspan><tspan x="108" y="669">object_type metadata</tspan></text>
    </g>
    <g id="probe-soa-buffers">
    <rect class="node" x="490" y="155" width="280" height="120" rx="8" fill="url(#sv-stripe-amber)" stroke="#d97706"/>
    <text class="node-title" x="508" y="183">Probe SoA buffers</text>
    <text class="small"><tspan x="508" y="205">offset</tspan><tspan x="508" y="222">expected_rgba8</tspan><tspan x="508" y="239">weight</tspan><tspan x="508" y="256">range: asset -&gt; start/count</tspan></text>
    </g>
    <g id="probe-flags-/-kind">
    <rect class="node" x="490" y="350" width="280" height="120" rx="8" fill="url(#sv-stripe-amber)" stroke="#d97706"/>
    <text class="node-title" x="508" y="378">Probe flags / kind</text>
    <text class="small"><tspan x="508" y="400">color / complexity</tspan><tspan x="508" y="417">collision / empty / support</tspan><tspan x="508" y="434">positive / negative / support</tspan></text>
    </g>
    <g id="sample_pos">
    <rect class="node" x="890" y="155" width="280" height="120" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text class="node-title" x="908" y="183">sample_pos</text>
    <text class="small"><tspan x="908" y="205">anchor_pos + probe.offset</tspan><tspan x="908" y="222">clamp to valid grid</tspan><tspan x="908" y="239">then sample buffers</tspan></text>
    </g>
    <g id="sample-sources">
    <rect class="node" x="890" y="350" width="280" height="140" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
    <text class="node-title" x="908" y="378">Sample sources</text>
    <text class="small"><tspan x="908" y="400">complexity_field</tspan><tspan x="908" y="417">collision_field</tspan><tspan x="908" y="434">target_occupancy</tspan><tspan x="908" y="451">target_color from TargetSV_B</tspan></text>
    </g>
    <g id="fit-components">
    <rect class="node" x="890" y="585" width="280" height="140" rx="8" fill="#ffedd5" stroke="#ea580c"/>
    <text class="node-title" x="908" y="613">Fit components</text>
    <text class="small"><tspan x="908" y="635">color_fit</tspan><tspan x="908" y="652">complexity_fit</tspan><tspan x="908" y="669">collision_fit</tspan><tspan x="908" y="686">empty_fit / support_fit</tspan><tspan x="908" y="703">weighted probe_score</tspan></text>
    </g>
    <g id="anchor-top-k">
    <rect class="node" x="1290" y="170" width="240" height="120" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text class="node-title" x="1308" y="198">anchor top-K</text>
    <text class="small"><tspan x="1308" y="220">select best assets</tspan><tspan x="1308" y="237">per anchor</tspan><tspan x="1308" y="254">GPU internal pass</tspan></text>
    </g>
    <g id="candidate-only-rule">
    <rect class="node" x="1290" y="390" width="240" height="125" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text class="node-title" x="1308" y="418">Candidate-only rule</text>
    <text class="small"><tspan x="1308" y="440">may rerank / validate / prune</tspan><tspan x="1308" y="457">cannot add assets outside top-K</tspan><tspan x="1308" y="474">does not search full asset DB</tspan></text>
    </g>
    <g id="physical-score-separate">
    <rect class="node" x="1290" y="610" width="240" height="90" rx="8" fill="url(#note-hatch)" stroke="#64748b"/>
    <text class="node-title" x="1308" y="638">Physical score separate</text>
    <text class="small"><tspan x="1308" y="660">score_voxel_tile.glsl</tspan><tspan x="1308" y="677">owns final feasibility</tspan></text>
    </g>
  </g>
  <g>
    <g>
    <rect x="470" y="800" width="720" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
    <text class="note-text" x="484" y="824">Sampling rule</text>
    <text class="small"><tspan x="484" y="845">Out-of-bounds probe samples are clamped to the nearest valid SV / TargetSV_B voxel; boundary space is not treated as empty.</tspan></text>
  </g>
  </g>
</svg>
