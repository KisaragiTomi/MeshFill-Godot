<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="920" viewBox="0 0 1580 920" role="img" aria-labelledby="title desc">
  <title id="title">AutoAssetFactory Relationships</title>
  <desc id="desc">AutoAssetFactory and scaffold flow from auto-asset-scripting.md.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#ea580c"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <pattern id="autoobject-dot-bg" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#cffafe"/>
      <circle cx="3" cy="3" r="1.25" fill="#0891b2" opacity="0.256281"/>
      <circle cx="9" cy="9" r="1.25" fill="#0891b2" opacity="0.256281"/>
    </pattern>
    <pattern id="descriptor-grid" patternUnits="userSpaceOnUse" width="9.3334" height="9.3334">
      <rect width="9.3334" height="9.3334" fill="#dcfce7"/>
      <path d="M4.6667 0H0V4.6667" stroke="#16a34a" stroke-width="0.3333" opacity="0.257576"/>
      <path d="M0 4.6667L4.6667 0" stroke="#16a34a" stroke-width="0.3333" opacity="0.257576"/>
    </pattern>
    <pattern id="sv-stripe-blue" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#dbeafe"/>
      <rect y="1" width="10" height="2" fill="#0284c7" opacity="0.235023"/>
      <rect y="6" width="10" height="1.5" fill="#0284c7" opacity="0.235023"/>
    </pattern>
    <pattern id="sv-stripe-amber" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#fef3c7"/>
      <rect y="1" width="10" height="2" fill="#d97706" opacity="0.264249"/>
      <rect y="6" width="10" height="1.5" fill="#d97706" opacity="0.264249"/>
    </pattern>
    <pattern id="note-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#f1f5f9"/>
      <rect x="0" y="0" width="10" height="2" fill="#64748b" opacity="0.361702"/>
    </pattern>
  </defs>
  <style>
    :root { color-scheme: light; }
    .bg { fill: #f8fafc; }
    .grid { stroke: #e2e8f0; stroke-width: 1; opacity: 0.7; }
    .title { fill: #0f172a; font: 700 34px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .subtitle { fill: #475569; font: 500 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .lane-title { fill: #334155; font: 700 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .node-title { fill: #0f172a; font: 700 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .small { fill: #475569; font: 500 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .mono { fill: #334155; font: 600 11px Consolas, "Cascadia Mono", monospace; letter-spacing: 0; }
    .note-text { fill: #0f172a; font: 600 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .lane { fill: #ffffff; stroke: #dbe3ef; stroke-width: 1.2; filter: url(#shadow); }
    .node { stroke-width: 1.5; filter: url(#shadow); }
    .edge { stroke: #334155; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
    .edge-blue { stroke: #2563eb; stroke-width: 2.2; fill: none; marker-end: url(#arrow-blue); }
    .edge-green { stroke: #059669; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
    .edge-orange { stroke: #ea580c; stroke-width: 2.2; fill: none; marker-end: url(#arrow-orange); }
    .edge-dash { stroke: #64748b; stroke-width: 1.9; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    .edge-warn { stroke: #dc2626; stroke-width: 2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
  </style>

  <rect class="bg" x="0" y="0" width="1580" height="920"/>
  <g opacity="0.65"><line class="grid" x1="40" y1="86" x2="40" y2="884"/><line class="grid" x1="120" y1="86" x2="120" y2="884"/><line class="grid" x1="200" y1="86" x2="200" y2="884"/><line class="grid" x1="280" y1="86" x2="280" y2="884"/><line class="grid" x1="360" y1="86" x2="360" y2="884"/><line class="grid" x1="440" y1="86" x2="440" y2="884"/><line class="grid" x1="520" y1="86" x2="520" y2="884"/><line class="grid" x1="600" y1="86" x2="600" y2="884"/><line class="grid" x1="680" y1="86" x2="680" y2="884"/><line class="grid" x1="760" y1="86" x2="760" y2="884"/><line class="grid" x1="840" y1="86" x2="840" y2="884"/><line class="grid" x1="920" y1="86" x2="920" y2="884"/><line class="grid" x1="1000" y1="86" x2="1000" y2="884"/><line class="grid" x1="1080" y1="86" x2="1080" y2="884"/><line class="grid" x1="1160" y1="86" x2="1160" y2="884"/><line class="grid" x1="1240" y1="86" x2="1240" y2="884"/><line class="grid" x1="1320" y1="86" x2="1320" y2="884"/><line class="grid" x1="1400" y1="86" x2="1400" y2="884"/><line class="grid" x1="1480" y1="86" x2="1480" y2="884"/><line class="grid" x1="1560" y1="86" x2="1560" y2="884"/><line class="grid" x1="30" y1="120" x2="1550" y2="120"/><line class="grid" x1="30" y1="200" x2="1550" y2="200"/><line class="grid" x1="30" y1="280" x2="1550" y2="280"/><line class="grid" x1="30" y1="360" x2="1550" y2="360"/><line class="grid" x1="30" y1="440" x2="1550" y2="440"/><line class="grid" x1="30" y1="520" x2="1550" y2="520"/><line class="grid" x1="30" y1="600" x2="1550" y2="600"/><line class="grid" x1="30" y1="680" x2="1550" y2="680"/><line class="grid" x1="30" y1="760" x2="1550" y2="760"/><line class="grid" x1="30" y1="840" x2="1550" y2="840"/></g>
  <text class="title" x="48" y="54">AutoAssetFactory Relationships</text>
  <text class="subtitle" x="48" y="82">Scaffold JSON becomes typed assets or descriptors while preserving canonical shared fields.</text>
  <g>
    <rect class="lane" x="50" y="115" width="335" height="675" rx="8"/>
    <text class="lane-title" x="68" y="141">CONFIG ENTRY</text>
    <rect class="lane" x="430" y="115" width="335" height="675" rx="8"/>
    <text class="lane-title" x="448" y="141">FACTORY NORMALIZATION</text>
    <rect class="lane" x="810" y="115" width="335" height="675" rx="8"/>
    <text class="lane-title" x="828" y="141">SAVED ASSETS</text>
    <rect class="lane" x="1190" y="115" width="335" height="675" rx="8"/>
    <text class="lane-title" x="1208" y="141">RUNTIME USE</text>
  </g>
  <g>
    <path class="edge" d="M 350 220 L 465 218"/>
    <path class="edge" d="M 598 275 L 598 335"/>
    <path class="edge-orange" d="M 730 395 L 845 212"/>
    <text class="mono" x="760" y="280">rock</text>
    <path class="edge-green" d="M 730 395 L 845 405"/>
    <text class="mono" x="752" y="390">vegetation</text>
    <path class="edge-dash" d="M 978 275 L 978 335"/>
    <path class="edge-green" d="M 978 470 L 978 545"/>
    <path class="edge-blue" d="M 1110 610 L 1225 230"/>
    <path class="edge" d="M 1358 290 L 1358 365"/>
    <path class="edge" d="M 1358 485 L 1358 575"/>
    <path class="edge-dash" d="M 350 408 L 465 398"/>
    <text class="mono" x="370" y="386">canonical guard</text>
  </g>
  <g>
    <g id="json-config">
    <rect class="node" x="85" y="160" width="265" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text class="node-title" x="103" y="188">JSON config</text>
    <text class="small"><tspan x="103" y="210">type: rock / vegetation</tspan><tspan x="103" y="227">asset_path / mesh</tspan><tspan x="103" y="244">color, complexity, collision</tspan></text>
    </g>
    <g id="removed-names-avoided">
    <rect class="node" x="85" y="350" width="265" height="115" rx="8" fill="url(#note-hatch)" stroke="#64748b"/>
    <text class="node-title" x="103" y="378">Legacy names avoided</text>
    <text class="small"><tspan x="103" y="400">collision only</tspan><tspan x="103" y="417">metadata not a config plane</tspan><tspan x="103" y="434">channel is scatter-only</tspan></text>
    </g>
    <g id="scaffold_auto_asset.gd">
    <rect class="node" x="465" y="160" width="265" height="115" rx="8" fill="url(#sv-stripe-amber)" stroke="#d97706"/>
    <text class="node-title" x="483" y="188">scaffold_auto_asset.gd</text>
    <text class="small"><tspan x="483" y="210">headless command input</tspan><tspan x="483" y="227">validate mesh factory whitelist</tspan><tspan x="483" y="244">dispatch by type</tspan></text>
    </g>
    <g id="autoassetfactory">
    <rect class="node" x="465" y="335" width="265" height="125" rx="8" fill="url(#descriptor-grid)" stroke="#16a34a"/>
    <text class="node-title" x="483" y="363">AutoAssetFactory</text>
    <text class="small"><tspan x="483" y="385">normalize shared fields</tspan><tspan x="483" y="402">write canonical collision</tspan><tspan x="483" y="419">canonical write helpers</tspan></text>
    </g>
    <g id="rock-branch">
    <rect class="node" x="845" y="150" width="265" height="125" rx="8" fill="#ffedd5" stroke="#ea580c"/>
    <text class="node-title" x="863" y="178">Rock branch</text>
    <text class="small"><tspan x="863" y="200">AutoRock scene</tspan><tspan x="863" y="217">mesh_height_texture</tspan><tspan x="863" y="234">optional AutoVoxelProfile</tspan></text>
    </g>
    <g id="vegetation-branch">
    <rect class="node" x="845" y="335" width="265" height="135" rx="8" fill="url(#descriptor-grid)" stroke="#16a34a"/>
    <text class="node-title" x="863" y="363">Vegetation branch</text>
    <text class="small"><tspan x="863" y="385">AutoVoxelDescriptor .tres</tspan><tspan x="863" y="402">optional AutoVegetation subclass</tspan><tspan x="863" y="419">scatter_min_distance/count/scale</tspan></text>
    </g>
    <g id="descriptor-semantics">
    <rect class="node" x="845" y="545" width="265" height="110" rx="8" fill="url(#descriptor-grid)" stroke="#16a34a"/>
    <text class="node-title" x="863" y="573">Descriptor semantics</text>
    <text class="small"><tspan x="863" y="595">color / complexity / collision</tspan><tspan x="863" y="612">mesh / scatter / visual layer</tspan><tspan x="863" y="629">vegetation_script if needed</tspan></text>
    </g>
    <g id="prototype-/-instance">
    <rect class="node" x="1225" y="170" width="265" height="120" rx="8" fill="url(#autoobject-dot-bg)" stroke="#0891b2"/>
    <text class="node-title" x="1243" y="198">Prototype / instance</text>
    <text class="small"><tspan x="1243" y="220">copy or instantiate asset</tspan><tspan x="1243" y="237">runtime AutoObject identity</tspan><tspan x="1243" y="254">scale stays explicit</tspan></text>
    </g>
    <g id="instance_stamp_write_spec">
    <rect class="node" x="1225" y="365" width="265" height="120" rx="8" fill="url(#sv-stripe-amber)" stroke="#d97706"/>
    <text class="node-title" x="1243" y="393">ISWS</text>
    <text class="small"><tspan x="1243" y="415">instance_stamp_write_spec</tspan><tspan x="1243" y="432">position and collision footprint</tspan><tspan x="1243" y="449">scene write handle</tspan></text>
    </g>
    <g id="sv-owned-path">
    <rect class="node" x="1225" y="575" width="265" height="110" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
    <text class="node-title" x="1243" y="603">SV-owned path</text>
    <text class="small"><tspan x="1243" y="625">source write</tspan><tspan x="1243" y="642">blend_scene_voxels()</tspan><tspan x="1243" y="659">resident scene/collision fields</tspan></text>
    </g>
  </g>
  <g>
    <g>
    <rect x="460" y="735" width="660" height="80" rx="8" fill="url(#descriptor-grid)" stroke="#16a34a" stroke-width="1.3"/>
    <text class="note-text" x="474" y="759">Generation contract</text>
    <text class="small"><tspan x="474" y="780">The factory can create resources and helper scripts, but semantic defaults still land in descriptors or typed descriptor-backed fields.</tspan></text>
  </g>
  </g>
</svg>
