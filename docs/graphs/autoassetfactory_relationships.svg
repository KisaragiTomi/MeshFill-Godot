  <path class="edge-blue" d="M312 393 H398"/>
  <path class="edge-blue" d="M312 539 H356 V402 H398"/>
  <path class="edge-green" d="M682 245 H768"/>
  <path class="edge-green" d="M682 402 H768"/>
  <path class="edge-purple" d="M682 565 H724 V245 H768"/>
  <path class="edge-purple" d="M682 585 H724 V565 H768"/>
  <path class="edge-green" d="M1062 245 H1148"/>
  <path class="edge-green" d="M1062 402 H1106 V265 H1148"/>
  <path class="edge-green" d="M1062 565 H1106 V300 H1148"/>
  <path class="edge-orange" d="M1295 328 V378"/>
  <path class="edge-orange" d="M1295 504 V554"/>
  <path class="edge-soft" d="M398 632 C364 700 760 730 1148 624"/>
  <text class="tiny" x="610" y="720">vegetation scaffolds descriptor resource refs; factory wrappers stay compatibility-only</text>

  <rect class="node warn" x="78" y="802" width="1344" height="74" rx="18" ry="18"/>
  <text class="rule" x="108" y="834">Boundary rule:</text>
  <text class="label" x="218" y="834">AutoAssetFactory creates, loads, converts, saves, and forwards; it does not own asset semantics or SceneVoxel schema.</text>
  <text class="tiny" x="108" y="858">AutoVoxelDescriptor owns defaults; AutoObject and typed classes build records; SceneVoxelCommitter / SV code normalizes, stamps, blends, and commits.</text>
</svg>
