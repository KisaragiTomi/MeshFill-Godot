<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
  <title id="title">AutoAssetFactory Relationships</title>
  <desc id="desc">AutoAssetFactory tooling and compatibility relationships with scaffold tools, imported assets, AutoVoxelDescriptor resource outputs, AutoObject helpers, typed AutoRock and AutoVegetation classes, voxel_write_spec payloads, and SceneVoxel commit flow.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#7c3aed"/>
    </marker>
    <filter id="shadow" x="-7%" y="-7%" width="114%" height="114%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.11"/>
    </filter>
    <pattern id="autoobject-dot-bg" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#dcfce7"/>
      <circle cx="3" cy="3" r="1.25" fill="#16a34a" opacity="0.257576"/>
      <circle cx="9" cy="9" r="1.25" fill="#16a34a" opacity="0.257576"/>
    </pattern>
    <pattern id="sv-stripe-bg" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#fef3c7"/>
      <rect y="1" width="10" height="2" fill="#d97706" opacity="0.264249"/>
      <rect y="6" width="10" height="1.5" fill="#d97706" opacity="0.264249"/>
    </pattern>
    <style>
      .bg { fill: #f8fafc; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .title { fill: #0f172a; font: 700 34px "Segoe UI", Arial, sans-serif; }
      .subtitle { fill: #475569; font: 15px "Segoe UI", Arial, sans-serif; }
      .lane-title { fill: #334155; font: 700 13px "Segoe UI", Arial, sans-serif; letter-spacing: .08em; }
      .node-title { fill: #0f172a; font: 700 17px "Segoe UI", Arial, sans-serif; }
      .label { fill: #334155; font: 13px "Segoe UI", Arial, sans-serif; }
      .tiny { fill: #475569; font: 12px "Segoe UI", Arial, sans-serif; }
      .mono { fill: #1e3a8a; font: 700 12px Consolas, "Cascadia Mono", monospace; }
      .rule { fill: #0f172a; font: 700 14px "Segoe UI", Arial, sans-serif; }
      .lane { stroke-width: 1.4; filter: url(#shadow); }
      .lane-tool { fill: #eff6ff; stroke: #3b82f6; }
      .lane-factory { fill: #f1f5f9; stroke: #64748b; }
      .lane-owner { fill: #f0fdf4; stroke: #22c55e; }
      .lane-runtime { fill: #fff7ed; stroke: #f97316; }
      .node { stroke-width: 1.6; filter: url(#shadow); }
      .tool { fill: #dbeafe; stroke: #2563eb; }
      .factory { fill: #e2e8f0; stroke: #475569; }
      .owner { fill: #dcfce7; stroke: #16a34a; }
      .autoobject-dot { fill: url(#autoobject-dot-bg); }
      .record { fill: #fef3c7; stroke: #d97706; }
      .runtime { fill: #ffedd5; stroke: #f97316; }
      .sv-stripe { fill: url(#sv-stripe-bg); }
      .contract { fill: #ede9fe; stroke: #7c3aed; }
      .warn { fill: #fee2e2; stroke: #dc2626; }
      .edge { stroke: #334155; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
      .edge-blue { stroke: #2563eb; stroke-width: 2.3; fill: none; marker-end: url(#arrow-blue); }
      .edge-green { stroke: #059669; stroke-width: 2.3; fill: none; marker-end: url(#arrow-green); }
      .edge-orange { stroke: #ea580c; stroke-width: 2.3; fill: none; marker-end: url(#arrow-orange); }
      .edge-purple { stroke: #7c3aed; stroke-width: 2.3; fill: none; marker-end: url(#arrow-purple); }
      .edge-soft { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); stroke-dasharray: 7 7; }
      /* meshfill-graph-style: shared light engineering diagram theme */
      :root { color-scheme: light; }
      .bg, rect[fill="url(#bg)"] { fill: #f8fafc; }
      svg > circle[opacity] { opacity: 0; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .title { font: 700 34px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .subtitle { font: 500 16px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .section, .section-title { font: 700 18px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #1e293b; letter-spacing: 0; }
      .band-title, .lane-title { font: 700 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #334155; letter-spacing: 0; }
      .label, .node-title, .pill-text { font: 700 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .text { font: 500 16px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #1f2937; letter-spacing: 0; }
      .small { font: 500 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .tiny { font: 500 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #64748b; letter-spacing: 0; }
      .mono, .mono-strong, .formula { font: 600 12px Consolas, "Cascadia Mono", monospace; fill: #334155; letter-spacing: 0; }
      .lane, .band, .band2d, .band3d, .band-field, .band-post, .lane-type, .lane-resource, .lane-field, .lane-runtime, .lane-factory, .lane-owner, .lane-tool, .state-band, .target-band, .asset-band, .route-band, .place-band { fill: #ffffff; stroke: #dbe3ef; stroke-width: 1.2; }
      .node, .card, .soft, .tick, .legend { stroke-width: 1.4; filter: url(#shadow); }
      .box, .box-gray, .card, .soft, .support, .tool, .owner, .factory, .downstream, .legacy, .getter, .runtime, .tick, .legend { fill: #ffffff; stroke: #cbd5e1; }
      .box-blue, .input, .entry, .field, .state, .sv, .target, .target-card, .gpu-card, .gpu { fill: #dbeafe; stroke: #2563eb; }
      .box-green, .asset, .resource, .autoobject, .input-card, .source-card, .contract, .sv-card, .ok, .prefilter-card { fill: #dcfce7; stroke: #16a34a; }
      .box-purple, .route, .route-card, .rerank-card, .gate-card, .descriptor, .record-card, .vdb-card, .debug-card { fill: #ede9fe; stroke: #7c3aed; }
      .box-yellow, .placement, .placement-card, .commit-card, .persist-card, .aggregate-card { fill: #fef3c7; stroke: #d97706; }
      .box-red, .hardgate, .prune-card { fill: #fee2e2; stroke: #ef4444; }
      .record, .record-card { fill: #fef3c7; stroke: #d97706; }
      .cache, .cache-card, .scene_voxel_runtime { fill: #ccfbf1; stroke: #0f766e; }
      .note, .warn { fill: #e6edf5; stroke: #b6c4d4; }
      .pill, .pill-blue, .pill-pink, .pill-amber { fill: #f8fafc; stroke: #cbd5e1; }
      rect[fill="#0f172a"], rect[fill="#111827"], rect[fill="#172033"], rect[fill="#16213a"], rect[fill="#101827"], rect[fill="#111c31"], rect[fill="#082f49"], rect[fill="#052e2b"], rect[fill="#052e16"], rect[fill="#064e3b"], rect[fill="#062f26"], rect[fill="#2e1065"], rect[fill="#2b2038"], rect[fill="#2b1d35"], rect[fill="#0f1f2f"], rect[fill="#182135"], rect[fill="#1e2030"], rect[fill="#1b2330"], rect[fill="#3a2510"], rect[fill="#0e2a1d"], rect[fill="#10251e"] { fill: #ffffff; stroke: #cbd5e1; }
      .edge, .arrow, .dash { fill: none; stroke: #334155; stroke-width: 2.2; }
      .edge-soft, .arrow-soft { fill: none; stroke: #64748b; stroke-width: 2; }
      .edge-blue, .arrow-blue { fill: none; stroke: #2563eb; stroke-width: 2.3; }
      .edge-green, .arrow-green, .dash-green { fill: none; stroke: #059669; stroke-width: 2.3; }
      .edge-orange, .edge-amber, .arrow-purple, .dash-purple { fill: none; stroke: #d97706; stroke-width: 2.3; }
      .edge-purple { fill: none; stroke: #7c3aed; stroke-width: 2.3; }
      .arrow-red, .dash-red, .dash-pink { fill: none; stroke: #dc2626; stroke-width: 2.2; }
      .dash, .dash-green, .dash-red, .dash-pink, .dash-purple, .edge-soft, .arrow-soft { stroke-dasharray: 7 7; }
      #arrow path { fill: #334155; }
      #arrowGreen path, #arrow-green path { fill: #059669; }
      #arrowBlue path, #arrow-blue path { fill: #2563eb; }
      #arrowRed path, #arrow-red path { fill: #dc2626; }
      #arrowPurple path, #arrow-purple path, #arrow-orange path, #arrow-amber path { fill: #d97706; }
    </style>
  </defs>

  <rect class="bg" width="1500" height="920"/>
  <path class="grid" d="M0 120H1500M0 300H1500M0 480H1500M0 660H1500M0 820H1500"/>
  <path class="grid" d="M360 120V860M740 120V860M1120 120V860"/>

  <text class="title" x="48" y="58">AutoAssetFactory Relationships</text>
  <text class="subtitle" x="48" y="88">Tooling/import helpers create descriptor resources and configure assets, while AutoObject and typed classes own runtime record construction.</text>

  <rect class="lane lane-tool" x="32" y="132" width="306" height="630" rx="20" ry="20"/>
  <rect class="lane lane-factory" x="372" y="132" width="336" height="630" rx="20" ry="20"/>
  <rect class="lane lane-owner" x="742" y="132" width="346" height="630" rx="20" ry="20"/>
  <rect class="lane lane-runtime" x="1122" y="132" width="346" height="630" rx="20" ry="20"/>

  <text class="lane-title" x="58" y="164">TOOLS AND IMPORT INPUTS</text>
  <text class="lane-title" x="398" y="164">AUTOASSETFACTORY HELPERS</text>
  <text class="lane-title" x="768" y="164">ASSET / OBJECT OWNERS</text>
  <text class="lane-title" x="1148" y="164">SV RUNTIME PATH</text>

  <rect class="node tool" x="58" y="196" width="254" height="104" rx="14" ry="14"/>
  <text class="node-title" x="78" y="228">scaffold_auto_asset.gd</text>
  <text class="label" x="78" y="252">command-line authoring tool</text>
  <text class="mono" x="78" y="274">descriptor_path for vegetation</text>

  <rect class="node tool" x="58" y="332" width="254" height="122" rx="14" ry="14"/>
  <text class="node-title" x="78" y="364">Imported Resources</text>
  <text class="label" x="78" y="388">PackedScene / MeshDataAsset</text>
  <text class="mono" x="78" y="412">mesh, source_mesh_path</text>
  <text class="mono" x="78" y="434">raw height textures</text>

  <rect class="node tool" x="58" y="488" width="254" height="102" rx="14" ry="14"/>
  <text class="node-title" x="78" y="520">Class Script Output</text>
  <text class="label" x="78" y="544">generated typed subclasses</text>
  <text class="mono" x="78" y="566">AutoRock / AutoVegetation</text>

  <rect class="node factory" x="398" y="184" width="284" height="122" rx="14" ry="14"/>
  <text class="node-title" x="418" y="216">Asset Load / Convert</text>
  <text class="mono" x="418" y="240">load_or_new_rock_asset()</text>
  <text class="mono" x="418" y="260">rock_from_mesh_data_asset()</text>
  <text class="mono" x="418" y="280">load_mesh() / load_raw_texture()</text>

  <rect class="node factory" x="398" y="340" width="284" height="124" rx="14" ry="14"/>
  <text class="node-title" x="418" y="372">Asset Configure / Save</text>
  <text class="mono" x="418" y="396">save descriptor resource</text>
  <text class="mono" x="418" y="416">asset.voxel_descriptor ref</text>
  <text class="mono" x="418" y="436">save_rock_asset()</text>

  <rect class="node factory" x="398" y="498" width="284" height="134" rx="14" ry="14"/>
  <text class="node-title" x="418" y="530">Compatibility Wrappers</text>
  <text class="mono" x="418" y="554">create_voxel_profile()</text>
  <text class="mono" x="418" y="574">create_voxel_descriptor()</text>
  <text class="mono" x="418" y="594">make_channel_entries()</text>
  <text class="tiny" x="418" y="614">forward to AutoObject helpers</text>

  <rect class="node owner autoobject-dot" x="768" y="184" width="294" height="122" rx="14" ry="14"/>
  <text class="node-title" x="788" y="216">AutoObject</text>
  <text class="label" x="788" y="240">runtime base and canonical helpers</text>
  <text class="mono" x="788" y="262">make_asset_voxel_record()</text>
  <text class="mono" x="788" y="282">make_profile_asset_voxel_record()</text>

  <rect class="node owner" x="768" y="340" width="294" height="124" rx="14" ry="14"/>
  <text class="node-title" x="788" y="372">Typed Runtime Classes</text>
  <text class="label" x="788" y="396">AutoRock / AutoVegetation</text>
  <text class="mono" x="788" y="418">override make_asset_voxel_record()</text>
  <text class="mono" x="788" y="438">configure_from_rock_asset()</text>

  <rect class="node owner" x="768" y="498" width="294" height="134" rx="14" ry="14"/>
  <text class="node-title" x="788" y="530">AutoVoxelDescriptor</text>
  <text class="label" x="788" y="554">asset default semantic source</text>
  <text class="mono" x="788" y="576">voxel_descriptor resource</text>
  <text class="mono" x="788" y="596">AutoVoxelProfile fallback only</text>
  <text class="tiny" x="788" y="616">vegetation assets store ExtResource</text>

  <rect class="node record sv-stripe" x="1148" y="202" width="294" height="126" rx="14" ry="14"/>
  <text class="node-title" x="1168" y="234">voxel_write_spec</text>
  <text class="label" x="1168" y="258">AutoObject-built write payload</text>
  <text class="mono" x="1168" y="280">position, scale, ids</text>
  <text class="mono" x="1168" y="300">channel_entries, collision_voxels</text>

  <rect class="node runtime sv-stripe" x="1148" y="378" width="294" height="126" rx="14" ry="14"/>
  <text class="node-title" x="1168" y="410">SceneVoxelCommitter</text>
  <text class="label" x="1168" y="434">SV write / commit owner</text>
  <text class="mono" x="1168" y="456">apply_mesh_asset_voxel_record()</text>
  <text class="mono" x="1168" y="476">_prepare_source_record()</text>

  <rect class="node runtime sv-stripe" x="1148" y="554" width="294" height="118" rx="14" ry="14"/>
  <text class="node-title" x="1168" y="586">Source write → SceneVoxel</text>
  <text class="label" x="1168" y="610">record interpretation and commit</text>
  <text class="mono" x="1168" y="632">channel_entries → channel</text>
  <text class="mono" x="1168" y="652">collision_field derived</text>

