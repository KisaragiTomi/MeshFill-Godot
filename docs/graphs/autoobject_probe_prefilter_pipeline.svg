<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="980" viewBox="0 0 1560 980" role="img" aria-labelledby="title desc">
  <title id="title">AutoObject Probe Prefilter Pipeline</title>
  <desc id="desc">GPU-only AutoObject probe prefilter pipeline: SceneVoxelActor owns SceneVoxelLocal, TargetSV, BrushSV, TargetSV_B, AutoObject registry, GPU AnchorState, and candidate route buffers for the same SceneVoxel epoch.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#34495e"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 34px 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif; fill: #102033; }
      .subtitle { font: 500 16px 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif; fill: #56687a; }
      .section { font: 700 20px 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif; fill: #25364a; }
      .text { font: 500 16px 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif; fill: #203043; }
      .small { font: 500 13px 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif; fill: #4c5d70; }
      .mono { font: 600 13px Consolas, 'Cascadia Mono', monospace; fill: #27364a; }
      .label { font: 700 13px 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif; fill: #ffffff; }
      .box { fill: #ffffff; stroke: #cbd7e3; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .box-blue { fill: #eaf3ff; stroke: #7fb2f0; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .box-green { fill: #eaf8ee; stroke: #75c58c; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .box-yellow { fill: #fff8df; stroke: #e5be4d; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .box-purple { fill: #f4efff; stroke: #a995e8; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .box-gray { fill: #f2f5f8; stroke: #9aa8b7; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .box-red { fill: #fff0f0; stroke: #e28282; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .lane { fill: #edf2f7; stroke: #d0d9e4; stroke-width: 1.5; rx: 22; }
      .arrow { stroke: #34495e; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #7890a8; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 6; }
      .badge { rx: 10; }
      /* meshfill-graph-style: shared light engineering diagram theme */
      :root { color-scheme: light; }
      .bg, rect[fill="url(#bg)"] { fill: #f8fafc; }
      svg > circle[opacity] { opacity: 0; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .title { font: 700 34px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .subtitle { font: 500 16px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .section, .section-title { font: 700 18px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #1e293b; letter-spacing: 0; }
      .band-title, .lane-title { font: 700 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #334155; letter-spacing: 0; }
      .label, .node-title, .pill-text { font: 700 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .text { font: 500 16px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #1f2937; letter-spacing: 0; }
      .small { font: 500 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .tiny { font: 500 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #64748b; letter-spacing: 0; }
      .mono, .mono-strong, .formula { font: 600 12px Consolas, "Cascadia Mono", monospace; fill: #334155; letter-spacing: 0; }
      .lane, .band, .band2d, .band3d, .band-field, .band-post, .lane-type, .lane-resource, .lane-field, .lane-runtime, .lane-factory, .lane-owner, .lane-tool, .state-band, .target-band, .asset-band, .route-band, .place-band { fill: #ffffff; stroke: #dbe3ef; stroke-width: 1.2; }
      .node, .card, .soft, .tick, .legend { stroke-width: 1.4; filter: url(#shadow); }
      .box, .box-gray, .card, .soft, .support, .tool, .owner, .factory, .downstream, .legacy, .getter, .runtime, .tick, .legend { fill: #ffffff; stroke: #cbd5e1; }
      .box-blue, .input, .entry, .field, .state, .sv, .target, .target-card, .gpu-card, .gpu { fill: #dbeafe; stroke: #2563eb; }
      .box-green, .asset, .resource, .autoobject, .input-card, .source-card, .contract, .sv-card, .ok, .prefilter-card { fill: #dcfce7; stroke: #16a34a; }
      .box-purple, .route, .route-card, .rerank-card, .gate-card, .descriptor, .record-card, .vdb-card, .debug-card { fill: #ede9fe; stroke: #7c3aed; }
      .box-yellow, .placement, .placement-card, .commit-card, .persist-card, .aggregate-card { fill: #fef3c7; stroke: #d97706; }
      .box-red, .hardgate, .prune-card { fill: #fee2e2; stroke: #ef4444; }
      .record, .record-card { fill: #fef3c7; stroke: #d97706; }
      .cache, .cache-card, .scene_voxel_runtime { fill: #ccfbf1; stroke: #0f766e; }
      .note, .warn { fill: #e6edf5; stroke: #b6c4d4; }
      .pill, .pill-blue, .pill-pink, .pill-amber { fill: #f8fafc; stroke: #cbd5e1; }
      rect[fill="#0f172a"], rect[fill="#111827"], rect[fill="#172033"], rect[fill="#16213a"], rect[fill="#101827"], rect[fill="#111c31"], rect[fill="#082f49"], rect[fill="#052e2b"], rect[fill="#052e16"], rect[fill="#064e3b"], rect[fill="#062f26"], rect[fill="#2e1065"], rect[fill="#2b2038"], rect[fill="#2b1d35"], rect[fill="#0f1f2f"], rect[fill="#182135"], rect[fill="#1e2030"], rect[fill="#1b2330"], rect[fill="#3a2510"], rect[fill="#0e2a1d"], rect[fill="#10251e"] { fill: #ffffff; stroke: #cbd5e1; }
      .edge, .arrow, .dash { fill: none; stroke: #334155; stroke-width: 2.2; }
      .edge-soft, .arrow-soft { fill: none; stroke: #64748b; stroke-width: 2; }
      .edge-blue, .arrow-blue { fill: none; stroke: #2563eb; stroke-width: 2.3; }
      .edge-green, .arrow-green, .dash-green { fill: none; stroke: #059669; stroke-width: 2.3; }
      .edge-orange, .edge-amber, .arrow-purple, .dash-purple { fill: none; stroke: #d97706; stroke-width: 2.3; }
      .edge-purple { fill: none; stroke: #7c3aed; stroke-width: 2.3; }
      .arrow-red, .dash-red, .dash-pink { fill: none; stroke: #dc2626; stroke-width: 2.2; }
      .dash, .dash-green, .dash-red, .dash-pink, .dash-purple, .edge-soft, .arrow-soft { stroke-dasharray: 7 7; }
      #arrow path { fill: #334155; }
      #arrowGreen path, #arrow-green path { fill: #059669; }
      #arrowBlue path, #arrow-blue path { fill: #2563eb; }
      #arrowRed path, #arrow-red path { fill: #dc2626; }
      #arrowPurple path, #arrow-purple path, #arrow-orange path, #arrow-amber path { fill: #d97706; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1560" height="980"/>
  <text class="title" x="60" y="62">AutoObject Probe 粗筛：SceneVoxelActor 与 GPU AnchorState</text>
  <text class="subtitle" x="62" y="94">score / top-K 留在 GPU，生命周期跟随当前 SceneVoxel epoch；CPU readback 只作 debug / 兼容</text>

  <rect class="lane" x="40" y="126" width="1480" height="170"/>
  <text class="section" x="68" y="162">SceneVoxelActor[tick] 同生命周期输入</text>

  <rect class="box-blue" x="70" y="190" width="300" height="82"/>
  <text class="section" x="94" y="224">SV + SceneVoxelLocal</text>
  <text class="small" x="94" y="250">scene_field / collision_field sampling buffers</text>

  <rect class="box-blue" x="410" y="190" width="300" height="82"/>
  <text class="section" x="434" y="224">TargetSV + BrushSV</text>
  <text class="small" x="434" y="250">stored source canvas + stored brush delta</text>

  <rect class="box-blue" x="750" y="190" width="300" height="82"/>
  <text class="section" x="774" y="224">TargetSV_B</text>
  <text class="small" x="774" y="250">composited target read buffers</text>

  <rect class="box-blue" x="1090" y="190" width="300" height="82"/>
  <text class="section" x="1114" y="224">AutoObject registry</text>
  <text class="small" x="1114" y="250">descriptor-backed probe buffers</text>

  <path class="arrow-soft" d="M220 272 V330"/>
  <path class="arrow-soft" d="M560 272 V330"/>
  <path class="arrow-soft" d="M900 272 V330"/>
  <path class="arrow-soft" d="M1240 272 V330"/>

  <rect class="lane" x="40" y="320" width="1480" height="250"/>
  <text class="section" x="68" y="356">GPU-only prefilter：4 个 compute dispatch</text>

  <rect class="box-green" x="70" y="395" width="320" height="112"/>
  <text class="section" x="94" y="430">1. collect_sv_anchors</text>
  <text class="small" x="94" y="458">dirty regions (tiles compat) 内提取 anchor</text>
  <text class="mono" x="94" y="482">ground + target_top</text>

  <rect class="box-yellow" x="430" y="395" width="320" height="112"/>
  <text class="section" x="454" y="430">2. score_anchor_asset_probes</text>
  <text class="small" x="454" y="458">anchor × asset probe scoring</text>
  <text class="mono" x="454" y="482">scene / target / collision sample</text>

  <rect class="box-purple" x="790" y="395" width="320" height="112"/>
  <text class="section" x="814" y="430">3. select_anchor_topk</text>
  <text class="small" x="814" y="458">每个 anchor 选择 TOPK asset</text>
  <text class="mono" x="814" y="482">score &gt;= min_prefilter_score</text>

  <rect class="box-green" x="1150" y="395" width="320" height="112"/>
  <text class="section" x="1174" y="430">4. reduce_to_voxel_regions</text>
  <text class="small" x="1174" y="458">按 asset 聚合 voxel-region votes</text>
  <text class="mono" x="1174" y="482">asset_id * tile_count + tile_id</text>

  <path class="arrow" d="M390 451 H430"/>
  <path class="arrow" d="M750 451 H790"/>
  <path class="arrow" d="M1110 451 H1150"/>

  <rect class="box-gray" x="310" y="530" width="940" height="58"/>
  <text class="mono" x="336" y="564">GPU AnchorState: anchor_buf / asset_scores_buf / topk_buf / candidate route votes</text>

  <path class="arrow-soft" d="M780 588 V638"/>

  <rect class="lane" x="40" y="626" width="1480" height="300"/>
  <text class="section" x="68" y="662">后续放置与可选兼容 readback</text>

  <rect class="box-yellow" x="70" y="700" width="360" height="150"/>
  <text class="section" x="94" y="735">GPU route buffer</text>
  <text class="text" x="94" y="766">常驻 actor 生命周期内</text>
  <text class="mono" x="94" y="794">AnchorState.score/topK</text>
  <text class="mono" x="94" y="818">route votes (voxel_sparse_votes compat)</text>

  <rect class="box-purple" x="500" y="700" width="380" height="150"/>
  <text class="section" x="524" y="735">optional CPU compat view</text>
  <text class="small" x="524" y="764">只用于 debug / 统计 / 旧接口接入</text>
  <text class="mono" x="524" y="792">compat/debug candidate_sparses</text>
  <text class="tiny" x="524" y="810">autoobject_candidate_voxel_sparses</text>
  <text class="mono" x="524" y="832">score/topK 不要求 readback</text>

  <rect class="box-green" x="950" y="700" width="480" height="150"/>
  <text class="section" x="974" y="735">VoxelPlacementGenerator / GPU placement</text>
  <text class="mono" x="974" y="766">candidate route limits dispatch</text>
  <text class="small" x="974" y="794">按 asset_index / route buffer 进入后续 physical scoring</text>
  <text class="small" x="974" y="820">只限定候选区域；物理由 score_voxel_tile.glsl 精筛</text>

  <path class="arrow" d="M430 775 H500"/>
  <path class="arrow" d="M880 775 H950"/>

  <rect x="78" y="878" width="610" height="34" rx="10" fill="#e6edf5" stroke="#b6c4d4"/>
  <text class="small" x="98" y="900">权威运行时结果：GPU AnchorState + candidate route buffer；生命周期跟随 SceneVoxelActor[tick]。</text>

  <rect x="780" y="878" width="650" height="34" rx="10" fill="#e6edf5" stroke="#b6c4d4"/>
  <text class="small" x="800" y="900">TargetSV 与 BrushSV 需要存储；TargetSV_B 是合成读取缓存，不替代源状态。</text>
</svg>
