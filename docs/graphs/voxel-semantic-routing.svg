<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1040" viewBox="0 0 1660 1040" role="img" aria-labelledby="title desc">
  <title id="title">Voxel Semantic Routing</title>
  <desc id="desc">Candidate voxel-region routing diagram from voxel-semantic-routing.md and todo baseline.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#ea580c"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <pattern id="autoobject-dot-bg" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#cffafe"/>
      <circle cx="3" cy="3" r="1.25" fill="#0891b2" opacity="0.256281"/>
      <circle cx="9" cy="9" r="1.25" fill="#0891b2" opacity="0.256281"/>
    </pattern>
    <pattern id="descriptor-grid" patternUnits="userSpaceOnUse" width="9.3334" height="9.3334">
      <rect width="9.3334" height="9.3334" fill="#dcfce7"/>
      <path d="M4.6667 0H0V4.6667" stroke="#16a34a" stroke-width="0.3333" opacity="0.257576"/>
      <path d="M0 4.6667L4.6667 0" stroke="#16a34a" stroke-width="0.3333" opacity="0.257576"/>
    </pattern>
    <pattern id="sv-stripe-blue" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#dbeafe"/>
      <rect y="1" width="10" height="2" fill="#0284c7" opacity="0.235023"/>
      <rect y="6" width="10" height="1.5" fill="#0284c7" opacity="0.235023"/>
    </pattern>
    <pattern id="sv-stripe-amber" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#fef3c7"/>
      <rect y="1" width="10" height="2" fill="#d97706" opacity="0.264249"/>
      <rect y="6" width="10" height="1.5" fill="#d97706" opacity="0.264249"/>
    </pattern>
    <pattern id="note-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#f1f5f9"/>
      <rect x="0" y="0" width="10" height="2" fill="#64748b" opacity="0.361702"/>
    </pattern>
  </defs>
  <style>
    :root { color-scheme: light; }
    .bg { fill: #f8fafc; }
    .grid { stroke: #e2e8f0; stroke-width: 1; opacity: 0.7; }
    .title { fill: #0f172a; font: 700 34px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .subtitle { fill: #475569; font: 500 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .lane-title { fill: #334155; font: 700 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .node-title { fill: #0f172a; font: 700 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .small { fill: #475569; font: 500 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .mono { fill: #334155; font: 600 11px Consolas, "Cascadia Mono", monospace; letter-spacing: 0; }
    .note-text { fill: #0f172a; font: 600 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .lane { fill: #ffffff; stroke: #dbe3ef; stroke-width: 1.2; filter: url(#shadow); }
    .node { stroke-width: 1.5; filter: url(#shadow); }
    .edge { stroke: #334155; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
    .edge-blue { stroke: #2563eb; stroke-width: 2.2; fill: none; marker-end: url(#arrow-blue); }
    .edge-green { stroke: #059669; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
    .edge-orange { stroke: #ea580c; stroke-width: 2.2; fill: none; marker-end: url(#arrow-orange); }
    .edge-dash { stroke: #64748b; stroke-width: 1.9; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    .edge-warn { stroke: #dc2626; stroke-width: 2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
  </style>

  <rect class="bg" x="0" y="0" width="1660" height="1040"/>
  <g opacity="0.65"><line class="grid" x1="40" y1="86" x2="40" y2="1004"/><line class="grid" x1="120" y1="86" x2="120" y2="1004"/><line class="grid" x1="200" y1="86" x2="200" y2="1004"/><line class="grid" x1="280" y1="86" x2="280" y2="1004"/><line class="grid" x1="360" y1="86" x2="360" y2="1004"/><line class="grid" x1="440" y1="86" x2="440" y2="1004"/><line class="grid" x1="520" y1="86" x2="520" y2="1004"/><line class="grid" x1="600" y1="86" x2="600" y2="1004"/><line class="grid" x1="680" y1="86" x2="680" y2="1004"/><line class="grid" x1="760" y1="86" x2="760" y2="1004"/><line class="grid" x1="840" y1="86" x2="840" y2="1004"/><line class="grid" x1="920" y1="86" x2="920" y2="1004"/><line class="grid" x1="1000" y1="86" x2="1000" y2="1004"/><line class="grid" x1="1080" y1="86" x2="1080" y2="1004"/><line class="grid" x1="1160" y1="86" x2="1160" y2="1004"/><line class="grid" x1="1240" y1="86" x2="1240" y2="1004"/><line class="grid" x1="1320" y1="86" x2="1320" y2="1004"/><line class="grid" x1="1400" y1="86" x2="1400" y2="1004"/><line class="grid" x1="1480" y1="86" x2="1480" y2="1004"/><line class="grid" x1="1560" y1="86" x2="1560" y2="1004"/><line class="grid" x1="1640" y1="86" x2="1640" y2="1004"/><line class="grid" x1="30" y1="120" x2="1630" y2="120"/><line class="grid" x1="30" y1="200" x2="1630" y2="200"/><line class="grid" x1="30" y1="280" x2="1630" y2="280"/><line class="grid" x1="30" y1="360" x2="1630" y2="360"/><line class="grid" x1="30" y1="440" x2="1630" y2="440"/><line class="grid" x1="30" y1="520" x2="1630" y2="520"/><line class="grid" x1="30" y1="600" x2="1630" y2="600"/><line class="grid" x1="30" y1="680" x2="1630" y2="680"/><line class="grid" x1="30" y1="760" x2="1630" y2="760"/><line class="grid" x1="30" y1="840" x2="1630" y2="840"/><line class="grid" x1="30" y1="920" x2="1630" y2="920"/><line class="grid" x1="30" y1="1000" x2="1630" y2="1000"/></g>
  <text class="title" x="48" y="54">Voxel Semantic Routing</text>
  <text class="subtitle" x="48" y="82">Current candidate voxel-region route: GPU prefilter, conservative expansion, empty-route skip, then physical scoring.</text>
  <g>
    <rect class="lane" x="45" y="115" width="355" height="770" rx="8"/>
    <text class="lane-title" x="63" y="141">UPSTREAM INPUTS</text>
    <rect class="lane" x="440" y="115" width="355" height="770" rx="8"/>
    <text class="lane-title" x="458" y="141">PREFILTER ROUTE</text>
    <rect class="lane" x="835" y="115" width="355" height="770" rx="8"/>
    <text class="lane-title" x="853" y="141">CANDIDATE REGION CONTRACT</text>
    <rect class="lane" x="1230" y="115" width="385" height="770" rx="8"/>
    <text class="lane-title" x="1248" y="141">PLACEMENT + TODO BOUNDARY</text>
  </g>
  <g>
    <path class="edge-blue" d="M 360 218 L 480 202"/>
    <path class="edge-blue" d="M 360 388 L 480 368"/>
    <path class="edge-green" d="M 360 558 L 480 368"/>
    <path class="edge" d="M 618 255 L 618 310"/>
    <path class="edge" d="M 618 425 L 618 480"/>
    <path class="edge" d="M 618 590 L 618 650"/>
    <path class="edge-orange" d="M 755 702 L 875 228"/>
    <path class="edge" d="M 1012 300 L 1012 365"/>
    <path class="edge" d="M 1012 490 L 1012 570"/>
    <path class="edge-orange" d="M 1150 428 L 1270 228"/>
    <path class="edge" d="M 1420 285 L 1420 350"/>
    <path class="edge-orange" d="M 1420 465 L 1420 530"/>
    <path class="edge-dash" d="M 1420 655 L 1420 730"/>
  </g>
  <g>
    <g id="sv[t---1]-resident">
    <rect class="node" x="85" y="160" width="275" height="115" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
    <text class="node-title" x="103" y="188">SV[t - 1] resident</text>
    <text class="small"><tspan x="103" y="210">scene_field</tspan><tspan x="103" y="227">collision_field</tspan><tspan x="103" y="244">stable placement input</tspan></text>
    </g>
    <g id="targetsv_b">
    <rect class="node" x="85" y="330" width="275" height="115" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
    <text class="node-title" x="103" y="358">TargetSV_B</text>
    <text class="small"><tspan x="103" y="380">target_occupancy</tspan><tspan x="103" y="397">target_color</tspan><tspan x="103" y="414">guidance only</tspan></text>
    </g>
    <g id="autoobject-registry">
    <rect class="node" x="85" y="500" width="275" height="115" rx="8" fill="url(#autoobject-dot-bg)" stroke="#0891b2"/>
    <text class="node-title" x="103" y="528">AutoObject registry</text>
    <text class="small"><tspan x="103" y="550">assets available this tick</tspan><tspan x="103" y="567">descriptor probes</tspan><tspan x="103" y="584">footprint + route profile data</tspan></text>
    </g>
    <g id="position-only-anchors">
    <rect class="node" x="480" y="150" width="275" height="105" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text class="node-title" x="498" y="178">Position-only anchors</text>
    <text class="small"><tspan x="498" y="200">supported candidates</tspan><tspan x="498" y="217">column-top candidates</tspan><tspan x="498" y="234">no anchor_kind field</tspan></text>
    </g>
    <g id="score-semantic-probes">
    <rect class="node" x="480" y="310" width="275" height="115" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text class="node-title" x="498" y="338">Score semantic probes</text>
    <text class="small"><tspan x="498" y="360">descriptor-backed probes</tspan><tspan x="498" y="377">clamp samples</tspan><tspan x="498" y="394">anchor x asset score</tspan></text>
    </g>
    <g id="anchor_autoobject_topk">
    <rect class="node" x="480" y="480" width="275" height="110" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text class="node-title" x="498" y="508">anchor_autoobject_topk</text>
    <text class="small"><tspan x="498" y="530">hard gate candidate assets</tspan><tspan x="498" y="547">does not read back currently</tspan><tspan x="498" y="564">used by reduce pass</tspan></text>
    </g>
    <g id="per-asset-votes">
    <rect class="node" x="480" y="650" width="275" height="105" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text class="node-title" x="498" y="678">Per-asset votes</text>
    <text class="small"><tspan x="498" y="700">voxel-region votes</tspan><tspan x="498" y="717">GPU reduce pass</tspan><tspan x="498" y="734">vote tile only</tspan></text>
    </g>
    <g id="readback-expansion">
    <rect class="node" x="875" y="155" width="275" height="145" rx="8" fill="url(#sv-stripe-amber)" stroke="#d97706"/>
    <text class="node-title" x="893" y="183">Readback expansion</text>
    <text class="small"><tspan x="893" y="205">voted anchor tile</tspan><tspan x="893" y="222">+ footprint AABB</tspan><tspan x="893" y="239">+ probe offset bounds</tspan><tspan x="893" y="256">+ context radius</tspan><tspan x="893" y="273">+ interpolation guard &gt;= 1</tspan></text>
    </g>
    <g id="candidate_voxel_regions_by_asset">
    <rect class="node" x="875" y="365" width="275" height="125" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text class="node-title" x="893" y="393">candidate_voxel_regions_by_asset</text>
    <text class="small"><tspan x="893" y="415">debug route dictionary</tspan><tspan x="893" y="432">values are voxel regions</tspan><tspan x="893" y="449">prefer recall over exact clipping</tspan></text>
    </g>
    <g id="empty-route-behavior">
    <rect class="node" x="875" y="570" width="275" height="115" rx="8" fill="url(#note-hatch)" stroke="#64748b"/>
    <text class="node-title" x="893" y="598">Empty route behavior</text>
    <text class="small"><tspan x="893" y="620">explicit empty list</tspan><tspan x="893" y="637">skipped_prefilter = true</tspan><tspan x="893" y="654">no full-grid fallback</tspan></text>
    </g>
    <g id="run_multi_asset()">
    <rect class="node" x="1270" y="170" width="300" height="115" rx="8" fill="#ffedd5" stroke="#ea580c"/>
    <text class="node-title" x="1288" y="198">run_multi_asset()</text>
    <text class="small"><tspan x="1288" y="220">consume per-asset regions</tspan><tspan x="1288" y="237">asset local candidate override allowed</tspan><tspan x="1288" y="254">string/int key routing</tspan></text>
    </g>
    <g id="same-type-exclusion-gate">
    <rect class="node" x="1270" y="350" width="300" height="115" rx="8" fill="#ffedd5" stroke="#ea580c"/>
    <text class="node-title" x="1288" y="378">Same-type exclusion gate</text>
    <text class="small"><tspan x="1288" y="400">optional pre-score prune</tspan><tspan x="1288" y="417">uses min_spacing</tspan><tspan x="1288" y="434">does not replace footprint score</tspan></text>
    </g>
    <g id="score_voxel_tile.glsl">
    <rect class="node" x="1270" y="530" width="300" height="125" rx="8" fill="#ffedd5" stroke="#ea580c"/>
    <text class="node-title" x="1288" y="558">score_voxel_tile.glsl</text>
    <text class="small"><tspan x="1288" y="580">scene/collision fields</tspan><tspan x="1288" y="597">target fit</tspan><tspan x="1288" y="614">footprint/support/clearance</tspan><tspan x="1288" y="631">physical score only</tspan></text>
    </g>
    <g id="future-rerank-/-validation">
    <rect class="node" x="1270" y="730" width="300" height="100" rx="8" fill="#f5f3ff" stroke="#8b5cf6"/>
    <text class="node-title" x="1288" y="758">Future rerank / validation</text>
    <text class="small"><tspan x="1288" y="780">candidate-set only</tspan><tspan x="1288" y="797">no full asset enumeration</tspan><tspan x="1288" y="814">no MLP in physical shader now</tspan></text>
    </g>
  </g>
  <g>
    <g>
    <rect x="85" y="780" width="665" height="75" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
    <text class="note-text" x="99" y="804">Terminology</text>
    <text class="small"><tspan x="99" y="825">Docs use voxel region for the high-level routing unit. candidate_voxel_regions* is preferred; sparse aliases are compatibility/storage names.</tspan></text>
  </g>
  </g>
</svg>
