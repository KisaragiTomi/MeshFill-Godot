<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" role="img" aria-labelledby="title desc">
  <title id="title">AutoObject and AutoVoxelDescriptor Relationship</title>
  <desc id="desc">Focused ownership diagram for AutoObject and AutoVoxelDescriptor.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#ea580c"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <pattern id="autoobject-dot-bg" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#cffafe"/>
      <circle cx="3" cy="3" r="1.25" fill="#0891b2" opacity="0.256281"/>
      <circle cx="9" cy="9" r="1.25" fill="#0891b2" opacity="0.256281"/>
    </pattern>
    <pattern id="descriptor-grid" patternUnits="userSpaceOnUse" width="9.3334" height="9.3334">
      <rect width="9.3334" height="9.3334" fill="#dcfce7"/>
      <path d="M4.6667 0H0V4.6667" stroke="#16a34a" stroke-width="0.3333" opacity="0.257576"/>
      <path d="M0 4.6667L4.6667 0" stroke="#16a34a" stroke-width="0.3333" opacity="0.257576"/>
    </pattern>
    <pattern id="sv-stripe-blue" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#dbeafe"/>
      <rect y="1" width="10" height="2" fill="#0284c7" opacity="0.235023"/>
      <rect y="6" width="10" height="1.5" fill="#0284c7" opacity="0.235023"/>
    </pattern>
    <pattern id="sv-stripe-amber" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#fef3c7"/>
      <rect y="1" width="10" height="2" fill="#d97706" opacity="0.264249"/>
      <rect y="6" width="10" height="1.5" fill="#d97706" opacity="0.264249"/>
    </pattern>
    <pattern id="note-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#f1f5f9"/>
      <rect x="0" y="0" width="10" height="2" fill="#64748b" opacity="0.361702"/>
    </pattern>
  </defs>
  <style>
    :root { color-scheme: light; }
    .bg { fill: #f8fafc; }
    .grid { stroke: #e2e8f0; stroke-width: 1; opacity: 0.7; }
    .title { fill: #0f172a; font: 700 34px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .subtitle { fill: #475569; font: 500 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .lane-title { fill: #334155; font: 700 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .node-title { fill: #0f172a; font: 700 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .small { fill: #475569; font: 500 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .mono { fill: #334155; font: 600 11px Consolas, "Cascadia Mono", monospace; letter-spacing: 0; }
    .note-text { fill: #0f172a; font: 600 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .lane { fill: #ffffff; stroke: #dbe3ef; stroke-width: 1.2; filter: url(#shadow); }
    .node { stroke-width: 1.5; filter: url(#shadow); }
    .edge { stroke: #334155; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
    .edge-blue { stroke: #2563eb; stroke-width: 2.2; fill: none; marker-end: url(#arrow-blue); }
    .edge-green { stroke: #059669; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
    .edge-orange { stroke: #ea580c; stroke-width: 2.2; fill: none; marker-end: url(#arrow-orange); }
    .edge-dash { stroke: #64748b; stroke-width: 1.9; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    .edge-warn { stroke: #dc2626; stroke-width: 2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
  </style>

  <rect class="bg" x="0" y="0" width="1500" height="880"/>
  <g opacity="0.65"><line class="grid" x1="40" y1="86" x2="40" y2="844"/><line class="grid" x1="120" y1="86" x2="120" y2="844"/><line class="grid" x1="200" y1="86" x2="200" y2="844"/><line class="grid" x1="280" y1="86" x2="280" y2="844"/><line class="grid" x1="360" y1="86" x2="360" y2="844"/><line class="grid" x1="440" y1="86" x2="440" y2="844"/><line class="grid" x1="520" y1="86" x2="520" y2="844"/><line class="grid" x1="600" y1="86" x2="600" y2="844"/><line class="grid" x1="680" y1="86" x2="680" y2="844"/><line class="grid" x1="760" y1="86" x2="760" y2="844"/><line class="grid" x1="840" y1="86" x2="840" y2="844"/><line class="grid" x1="920" y1="86" x2="920" y2="844"/><line class="grid" x1="1000" y1="86" x2="1000" y2="844"/><line class="grid" x1="1080" y1="86" x2="1080" y2="844"/><line class="grid" x1="1160" y1="86" x2="1160" y2="844"/><line class="grid" x1="1240" y1="86" x2="1240" y2="844"/><line class="grid" x1="1320" y1="86" x2="1320" y2="844"/><line class="grid" x1="1400" y1="86" x2="1400" y2="844"/><line class="grid" x1="1480" y1="86" x2="1480" y2="844"/><line class="grid" x1="30" y1="120" x2="1470" y2="120"/><line class="grid" x1="30" y1="200" x2="1470" y2="200"/><line class="grid" x1="30" y1="280" x2="1470" y2="280"/><line class="grid" x1="30" y1="360" x2="1470" y2="360"/><line class="grid" x1="30" y1="440" x2="1470" y2="440"/><line class="grid" x1="30" y1="520" x2="1470" y2="520"/><line class="grid" x1="30" y1="600" x2="1470" y2="600"/><line class="grid" x1="30" y1="680" x2="1470" y2="680"/><line class="grid" x1="30" y1="760" x2="1470" y2="760"/><line class="grid" x1="30" y1="840" x2="1470" y2="840"/></g>
  <text class="title" x="48" y="54">AutoObject and AutoVoxelDescriptor Relationship</text>
  <text class="subtitle" x="48" y="82">Runtime nodes keep identity and placement helpers; descriptors own asset defaults and semantic probes.</text>
  <g>
    <rect class="lane" x="55" y="120" width="400" height="640" rx="8"/>
    <text class="lane-title" x="73" y="146">DESCRIPTOR AUTHORITY</text>
    <rect class="lane" x="550" y="120" width="400" height="640" rx="8"/>
    <text class="lane-title" x="568" y="146">AUTOOBJECT RUNTIME</text>
    <rect class="lane" x="1045" y="120" width="395" height="640" rx="8"/>
    <text class="lane-title" x="1063" y="146">EXPORT / QUERY BOUNDARY</text>
  </g>
  <g>
    <path class="edge-green" d="M 415 240 L 590 235"/>
    <text class="mono" x="470" y="225">held by</text>
    <path class="edge" d="M 750 300 L 750 365"/>
    <path class="edge-orange" d="M 910 430 L 1085 240"/>
    <text class="mono" x="965" y="340">export</text>
    <path class="edge" d="M 1242 305 L 1242 375"/>
    <path class="edge-green" d="M 415 435 L 590 430"/>
    <path class="edge-dash" d="M 590 612 L 415 240"/>
    <text class="mono" x="455" y="598">sync input</text>
    <path class="edge-dash" d="M 910 612 L 1085 610"/>
    <path class="edge-dash" d="M 255 500 L 255 570"/>
    <text class="mono" x="270" y="545">future only</text>
  </g>
  <g>
    <g id="autovoxeldescriptor">
    <rect class="node" x="95" y="170" width="320" height="145" rx="8" fill="url(#descriptor-grid)" stroke="#16a34a"/>
    <text class="node-title" x="113" y="198">AutoVoxelDescriptor</text>
    <text class="small"><tspan x="113" y="220">asset defaults</tspan><tspan x="113" y="237">color / complexity / collision</tspan><tspan x="113" y="254">semantic probes / pivots</tspan><tspan x="113" y="271">mesh and vegetation settings</tspan></text>
    </g>
    <g id="descriptor-record-fields">
    <rect class="node" x="95" y="385" width="320" height="115" rx="8" fill="url(#descriptor-grid)" stroke="#16a34a"/>
    <text class="node-title" x="113" y="413">Descriptor record fields</text>
    <text class="small"><tspan x="113" y="435">to_record_fields()</tspan><tspan x="113" y="452">canonical collision</tspan><tspan x="113" y="469">optional semantic_probes</tspan></text>
    </g>
    <g id="runtime-profile-todo">
    <rect class="node" x="95" y="570" width="320" height="105" rx="8" fill="#f5f3ff" stroke="#8b5cf6"/>
    <text class="node-title" x="113" y="598">Runtime profile TODO</text>
    <text class="small"><tspan x="113" y="620">profile registry not implemented</tspan><tspan x="113" y="637">future GPU profile_id sampling</tspan></text>
    </g>
    <g id="autoobject.voxel_descriptor">
    <rect class="node" x="590" y="170" width="320" height="130" rx="8" fill="url(#autoobject-dot-bg)" stroke="#0891b2"/>
    <text class="node-title" x="608" y="198">AutoObject.voxel_descriptor</text>
    <text class="small"><tspan x="608" y="220">single descriptor entry</tspan><tspan x="608" y="237">creates descriptor when missing</tspan><tspan x="608" y="254">runtime node owns identity</tspan></text>
    </g>
    <g id="descriptor-backed-getters">
    <rect class="node" x="590" y="365" width="320" height="130" rx="8" fill="url(#autoobject-dot-bg)" stroke="#0891b2"/>
    <text class="node-title" x="608" y="393">Descriptor-backed getters</text>
    <text class="small"><tspan x="608" y="415">get_voxel_color()</tspan><tspan x="608" y="432">get_voxel_complexity()</tspan><tspan x="608" y="449">get_collision()</tspan><tspan x="608" y="466">get_semantic_probes()</tspan></text>
    </g>
    <g id="descriptor-field-boundaries">
    <rect class="node" x="590" y="560" width="320" height="105" rx="8" fill="url(#note-hatch)" stroke="#64748b"/>
    <text class="node-title" x="608" y="588">Compat mirror fields</text>
    <text class="small"><tspan x="608" y="610">Inspector/config input</tspan><tspan x="608" y="627">sync into descriptor</tspan><tspan x="608" y="644">never read as authority</tspan></text>
    </g>
    <g id="make_ISWS()">
    <rect class="node" x="1085" y="180" width="315" height="125" rx="8" fill="url(#sv-stripe-amber)" stroke="#d97706"/>
    <text class="node-title" x="1103" y="208">make_ISWS()</text>
    <text class="small"><tspan x="1103" y="230">instance_stamp_write_spec</tspan><tspan x="1103" y="247">payload for this tick</tspan><tspan x="1103" y="264">record/debug handle</tspan></text>
    </g>
    <g id="scenevoxel-commit-path">
    <rect class="node" x="1085" y="375" width="315" height="115" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
    <text class="node-title" x="1103" y="403">SceneVoxel commit path</text>
    <text class="small"><tspan x="1103" y="425">source streams</tspan><tspan x="1103" y="442">blend_scene_voxels()</tspan><tspan x="1103" y="459">public payload</tspan></text>
    </g>
    <g id="metadata-projection">
    <rect class="node" x="1085" y="560" width="315" height="110" rx="8" fill="url(#note-hatch)" stroke="#64748b"/>
    <text class="node-title" x="1103" y="588">Metadata projection</text>
    <text class="small"><tspan x="1103" y="610">auto_id, instance_id, source</tspan><tspan x="1103" y="627">object_type for runtime grouping</tspan><tspan x="1103" y="644">not asset defaults</tspan></text>
    </g>
  </g>
  <g>
    <g>
    <rect x="470" y="720" width="560" height="90" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
    <text class="note-text" x="484" y="744">Boundary sentence</text>
    <text class="small"><tspan x="484" y="765">AutoObject answers where an instance is and how it writes this tick.</tspan><tspan x="484" y="781">AutoVoxelDescriptor answers what the asset means by default.</tspan></text>
  </g>
  </g>
</svg>
