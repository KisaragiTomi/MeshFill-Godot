<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">AutoObject System Map</title>
  <desc id="desc">AutoObject ownership and data flow: asset defaults, semantic probes, placement scoring, runtime voxel records, source deltas, committed SceneVoxel state, GlobalVoxelField cache, and AutoObjectManager query projection.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-7%" y="-7%" width="114%" height="114%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .title { fill: #0f172a; font: 700 34px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; }
      .subtitle { fill: #475569; font: 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; }
      .lane-title { fill: #334155; font: 700 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: .08em; }
      .label { fill: #0f172a; font: 700 17px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; }
      .small { fill: #334155; font: 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; }
      .tiny { fill: #475569; font: 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; }
      .mono { fill: #1e3a8a; font: 700 12px Consolas, "Cascadia Mono", monospace; }
      .rule { fill: #0f172a; font: 700 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; }
      .lane { stroke-width: 1.4; filter: url(#shadow); }
      .lane-asset { fill: #f0fdf4; stroke: #22c55e; }
      .lane-route { fill: #eff6ff; stroke: #3b82f6; }
      .lane-place { fill: #fff7ed; stroke: #f97316; }
      .lane-state { fill: #f8fafc; stroke: #94a3b8; }
      .node { stroke-width: 1.6; filter: url(#shadow); }
      .asset { fill: #dcfce7; stroke: #16a34a; }
      .route { fill: #dbeafe; stroke: #2563eb; }
      .place { fill: #ffedd5; stroke: #f97316; }
      .record { fill: #fef3c7; stroke: #d97706; }
      .state { fill: #e0f2fe; stroke: #0284c7; }
      .query { fill: #ccfbf1; stroke: #0f766e; }
      .warn { fill: #fee2e2; stroke: #dc2626; }
      .support { fill: #f1f5f9; stroke: #64748b; }
      .edge { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .edge-blue { stroke: #2563eb; stroke-width: 2.3; fill: none; marker-end: url(#arrow-blue); }
      .edge-green { stroke: #059669; stroke-width: 2.3; fill: none; marker-end: url(#arrow-green); }
      .edge-red { stroke: #dc2626; stroke-width: 2.2; fill: none; marker-end: url(#arrow-red); stroke-dasharray: 7 6; }
      .edge-soft { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect class="bg" width="1500" height="980"/>
  <path class="grid" d="M0 120H1500M0 300H1500M0 480H1500M0 660H1500M0 840H1500"/>
  <path class="grid" d="M310 120V920M610 120V920M910 120V920M1210 120V920"/>

  <text class="title" x="48" y="58">AutoObject System Map</text>
  <text class="subtitle" x="48" y="88">Default asset semantics flow through probe prefiltering and physical placement, then become runtime records and committed SceneVoxel state.</text>

  <rect class="lane lane-asset" x="32" y="132" width="336" height="478" rx="20" ry="20"/>
  <rect class="lane lane-route" x="398" y="132" width="336" height="478" rx="20" ry="20"/>
  <rect class="lane lane-place" x="764" y="132" width="336" height="478" rx="20" ry="20"/>
  <rect class="lane lane-state" x="1130" y="132" width="336" height="478" rx="20" ry="20"/>
  <rect class="lane lane-state" x="32" y="640" width="1434" height="180" rx="20" ry="20"/>

  <text class="lane-title" x="58" y="164">ASSET DEFAULTS</text>
  <text class="lane-title" x="424" y="164">CANDIDATE SELECTION</text>
  <text class="lane-title" x="790" y="164">PHYSICAL PLACEMENT</text>
  <text class="lane-title" x="1156" y="164">RUNTIME INSTANCE</text>
  <text class="lane-title" x="58" y="672">COMMITTED STATE AND QUERY PROJECTION</text>

  <rect class="node asset" x="58" y="194" width="284" height="118" rx="16" ry="16"/>
  <text class="label" x="78" y="226">AutoObject</text>
  <text class="small" x="78" y="250">base runtime class</text>
  <text class="small" x="78" y="272">id, source, disabled type</text>
  <text class="mono" x="78" y="294">scale = Vector3.ONE</text>

  <rect class="node asset" x="58" y="340" width="284" height="118" rx="16" ry="16"/>
  <text class="label" x="78" y="372">AutoVoxelDescriptor</text>
  <text class="small" x="78" y="396">color + complexity</text>
  <text class="small" x="78" y="418">bands, collision, pivots</text>
  <text class="tiny" x="78" y="438">descriptor is preferred default source</text>

  <rect class="node support" x="58" y="486" width="284" height="86" rx="16" ry="16"/>
  <text class="label" x="78" y="518">Typed Assets</text>
  <text class="small" x="78" y="542">AutoRock / AutoVegetation</text>
  <text class="tiny" x="78" y="560">use class, descriptor, probes, footprint</text>

  <rect class="node route" x="424" y="194" width="284" height="100" rx="16" ry="16"/>
  <text class="label" x="444" y="226">semantic_probes</text>
  <text class="small" x="444" y="250">asset-local sample offsets</text>
  <text class="small" x="444" y="272">expected target signals</text>

  <rect class="node route" x="424" y="322" width="284" height="112" rx="16" ry="16"/>
  <text class="label" x="444" y="354">Probe Prefilter</text>
  <text class="small" x="444" y="378">collect anchors from SV / TargetSV</text>
  <text class="small" x="444" y="400">score probes per candidate asset</text>
  <text class="mono" x="444" y="420">anchor_autoobject_topk</text>

  <rect class="node route" x="424" y="462" width="284" height="94" rx="16" ry="16"/>
  <text class="label" x="444" y="494">Tile Routing</text>
  <text class="small" x="444" y="518">candidate-only rerank / prune</text>
  <text class="mono" x="444" y="540">candidate_tiles_by_asset</text>

  <rect class="node place" x="790" y="194" width="284" height="100" rx="16" ry="16"/>
  <text class="label" x="810" y="226">Footprint Bake</text>
  <text class="small" x="810" y="250">collision_voxels -> footprint</text>
  <text class="small" x="810" y="272">support / clearance flags</text>

  <rect class="node place" x="790" y="322" width="284" height="118" rx="16" ry="16"/>
  <text class="label" x="810" y="354">GPU Placement</text>
  <text class="small" x="810" y="378">score / reduce / stamp passes</text>
  <text class="small" x="810" y="400">support, collision, overlap</text>
  <text class="tiny" x="810" y="420">no full-library semantic lookup</text>

  <rect class="node place" x="790" y="468" width="284" height="86" rx="16" ry="16"/>
  <text class="label" x="810" y="500">Placement Result</text>
  <text class="small" x="810" y="524">accepted pose + score</text>
  <text class="tiny" x="810" y="542">CPU instantiates object node</text>

  <rect class="node record" x="1156" y="194" width="284" height="110" rx="16" ry="16"/>
  <text class="label" x="1176" y="226">voxel_record</text>
  <text class="small" x="1176" y="250">runtime placement record</text>
  <text class="small" x="1176" y="272">position, rotation, bands</text>
  <text class="tiny" x="1176" y="290">stores instance-specific state</text>

  <rect class="node record" x="1156" y="332" width="284" height="102" rx="16" ry="16"/>
  <text class="label" x="1176" y="364">Metadata</text>
  <text class="small" x="1176" y="388">auto_id, instance_id</text>
  <text class="small" x="1176" y="410">voxel_record handle</text>
  <text class="tiny" x="1176" y="426">index and debug projection only</text>

  <rect class="node warn" x="1156" y="462" width="284" height="94" rx="16" ry="16"/>
  <text class="label" x="1176" y="494">Do Not Mirror Defaults</text>
  <text class="small" x="1176" y="518">metadata is not a second config</text>
  <text class="tiny" x="1176" y="536">defaults live on AutoObject / Resource</text>

  <path class="edge-green" d="M342 250 H386 V244 H424"/>
  <path class="edge-green" d="M342 398 H386 V244 H424"/>
  <path class="edge-blue" d="M566 294 V322"/>
  <path class="edge-blue" d="M566 434 V462"/>
  <path class="edge-green" d="M708 509 H748 V244 H790"/>
  <path class="edge" d="M932 294 V322"/>
  <path class="edge" d="M932 440 V468"/>
  <path class="edge" d="M1074 511 H1116 V248 H1156"/>
  <path class="edge" d="M1298 304 V332"/>
  <path class="edge-red" d="M1298 434 V462"/>

  <rect class="node state" x="58" y="704" width="248" height="98" rx="16" ry="16"/>
  <text class="label" x="78" y="736">Source Deltas</text>
  <text class="small" x="78" y="760">AutoSceneVoxelDelta</text>
  <text class="small" x="78" y="782">BrushSceneVoxelDelta</text>

  <rect class="node state" x="338" y="704" width="248" height="98" rx="16" ry="16"/>
  <text class="label" x="358" y="736">blend_scene_voxels()</text>
  <text class="small" x="358" y="760">merge source intent</text>
  <text class="small" x="358" y="782">commit final state</text>

  <rect class="node state" x="618" y="704" width="248" height="98" rx="16" ry="16"/>
  <text class="label" x="638" y="736">SceneVoxel</text>
  <text class="small" x="638" y="760">committed read model</text>
  <text class="small" x="638" y="782">visual + collision state</text>

  <rect class="node query" x="898" y="704" width="248" height="98" rx="16" ry="16"/>
  <text class="label" x="918" y="736">GlobalVoxelField</text>
  <text class="small" x="918" y="760">sparse tile cache</text>
  <text class="small" x="918" y="782">dirty tile tracking</text>

  <rect class="node query" x="1178" y="704" width="248" height="98" rx="16" ry="16"/>
  <text class="label" x="1198" y="736">AutoObjectManager</text>
  <text class="small" x="1198" y="760">id / instance records</text>
  <text class="small" x="1198" y="782">XZ spatial query index</text>

  <path class="edge" d="M932 554 C932 622 188 622 188 704"/>
  <path class="edge" d="M306 753 H338"/>
  <path class="edge" d="M586 753 H618"/>
  <path class="edge" d="M866 753 H898"/>
  <path class="edge" d="M1146 753 H1178"/>
  <path class="edge-soft" d="M1022 704 C1022 626 710 632 618 556"/>
  <path class="edge-soft" d="M1302 704 C1302 644 1074 632 1010 556"/>
</svg>
