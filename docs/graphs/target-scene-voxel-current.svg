<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">TargetSceneVoxel Current Pipeline and Candidate Routing</title>
  <desc id="desc">Diagram of the current GPU TargetSceneVoxel generation path, optional offline VDB resampling path, persistence, debug preview, and candidate voxel-region routing into placement.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101f"/>
      <stop offset="0.55" stop-color="#0b1728"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gpu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="vdb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="target" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.52" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#65a30d"/>
    </linearGradient>
    <linearGradient id="preview" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="0.48" stop-color="#84cc16"/>
      <stop offset="1" stop-color="#a3a3a3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8dd3ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#86efac"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c4b5fd"/>
    </marker>
    <style>
      .title { font: 700 34px "Segoe UI", Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 16px "Segoe UI", Arial, sans-serif; fill: #a5b4fc; }
      .section { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #f8fafc; }
      .label { font: 600 15px "Segoe UI", Arial, sans-serif; fill: #e5e7eb; }
      .small { font: 500 13px "Segoe UI", Arial, sans-serif; fill: #cbd5e1; }
      .tiny { font: 500 12px "Segoe UI", Arial, sans-serif; fill: #94a3b8; }
      .mono { font: 600 12px Consolas, "Cascadia Mono", monospace; fill: #dbeafe; }
      .card { fill: #0f172a; stroke: #334155; stroke-width: 1.4; rx: 18; filter: url(#shadow); }
      .soft { fill: #111c31; stroke: #475569; stroke-width: 1.2; rx: 14; }
      .gpu-card { fill: url(#gpu); stroke: #67e8f9; stroke-width: 1.5; rx: 22; filter: url(#shadow); }
      .vdb-card { fill: url(#vdb); stroke: #ddd6fe; stroke-width: 1.5; rx: 22; filter: url(#shadow); }
      .target-card { fill: #101827; stroke: #86efac; stroke-width: 1.5; rx: 20; filter: url(#shadow); }
      .persist-card { fill: #111827; stroke: #fbbf24; stroke-width: 1.4; rx: 18; filter: url(#shadow); }
      .route-card { fill: url(#route); stroke: #bbf7d0; stroke-width: 1.4; rx: 18; filter: url(#shadow); }
      .debug-card { fill: #111827; stroke: #c084fc; stroke-width: 1.4; rx: 18; filter: url(#shadow); }
      .arrow { fill: none; stroke: #8dd3ff; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-green { fill: none; stroke: #86efac; stroke-width: 3; marker-end: url(#arrowGreen); }
      .arrow-purple { fill: none; stroke: #c4b5fd; stroke-width: 3; marker-end: url(#arrowPurple); }
      .dash { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; }
      .dash-purple { fill: none; stroke: #a78bfa; stroke-width: 2.2; stroke-dasharray: 8 7; marker-end: url(#arrowPurple); }
      .note { fill: #16213a; stroke: #334155; stroke-width: 1; rx: 12; }
      .warn { fill: #2b2038; stroke: #a78bfa; stroke-width: 1; rx: 12; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <circle cx="1370" cy="86" r="210" fill="#1e40af" opacity="0.13"/>
  <circle cx="220" cy="850" r="250" fill="#047857" opacity="0.12"/>
  <circle cx="860" cy="150" r="150" fill="#7c3aed" opacity="0.09"/>

  <text x="58" y="58" class="title">TargetSceneVoxel 当前实现 + 导入 / 路由设计</text>
  <text x="58" y="88" class="subtitle">当前 GPU 路径生成中性目标体素；外部 VDB 离线重采样；上游筛选后输出候选 voxel 区域给 placement。</text>

  <rect x="48" y="126" width="268" height="466" class="card"/>
  <text x="76" y="164" class="section">当前 GPU 输入</text>
  <text x="76" y="190" class="tiny">来自 main.gd 场景状态</text>

  <rect x="76" y="222" width="212" height="76" class="soft"/>
  <text x="96" y="250" class="label">scene_depth</text>
  <text x="96" y="273" class="small">地形 / 当前表面高度</text>
  <text x="96" y="292" class="mono">sampler2D binding 0</text>

  <rect x="76" y="326" width="212" height="76" class="soft"/>
  <text x="96" y="354" class="label">target_height</text>
  <text x="96" y="377" class="small">合成后的目标高度</text>
  <text x="96" y="396" class="mono">sampler2D binding 1</text>

  <rect x="76" y="430" width="212" height="76" class="soft"/>
  <text x="96" y="458" class="label">rock_mask</text>
  <text x="96" y="481" class="small">岩石 / 刷子约束</text>
  <text x="96" y="500" class="mono">sampler2D binding 2</text>

  <rect x="76" y="526" width="212" height="44" class="note"/>
  <text x="96" y="554" class="small">当前：uniform slice_count = 8</text>

  <path d="M 316 260 C 350 260 360 282 390 302" class="arrow"/>
  <path d="M 316 364 C 354 364 360 374 390 374" class="arrow"/>
  <path d="M 316 468 C 350 468 360 444 390 438" class="arrow"/>

  <rect x="390" y="182" width="330" height="372" class="gpu-card"/>
  <text x="426" y="222" class="section">当前 GPU Compute</text>
  <text x="426" y="248" class="small">scripts/target_scene_voxel_generator.gd</text>
  <text x="426" y="270" class="mono">shaders/target_scene_voxel.glsl</text>

  <rect x="426" y="306" width="252" height="72" fill="#082f49" stroke="#7dd3fc" stroke-width="1.2" rx="14"/>
  <text x="448" y="335" class="label">每个 voxel 计算目标意图</text>
  <text x="448" y="360" class="small">height delta / slope / rock signal</text>

  <rect x="426" y="408" width="252" height="92" fill="#052e2b" stroke="#99f6e4" stroke-width="1.2" rx="14"/>
  <text x="448" y="437" class="label">只写中性 TargetSV 字段</text>
  <text x="448" y="462" class="small">color.rgb + value / complexity</text>
  <text x="448" y="484" class="small">collision 使用 peak / max</text>

  <rect x="462" y="586" width="320" height="236" class="vdb-card"/>
  <text x="498" y="626" class="section">外部 VDB 离线导入</text>
  <text x="498" y="652" class="small">Houdini / DCC 高分辨率 VDB</text>
  <text x="498" y="674" class="mono">tools/vdb_to_target_sv.py</text>

  <rect x="498" y="708" width="248" height="78" fill="#2e1065" stroke="#ddd6fe" stroke-width="1.2" rx="14"/>
  <text x="520" y="736" class="label">重采样到 TargetSV 网格</text>
  <text x="520" y="760" class="small">box / supersampling 下采样</text>
  <text x="520" y="780" class="small">collision = max / percentile</text>

  <path d="M 720 370 C 764 370 780 370 814 370" class="arrow-green"/>
  <path d="M 782 696 C 820 660 835 600 850 548" class="arrow-purple"/>

  <rect x="814" y="138" width="344" height="478" class="target-card"/>
  <text x="852" y="178" class="section">3D TargetSV Buffer</text>
  <text x="852" y="206" class="small">visual.rgba32f + collision.r32f</text>
  <text x="852" y="229" class="tiny">中性目标画布：颜色、复杂度、碰撞意图</text>

  <g transform="translate(866 266)">
    <polygon points="0,124 118,62 236,124 118,186" fill="url(#target)" opacity="0.86" stroke="#bbf7d0" stroke-width="1.4"/>
    <polygon points="0,154 118,92 236,154 118,216" fill="url(#target)" opacity="0.64" stroke="#bbf7d0" stroke-width="1.2"/>
    <polygon points="0,194 118,132 236,194 118,256" fill="url(#target)" opacity="0.42" stroke="#bbf7d0" stroke-width="1.1"/>
    <polygon points="0,244 118,182 236,244 118,306" fill="url(#target)" opacity="0.26" stroke="#bbf7d0" stroke-width="1"/>
    <line x1="0" y1="124" x2="0" y2="244" stroke="#86efac" stroke-width="1.2" opacity="0.8"/>
    <line x1="118" y1="186" x2="118" y2="306" stroke="#86efac" stroke-width="1.2" opacity="0.8"/>
    <line x1="236" y1="124" x2="236" y2="244" stroke="#86efac" stroke-width="1.2" opacity="0.8"/>
    <circle cx="76" cy="172" r="9" fill="#22c55e"/>
    <circle cx="130" cy="136" r="11" fill="#a3a3a3"/>
    <circle cx="172" cy="206" r="8" fill="#f59e0b"/>
  </g>

  <rect x="850" y="518" width="272" height="64" fill="#052e16" stroke="#86efac" stroke-width="1.2" rx="14"/>
  <text x="872" y="546" class="mono">vec4(color.rgb, value)</text>
  <text x="872" y="568" class="mono">float collision_peak</text>

  <rect x="850" y="86" width="272" height="34" class="warn"/>
  <text x="874" y="108" class="tiny">规划：progressive y_edges；旧 metadata 回退 uniform Y</text>

  <path d="M 986 616 C 986 652 986 672 986 704" class="arrow"/>
  <path d="M 1108 604 C 1164 658 1192 678 1230 704" class="arrow"/>
  <path d="M 1158 390 C 1202 390 1218 390 1252 390" class="arrow-green"/>

  <rect x="822" y="704" width="328" height="166" class="persist-card"/>
  <text x="856" y="742" class="section">持久化 TargetSV</text>
  <text x="856" y="772" class="mono">target_scene_voxel_visual.rgba32f</text>
  <text x="856" y="796" class="mono">target_scene_voxel_collision.r32f</text>
  <text x="856" y="820" class="mono">target_scene_voxel_preview.png</text>
  <text x="856" y="844" class="mono">target_scene_voxel.json</text>
  <text x="856" y="864" class="tiny">metadata: dims, generation_mode, y_edges</text>

  <rect x="1190" y="704" width="230" height="166" class="debug-card"/>
  <text x="1224" y="742" class="section">Preview / Debug</text>
  <rect x="1226" y="772" width="82" height="48" fill="url(#preview)" stroke="#e9d5ff" stroke-width="1.2" rx="8"/>
  <text x="1322" y="792" class="mono">preview.png</text>
  <text x="1322" y="816" class="tiny">column projection</text>
  <text x="1224" y="850" class="small">J 显示 / 隐藏</text>

  <rect x="1252" y="196" width="292" height="348" class="route-card"/>
  <text x="1286" y="236" class="section">上游候选筛选 / 路由</text>
  <text x="1286" y="262" class="small">AutoObject probes + anchors</text>
  <text x="1286" y="284" class="tiny">不从全资产库重新选最优 asset</text>

  <rect x="1288" y="318" width="220" height="74" fill="#052e16" stroke="#bbf7d0" stroke-width="1.2" rx="14"/>
  <text x="1310" y="346" class="label">anchor_autoobject_topk</text>
  <text x="1310" y="370" class="small">ground / target_top anchors</text>

  <rect x="1288" y="420" width="220" height="80" fill="#064e3b" stroke="#bbf7d0" stroke-width="1.2" rx="14"/>
  <text x="1310" y="448" class="label">candidate_voxel_sparses</text>
  <text x="1310" y="472" class="small">route + dedupe + EMPTY prune</text>
  <text x="1310" y="492" class="small">只 dispatch 命中 voxel 区域</text>

  <path d="M 1398 544 C 1398 594 1398 624 1398 654" class="arrow-green"/>

  <rect x="1252" y="654" width="292" height="116" class="card"/>
  <text x="1286" y="692" class="section">VoxelPlacementGenerator</text>
  <text x="1286" y="722" class="mono">run_multi_asset()</text>
  <text x="1286" y="746" class="small">score_voxel_tile.glsl 只做物理精筛</text>

  <rect x="58" y="856" width="690" height="76" fill="#111827" stroke="#475569" stroke-width="1.2" rx="18"/>
  <text x="90" y="888" class="section">Godot 调试输入</text>
  <text x="90" y="916" class="small">J：读取已持久化 preview 并显示 / 隐藏 DebugTargetSceneVoxel；Ctrl+J：全量 GPU 重新计算并保存。</text>

  <rect x="58" y="628" width="342" height="166" fill="#172033" stroke="#475569" stroke-width="1.1" rx="16"/>
  <text x="88" y="664" class="section">TargetSV 约束</text>
  <text x="88" y="696" class="small">不写 asset_id / asset_type</text>
  <text x="88" y="720" class="small">不写 tree / rock / grass 标签</text>
  <text x="88" y="744" class="small">color / complexity 可平均混合</text>
  <text x="88" y="768" class="small">collision 使用 max 保留强 solid</text>

  <path d="M 400 706 C 426 706 438 706 462 706" class="dash-purple"/>
  <path d="M 748 894 C 792 858 804 832 822 814" class="arrow"/>
  <path d="M 1150 790 C 1168 790 1176 790 1190 790" class="arrow"/>

  <rect x="1168" y="58" width="372" height="78" fill="#172033" stroke="#475569" stroke-width="1.1" rx="16"/>
  <text x="1198" y="90" class="label">当前 / 规划边界</text>
  <text x="1198" y="114" class="tiny">GPU uniform slice 已实现；VDB 导入与非均匀 Y 是离线/下一步接入设计。</text>
</svg>
