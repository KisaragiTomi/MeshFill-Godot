<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">MeshFill Current Framework</title>
  <desc id="desc">Current MeshFill-Godot framework: TargetSceneVoxel target canvas, AutoObject semantic probes, sparse candidate voxel-region indices, physical placement sampling committed SceneVoxel occupancy views, SceneVoxel base fields, same-level collision_voxels, derived collision_occupancy, and GlobalVoxelField addressable cache.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .title { fill: #0f172a; font: 700 34px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; }
      .subtitle { fill: #475569; font: 15px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; }
      .band-title { fill: #334155; font: 700 14px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; letter-spacing: .05em; }
      .label { fill: #0f172a; font: 700 17px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; }
      .small { fill: #334155; font: 13px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; }
      .tiny { fill: #475569; font: 12px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; }
      .mono { fill: #1e3a8a; font: 700 12px Consolas, "Cascadia Mono", monospace; }
      .pill-text { fill: #0f172a; font: 700 13px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; }
      .band { fill: #ffffff; stroke: #dbe3ef; stroke-width: 1.2; filter: url(#shadow); }
      .target-band { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.4; }
      .asset-band { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.4; }
      .route-band { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.4; }
      .place-band { fill: #fff7ed; stroke: #f97316; stroke-width: 1.4; }
      .state-band { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; }
      .node { stroke-width: 1.6; filter: url(#shadow); }
      .target { fill: #dbeafe; stroke: #2563eb; }
      .asset { fill: #dcfce7; stroke: #16a34a; }
      .route { fill: #ede9fe; stroke: #7c3aed; }
      .hardgate { fill: #fee2e2; stroke: #ef4444; }
      .placement { fill: #ffedd5; stroke: #f97316; }
      .state { fill: #e0f2fe; stroke: #0284c7; }
      .cache { fill: #ccfbf1; stroke: #0f766e; }
      .record { fill: #fef3c7; stroke: #d97706; }
      .support { fill: #f1f5f9; stroke: #64748b; }
      .tick { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; }
      .edge { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .edge-blue { stroke: #2563eb; stroke-width: 2.4; fill: none; marker-end: url(#arrow-blue); }
      .edge-green { stroke: #059669; stroke-width: 2.4; fill: none; marker-end: url(#arrow-green); }
      .edge-soft { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow-soft); stroke-dasharray: 7 7; }
      .edge-loop { stroke: #7c3aed; stroke-width: 2.3; fill: none; marker-end: url(#arrow); stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1200"/>
  <path class="grid" d="M0 120H1600M0 300H1600M0 480H1600M0 660H1600M0 840H1600M0 1020H1600M0 1160H1600"/>
  <path class="grid" d="M320 120V1160M640 120V1160M960 120V1160M1280 120V1160"/>

  <text class="title" x="48" y="58">MeshFill Current Framework</text>
  <text class="subtitle" x="48" y="88">TargetSV is a neutral target canvas; routing outputs sparse candidate voxel-region indices; GPU scoring samples committed SceneVoxel views by coordinate.</text>

  <rect class="band target-band" x="32" y="124" width="326" height="548" rx="20" ry="20"/>
  <rect class="band asset-band" x="388" y="124" width="326" height="548" rx="20" ry="20"/>
  <rect class="band route-band" x="744" y="124" width="386" height="548" rx="20" ry="20"/>
  <rect class="band place-band" x="1160" y="124" width="408" height="548" rx="20" ry="20"/>
  <rect class="band state-band" x="32" y="714" width="1536" height="332" rx="20" ry="20"/>

  <text class="band-title" x="56" y="156">TARGET INTENT</text>
  <text class="band-title" x="412" y="156">ASSET DEFAULTS</text>
  <text class="band-title" x="768" y="156">CANDIDATE ROUTING</text>
  <text class="band-title" x="1184" y="156">PHYSICAL PLACEMENT</text>
  <text class="band-title" x="56" y="746">COMMITTED SCENEVOXEL STATE / DIRTY CACHE</text>

  <rect class="node target" x="58" y="184" width="274" height="112" rx="16" ry="16"/>
  <text class="label" x="78" y="216">TargetSceneVoxel</text>
  <text class="small" x="78" y="240">neutral visual target canvas</text>
  <text class="small" x="78" y="262">color + complexity + collision</text>
  <text class="tiny" x="78" y="282">no tree / rock / grass asset labels</text>

  <rect class="node target" x="58" y="324" width="274" height="104" rx="16" ry="16"/>
  <text class="label" x="78" y="356">TargetSV Generation</text>
  <text class="small" x="78" y="380">GPU height / slope / mask path</text>
  <text class="small" x="78" y="402">optional VDB resample import</text>
  <text class="tiny" x="78" y="420">supports dirty target updates</text>

  <rect class="node support" x="58" y="456" width="274" height="128" rx="16" ry="16"/>
  <text class="label" x="78" y="488">Sampling Boundary Rule</text>
  <text class="small" x="78" y="512">probe / context samples clamp</text>
  <text class="small" x="78" y="534">to nearest valid TargetSV voxel</text>
  <text class="mono" x="78" y="558">sample_pos = clamp(...)</text>
  <text class="tiny" x="78" y="576">not empty, not auto failure</text>

  <rect class="node asset" x="414" y="184" width="274" height="118" rx="16" ry="16"/>
  <text class="label" x="434" y="216">AutoObject + Descriptor</text>
  <text class="small" x="434" y="240">default color / complexity</text>
  <text class="small" x="434" y="262">collision_voxels, pivots</text>
  <text class="tiny" x="434" y="284">profile is optional fallback only</text>

  <rect class="node asset" x="414" y="330" width="274" height="112" rx="16" ry="16"/>
  <text class="label" x="434" y="362">semantic_probes</text>
  <text class="small" x="434" y="386">asset-local sample offsets</text>
  <text class="small" x="434" y="408">expected color / value / empty</text>
  <text class="tiny" x="434" y="426">used by prefilter and rerank</text>

  <rect class="node asset" x="414" y="470" width="274" height="112" rx="16" ry="16"/>
  <text class="label" x="434" y="502">Placement Footprint</text>
  <text class="small" x="434" y="526">support / collision / clearance</text>
  <text class="small" x="434" y="548">asset target preference optional</text>
  <text class="tiny" x="434" y="566">physical validity stays in score pass</text>

  <rect class="node route" x="770" y="178" width="334" height="90" rx="16" ry="16"/>
  <text class="label" x="790" y="210">Upstream Probe Prefilter</text>
  <text class="small" x="790" y="234">SV anchors + TargetSV + probes</text>
  <text class="tiny" x="790" y="252">filtered candidate assets per anchor</text>

  <rect class="node hardgate" x="770" y="296" width="334" height="92" rx="16" ry="16"/>
  <text class="label" x="790" y="328">anchor_autoobject_topk</text>
  <text class="small" x="790" y="352">hard gate for semantic matching</text>
  <text class="tiny" x="790" y="370">no full asset library search</text>

  <rect class="node route" x="770" y="416" width="334" height="104" rx="16" ry="16"/>
  <text class="label" x="790" y="448">Candidate-only Rerank</text>
  <text class="small" x="790" y="472">semantic_score / target_score</text>
  <text class="small" x="790" y="494">route_score / EMPTY pruning</text>
  <text class="tiny" x="790" y="512">rerank, validate, prune only</text>

  <rect class="node route" x="770" y="548" width="334" height="82" rx="16" ry="16"/>
  <text class="label" x="790" y="576">candidate_voxel_regions</text>
  <text class="label" x="790" y="598">_by_asset</text>
  <text class="small" x="790" y="618">asset_index -> sparse voxel-region ids</text>

  <rect class="node placement" x="1186" y="184" width="354" height="104" rx="16" ry="16"/>
  <text class="label" x="1206" y="216">VoxelPlacementGenerator</text>
  <text class="small" x="1206" y="240">run_multi_asset(common_settings)</text>
  <text class="mono" x="1206" y="264">reads sparse candidate region list</text>

  <rect class="node placement" x="1186" y="316" width="354" height="132" rx="16" ry="16"/>
  <text class="label" x="1206" y="348">GPU Score / Reduce / Stamp</text>
  <text class="small" x="1206" y="372">score_voxel_tile.glsl</text>
  <text class="small" x="1206" y="394">sample SceneVoxel views by coord</text>
  <text class="small" x="1206" y="416">support / collision / clearance</text>
  <text class="tiny" x="1206" y="436">candidate list is not the sample field</text>

  <rect class="node placement" x="1186" y="476" width="354" height="112" rx="16" ry="16"/>
  <text class="label" x="1206" y="508">Placement Results</text>
  <text class="small" x="1206" y="532">accepted asset / voxel-region placements</text>
  <text class="small" x="1206" y="554">stamp source voxel deltas</text>
  <text class="tiny" x="1206" y="572">CPU instantiates after GPU decision</text>

  <path class="edge-blue" d="M332 240 H360 V170 H744 V210 H770"/>
  <text class="tiny" x="508" y="162">TargetSV samples</text>
  <path class="edge-blue" d="M332 520 C380 604 700 604 744 604 L744 468 L770 468"/>
  <text class="tiny" x="468" y="616">clamped TargetSV samples</text>
  <path class="edge-green" d="M688 386 C728 386 730 242 770 242"/>
  <text class="tiny" x="704" y="274">semantic probes</text>
  <path class="edge-green" d="M688 526 L724 526 L724 166 L1170 166 L1170 382 L1186 382"/>
  <text class="tiny" x="910" y="158">footprint buffers</text>
  <path class="edge" d="M937 268 V296"/>
  <path class="edge" d="M937 388 V416"/>
  <path class="edge" d="M937 520 V548"/>
  <path class="edge-green" d="M1104 589 L1132 589 L1132 252 L1186 252"/>
  <text class="tiny" x="1138" y="578">sparse routed regions only</text>
  <path class="edge" d="M1363 288 V316"/>
  <path class="edge" d="M1363 448 V476"/>

  <rect class="node record" x="58" y="778" width="244" height="106" rx="16" ry="16"/>
  <text class="label" x="78" y="810">Record Builders</text>
  <text class="small" x="78" y="834">make_*_scene_voxel_record()</text>
  <text class="small" x="78" y="856">voxel_record runtime data</text>
  <text class="tiny" x="78" y="874">position, ids, bands, collision</text>

  <rect class="node state" x="338" y="766" width="244" height="140" rx="16" ry="16"/>
  <text class="label" x="358" y="798">SourceSceneVoxelDelta</text>
  <text class="small" x="358" y="822">inherits SceneVoxel fields</text>
  <text class="small" x="358" y="844">source_voxel_type / kind</text>
  <text class="tiny" x="358" y="864">producer_stage / read-write ticks</text>
  <text class="tiny" x="358" y="884">collision_voxels same-level field</text>

  <rect class="node state" x="618" y="778" width="244" height="106" rx="16" ry="16"/>
  <text class="label" x="638" y="810">blend_scene_voxels()</text>
  <text class="small" x="638" y="834">merge target / auto / brush</text>
  <text class="small" x="638" y="856">commit final voxel meaning</text>
  <text class="tiny" x="638" y="874">next systems read committed state</text>

  <rect class="node state" x="898" y="738" width="320" height="206" rx="16" ry="16"/>
  <text class="label" x="918" y="770">SceneVoxel</text>
  <text class="small" x="918" y="794">committed read model</text>
  <text class="small" x="918" y="816">base: type / occupied / value</text>
  <text class="tiny" x="918" y="838">color / complexity / band / channel</text>
  <text class="tiny" x="918" y="858">coords: slice_index / voxel_xz / base_pixel</text>
  <text class="tiny" x="918" y="878">ids: record_id / auto_id / instance_id</text>
  <text class="tiny" x="918" y="898">commit: source_voxel_types / blend_mode</text>
  <text class="tiny" x="918" y="918">collision_voxels + commit_tick</text>

  <rect class="node cache" x="1248" y="778" width="292" height="106" rx="16" ry="16"/>
  <text class="label" x="1268" y="810">GlobalVoxelField</text>
  <text class="small" x="1268" y="834">scene + derived collision views</text>
  <text class="small" x="1268" y="856">dirty voxel-region / rect tracking</text>
  <text class="tiny" x="1268" y="874">collision_occupancy is cache only</text>

  <rect class="node support" x="58" y="964" width="244" height="54" rx="16" ry="16"/>
  <text class="label" x="78" y="994">Metadata / Manager</text>
  <text class="tiny" x="78" y="1012">index handle only, not default source</text>

  <rect class="node support" x="338" y="964" width="244" height="54" rx="16" ry="16"/>
  <text class="label" x="358" y="994">Legacy Producers</text>
  <text class="tiny" x="358" y="1012">fitting / scatter / brush write deltas</text>

  <rect class="node support" x="618" y="964" width="244" height="54" rx="16" ry="16"/>
  <text class="label" x="638" y="994">Validation / Debug</text>
  <text class="tiny" x="638" y="1012">query_voxel(), preview, inspect tools</text>

  <rect class="node hardgate" x="898" y="964" width="244" height="54" rx="16" ry="16"/>
  <text class="label" x="918" y="994">Forbidden Path</text>
  <text class="tiny" x="918" y="1012">no full-library semantic lookup</text>

  <rect class="node support" x="1248" y="964" width="292" height="54" rx="16" ry="16"/>
  <text class="label" x="1268" y="994">Dirty Update Loop</text>
  <text class="tiny" x="1268" y="1012">affected anchors / voxel regions only</text>

  <path class="edge" d="M1363 588 C1363 690 318 690 318 836 H302"/>
  <text class="tiny" x="972" y="684">accepted placements build records</text>
  <path class="edge" d="M302 836 H338"/>
  <path class="edge" d="M582 836 H618"/>
  <path class="edge" d="M862 836 H898"/>
  <path class="edge" d="M1218 836 H1248"/>
  <path class="edge-soft" d="M1020 944 V964"/>
  <path class="edge-soft" d="M740 884 V964"/>
  <path class="edge-soft" d="M460 964 V906"/>
  <path class="edge-loop" d="M1394 778 C1394 704 1164 704 1010 674 C884 648 810 646 770 630"/>
  <text class="tiny" x="1010" y="662">dirty anchors -> reroute affected assets</text>

  <rect class="tick" x="120" y="1060" width="1360" height="70" rx="18" ry="18"/>
  <text class="pill-text" x="150" y="1102">generation_tick:</text>
  <text class="small" x="286" y="1102">read SceneVoxel[t - 1]</text>
  <path class="edge-soft" d="M474 1096 H594"/>
  <text class="small" x="622" y="1102">route candidate voxel regions</text>
  <path class="edge-soft" d="M790 1096 H910"/>
  <text class="small" x="938" y="1102">GPU physical placement</text>
  <path class="edge-soft" d="M1112 1096 H1232"/>
  <text class="small" x="1260" y="1102">commit SceneVoxel[t]</text>

  <rect class="tick" x="58" y="626" width="274" height="28" rx="14" ry="14"/>
  <text class="tiny" x="78" y="645">Rule: TargetSV answers desired appearance</text>
  <rect class="tick" x="414" y="626" width="274" height="28" rx="14" ry="14"/>
  <text class="tiny" x="434" y="645">Rule: assets answer what they are</text>
  <rect class="tick" x="770" y="642" width="334" height="28" rx="14" ry="14"/>
  <text class="tiny" x="790" y="661">Rule: routing outputs sparse candidate region indices</text>
  <rect class="tick" x="1186" y="626" width="354" height="28" rx="14" ry="14"/>
  <text class="tiny" x="1206" y="645">Rule: physical scoring decides if it can be placed</text>
</svg>
