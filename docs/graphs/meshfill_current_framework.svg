<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1120" viewBox="0 0 1700 1120" role="img" aria-labelledby="title desc">
  <title id="title">MeshFill Current Framework</title>
  <desc id="desc">Current MeshFill runtime framework generated from meshfill-framework.md.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#ea580c"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <pattern id="autoobject-dot-bg" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#cffafe"/>
      <circle cx="3" cy="3" r="1.25" fill="#0891b2" opacity="0.256281"/>
      <circle cx="9" cy="9" r="1.25" fill="#0891b2" opacity="0.256281"/>
    </pattern>
    <pattern id="descriptor-grid" patternUnits="userSpaceOnUse" width="9.3334" height="9.3334">
      <rect width="9.3334" height="9.3334" fill="#dcfce7"/>
      <path d="M4.6667 0H0V4.6667" stroke="#16a34a" stroke-width="0.3333" opacity="0.257576"/>
      <path d="M0 4.6667L4.6667 0" stroke="#16a34a" stroke-width="0.3333" opacity="0.257576"/>
    </pattern>
    <pattern id="sv-stripe-blue" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#dbeafe"/>
      <rect y="1" width="10" height="2" fill="#0284c7" opacity="0.235023"/>
      <rect y="6" width="10" height="1.5" fill="#0284c7" opacity="0.235023"/>
    </pattern>
    <pattern id="sv-stripe-amber" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#fef3c7"/>
      <rect y="1" width="10" height="2" fill="#d97706" opacity="0.264249"/>
      <rect y="6" width="10" height="1.5" fill="#d97706" opacity="0.264249"/>
    </pattern>
    <pattern id="note-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#f1f5f9"/>
      <rect x="0" y="0" width="10" height="2" fill="#64748b" opacity="0.361702"/>
    </pattern>
  </defs>
  <style>
    :root { color-scheme: light; }
    .bg { fill: #f8fafc; }
    .grid { stroke: #e2e8f0; stroke-width: 1; opacity: 0.7; }
    .title { fill: #0f172a; font: 700 34px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .subtitle { fill: #475569; font: 500 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .lane-title { fill: #334155; font: 700 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .node-title { fill: #0f172a; font: 700 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .small { fill: #475569; font: 500 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .mono { fill: #334155; font: 600 11px Consolas, "Cascadia Mono", monospace; letter-spacing: 0; }
    .note-text { fill: #0f172a; font: 600 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .lane { fill: #ffffff; stroke: #dbe3ef; stroke-width: 1.2; filter: url(#shadow); }
    .node { stroke-width: 1.5; filter: url(#shadow); }
    .edge { stroke: #334155; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
    .edge-blue { stroke: #2563eb; stroke-width: 2.2; fill: none; marker-end: url(#arrow-blue); }
    .edge-green { stroke: #059669; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
    .edge-orange { stroke: #ea580c; stroke-width: 2.2; fill: none; marker-end: url(#arrow-orange); }
    .edge-dash { stroke: #64748b; stroke-width: 1.9; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    .edge-warn { stroke: #dc2626; stroke-width: 2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
  </style>

  <rect class="bg" x="0" y="0" width="1700" height="1120"/>
  <g opacity="0.65"><line class="grid" x1="40" y1="86" x2="40" y2="1084"/><line class="grid" x1="120" y1="86" x2="120" y2="1084"/><line class="grid" x1="200" y1="86" x2="200" y2="1084"/><line class="grid" x1="280" y1="86" x2="280" y2="1084"/><line class="grid" x1="360" y1="86" x2="360" y2="1084"/><line class="grid" x1="440" y1="86" x2="440" y2="1084"/><line class="grid" x1="520" y1="86" x2="520" y2="1084"/><line class="grid" x1="600" y1="86" x2="600" y2="1084"/><line class="grid" x1="680" y1="86" x2="680" y2="1084"/><line class="grid" x1="760" y1="86" x2="760" y2="1084"/><line class="grid" x1="840" y1="86" x2="840" y2="1084"/><line class="grid" x1="920" y1="86" x2="920" y2="1084"/><line class="grid" x1="1000" y1="86" x2="1000" y2="1084"/><line class="grid" x1="1080" y1="86" x2="1080" y2="1084"/><line class="grid" x1="1160" y1="86" x2="1160" y2="1084"/><line class="grid" x1="1240" y1="86" x2="1240" y2="1084"/><line class="grid" x1="1320" y1="86" x2="1320" y2="1084"/><line class="grid" x1="1400" y1="86" x2="1400" y2="1084"/><line class="grid" x1="1480" y1="86" x2="1480" y2="1084"/><line class="grid" x1="1560" y1="86" x2="1560" y2="1084"/><line class="grid" x1="1640" y1="86" x2="1640" y2="1084"/><line class="grid" x1="30" y1="120" x2="1670" y2="120"/><line class="grid" x1="30" y1="200" x2="1670" y2="200"/><line class="grid" x1="30" y1="280" x2="1670" y2="280"/><line class="grid" x1="30" y1="360" x2="1670" y2="360"/><line class="grid" x1="30" y1="440" x2="1670" y2="440"/><line class="grid" x1="30" y1="520" x2="1670" y2="520"/><line class="grid" x1="30" y1="600" x2="1670" y2="600"/><line class="grid" x1="30" y1="680" x2="1670" y2="680"/><line class="grid" x1="30" y1="760" x2="1670" y2="760"/><line class="grid" x1="30" y1="840" x2="1670" y2="840"/><line class="grid" x1="30" y1="920" x2="1670" y2="920"/><line class="grid" x1="30" y1="1000" x2="1670" y2="1000"/><line class="grid" x1="30" y1="1080" x2="1670" y2="1080"/></g>
  <text class="title" x="48" y="54">MeshFill Current Framework</text>
  <text class="subtitle" x="48" y="82">One tick from target guidance and previous SV through routing, placement, commit, feedback, and resident state.</text>
  <g>
    <rect class="lane" x="45" y="115" width="360" height="830" rx="8"/>
    <text class="lane-title" x="63" y="141">TARGET / PREVIOUS STATE</text>
    <rect class="lane" x="445" y="115" width="360" height="830" rx="8"/>
    <text class="lane-title" x="463" y="141">ASSET SEMANTICS</text>
    <rect class="lane" x="845" y="115" width="360" height="830" rx="8"/>
    <text class="lane-title" x="863" y="141">ROUTING + PLACEMENT</text>
    <rect class="lane" x="1245" y="115" width="405" height="830" rx="8"/>
    <text class="lane-title" x="1263" y="141">COMMIT + NEXT STATE</text>
  </g>
  <g>
    <path class="edge-blue" d="M 365 212 L 885 205"/>
    <path class="edge-blue" d="M 365 562 L 885 375"/>
    <path class="edge-green" d="M 765 238 L 885 205"/>
    <path class="edge-green" d="M 765 425 L 885 375"/>
    <path class="edge" d="M 1025 260 L 1025 315"/>
    <path class="edge" d="M 1025 435 L 1025 500"/>
    <path class="edge-orange" d="M 1025 625 L 1025 695"/>
    <path class="edge-orange" d="M 1165 752 L 1285 218"/>
    <path class="edge" d="M 1442 275 L 1442 340"/>
    <path class="edge-blue" d="M 1442 460 L 1442 535"/>
    <path class="edge-blue" d="M 1442 650 L 1442 720"/>
    <path class="edge-dash" d="M 1285 780 L 85 235 L 85 155"/>
    <text class="mono" x="720" y="865">next tick</text>
    <path class="edge-blue" d="M 365 388 L 85 505"/>
    <text class="mono" x="170" y="470">compose</text>
  </g>
  <g>
    <g id="sv[t---1]-resident">
    <rect class="node" x="85" y="155" width="280" height="115" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
    <text class="node-title" x="103" y="183">SV[t - 1] resident</text>
    <text class="small"><tspan x="103" y="205">previous BlendSV result</tspan><tspan x="103" y="222">complexity_field + collision_field</tspan><tspan x="103" y="239">stable physical sampling input</tspan></text>
    </g>
    <g id="targetsv-+-brushsv">
    <rect class="node" x="85" y="330" width="280" height="115" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
    <text class="node-title" x="103" y="358">TargetSV + BrushSV</text>
    <text class="small"><tspan x="103" y="380">source target canvas</tspan><tspan x="103" y="397">brush delta / override</tspan><tspan x="103" y="414">compose into TargetSV_B</tspan></text>
    </g>
    <g id="targetsv_b-read-buffers">
    <rect class="node" x="85" y="505" width="280" height="115" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
    <text class="node-title" x="103" y="533">TargetSV_B read buffers</text>
    <text class="small"><tspan x="103" y="555">target_occupancy</tspan><tspan x="103" y="572">target_color RGBA8</tspan><tspan x="103" y="589">guidance only</tspan></text>
    </g>
    <g id="autoobject-registry">
    <rect class="node" x="485" y="180" width="280" height="115" rx="8" fill="url(#autoobject-dot-bg)" stroke="#0891b2"/>
    <text class="node-title" x="503" y="208">AutoObject registry</text>
    <text class="small"><tspan x="503" y="230">available runtime assets</tspan><tspan x="503" y="247">object_type for grouping</tspan><tspan x="503" y="264">dirty bounds -&gt; SceneVoxelTile</tspan></text>
    </g>
    <g id="descriptor-probe-buffers">
    <rect class="node" x="485" y="365" width="280" height="125" rx="8" fill="url(#descriptor-grid)" stroke="#16a34a"/>
    <text class="node-title" x="503" y="393">Descriptor probe buffers</text>
    <text class="small"><tspan x="503" y="415">semantic probes</tspan><tspan x="503" y="432">collision footprint</tspan><tspan x="503" y="449">context_sensing_radius</tspan><tspan x="503" y="466">descriptor-backed getters</tspan></text>
    </g>
    <g id="collect-anchors">
    <rect class="node" x="885" y="150" width="280" height="110" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text class="node-title" x="903" y="178">Collect anchors</text>
    <text class="small"><tspan x="903" y="200">dirty SceneVoxelTiles</tspan><tspan x="903" y="217">supported candidates</tspan><tspan x="903" y="234">column-top candidates</tspan></text>
    </g>
    <g id="probe-prefilter">
    <rect class="node" x="885" y="315" width="280" height="120" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text class="node-title" x="903" y="343">Probe prefilter</text>
    <text class="small"><tspan x="903" y="365">score descriptor probes</tspan><tspan x="903" y="382">select anchor top-K</tspan><tspan x="903" y="399">reduce voxel-region votes</tspan></text>
    </g>
    <g id="candidate-voxel-regions">
    <rect class="node" x="885" y="500" width="280" height="125" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text class="node-title" x="903" y="528">Candidate voxel regions</text>
    <text class="small"><tspan x="903" y="550">readback expansion</tspan><tspan x="903" y="567">candidate_voxel_regions_by_asset</tspan><tspan x="903" y="584">empty region =&gt; skip</tspan></text>
    </g>
    <g id="physical-placement">
    <rect class="node" x="885" y="695" width="280" height="115" rx="8" fill="#ffedd5" stroke="#ea580c"/>
    <text class="node-title" x="903" y="723">Physical placement</text>
    <text class="small"><tspan x="903" y="745">same-type exclusion</tspan><tspan x="903" y="762">score_voxel_tile.glsl</tspan><tspan x="903" y="779">reduce / stamp / instantiate</tspan></text>
    </g>
    <g id="source-write-streams">
    <rect class="node" x="1285" y="160" width="315" height="115" rx="8" fill="url(#sv-stripe-amber)" stroke="#d97706"/>
    <text class="node-title" x="1303" y="188">Source stamp / SVBrush</text>
    <text class="small"><tspan x="1303" y="210">rebuilt from dirty tiles</tspan><tspan x="1303" y="227">AutoSceneVoxel + Brush intent</tspan><tspan x="1303" y="244">not direct SV update</tspan></text>
    </g>
    <g id="blend_scene_voxels(tick)">
    <rect class="node" x="1285" y="340" width="315" height="120" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
    <text class="node-title" x="1303" y="368">blend_scene_voxels(tick)</text>
    <text class="small"><tspan x="1303" y="390">commit only after source changed</tspan><tspan x="1303" y="407">SceneVoxel payload</tspan><tspan x="1303" y="424">complexity / color / collision</tspan></text>
    </g>
    <g id="result-feedback">
    <rect class="node" x="1285" y="535" width="315" height="115" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
    <text class="node-title" x="1303" y="563">Result feedback</text>
    <text class="small"><tspan x="1303" y="585">score_blendsv_feedback_against_target</tspan><tspan x="1303" y="602">compare BlendSV with TargetSV_B</tspan><tspan x="1303" y="619">after commit, not candidate score</tspan></text>
    </g>
    <g id="sv[tick]-resident">
    <rect class="node" x="1285" y="720" width="315" height="120" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
    <text class="node-title" x="1303" y="748">SV[tick] resident</text>
    <text class="small"><tspan x="1303" y="770">complexity_field + collision_field</tspan><tspan x="1303" y="787">SceneVoxelTile dirty scope</tspan><tspan x="1303" y="804">promotes to SV[t - 1] next tick</tspan></text>
    </g>
  </g>
  <g>
    <g>
    <rect x="480" y="850" width="675" height="90" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
    <text class="note-text" x="494" y="874">Current boundary</text>
    <text class="small"><tspan x="494" y="895">Normal SV update entry is SceneVoxelTile dirty; source stamp / SVBrush is rebuilt intent.</tspan><tspan x="494" y="912">Full rebuild is dirty all tiles; no AutoObject direct committed SV write or per-frame full SV flush.</tspan></text>
  </g>
  </g>
</svg>
