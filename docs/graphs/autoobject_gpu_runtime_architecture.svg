<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1120" viewBox="0 0 1760 1120" role="img" aria-labelledby="title desc">
  <title id="title">AutoObject GPU Runtime Architecture</title>
  <desc id="desc">GPU-first AutoObject runtime architecture for million-scale objects.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#ea580c"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <pattern id="autoobject-dot-bg" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#cffafe"/>
      <circle cx="3" cy="3" r="1.25" fill="#0891b2" opacity="0.256281"/>
      <circle cx="9" cy="9" r="1.25" fill="#0891b2" opacity="0.256281"/>
    </pattern>
    <pattern id="descriptor-grid" patternUnits="userSpaceOnUse" width="9.3334" height="9.3334">
      <rect width="9.3334" height="9.3334" fill="#dcfce7"/>
      <path d="M4.6667 0H0V4.6667" stroke="#16a34a" stroke-width="0.3333" opacity="0.257576"/>
      <path d="M0 4.6667L4.6667 0" stroke="#16a34a" stroke-width="0.3333" opacity="0.257576"/>
    </pattern>
    <pattern id="gpu-buffer-bg" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#ede9fe"/>
      <rect x="0" y="0" width="2" height="10" fill="#7c3aed" opacity="0.261538"/>
      <rect x="5" y="0" width="1.5" height="10" fill="#7c3aed" opacity="0.261538"/>
    </pattern>
    <pattern id="sv-stripe-blue" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#dbeafe"/>
      <rect y="1" width="10" height="2" fill="#0284c7" opacity="0.235023"/>
      <rect y="6" width="10" height="1.5" fill="#0284c7" opacity="0.235023"/>
    </pattern>
    <pattern id="sv-stripe-amber" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#fef3c7"/>
      <rect y="1" width="10" height="2" fill="#d97706" opacity="0.264249"/>
      <rect y="6" width="10" height="1.5" fill="#d97706" opacity="0.264249"/>
    </pattern>
    <pattern id="note-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#f1f5f9"/>
      <rect x="0" y="0" width="10" height="2" fill="#64748b" opacity="0.361702"/>
    </pattern>
  </defs>

  <style>
    :root { color-scheme: light; }
    .bg { fill: #f8fafc; }
    .grid { stroke: #e2e8f0; stroke-width: 1; opacity: 0.7; }
    .title { fill: #0f172a; font: 700 34px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .subtitle { fill: #475569; font: 500 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .lane-title { fill: #334155; font: 700 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .node-title { fill: #0f172a; font: 700 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .small { fill: #475569; font: 500 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .mono { fill: #334155; font: 600 11px Consolas, "Cascadia Mono", monospace; letter-spacing: 0; }
    .note-text { fill: #0f172a; font: 600 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .lane { fill: #ffffff; stroke: #dbe3ef; stroke-width: 1.2; filter: url(#shadow); }
    .node { stroke-width: 1.5; filter: url(#shadow); }
    .edge { stroke: #334155; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
    .edge-blue { stroke: #2563eb; stroke-width: 2.2; fill: none; marker-end: url(#arrow-blue); }
    .edge-green { stroke: #059669; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
    .edge-orange { stroke: #ea580c; stroke-width: 2.2; fill: none; marker-end: url(#arrow-orange); }
    .edge-dash { stroke: #64748b; stroke-width: 1.9; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    .edge-warn { stroke: #dc2626; stroke-width: 2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
  </style>

  <rect class="bg" x="0" y="0" width="1760" height="1120"/>
  <g opacity="0.65">
    <line class="grid" x1="40" y1="86" x2="40" y2="1084"/><line class="grid" x1="120" y1="86" x2="120" y2="1084"/><line class="grid" x1="200" y1="86" x2="200" y2="1084"/><line class="grid" x1="280" y1="86" x2="280" y2="1084"/><line class="grid" x1="360" y1="86" x2="360" y2="1084"/><line class="grid" x1="440" y1="86" x2="440" y2="1084"/><line class="grid" x1="520" y1="86" x2="520" y2="1084"/><line class="grid" x1="600" y1="86" x2="600" y2="1084"/><line class="grid" x1="680" y1="86" x2="680" y2="1084"/><line class="grid" x1="760" y1="86" x2="760" y2="1084"/><line class="grid" x1="840" y1="86" x2="840" y2="1084"/><line class="grid" x1="920" y1="86" x2="920" y2="1084"/><line class="grid" x1="1000" y1="86" x2="1000" y2="1084"/><line class="grid" x1="1080" y1="86" x2="1080" y2="1084"/><line class="grid" x1="1160" y1="86" x2="1160" y2="1084"/><line class="grid" x1="1240" y1="86" x2="1240" y2="1084"/><line class="grid" x1="1320" y1="86" x2="1320" y2="1084"/><line class="grid" x1="1400" y1="86" x2="1400" y2="1084"/><line class="grid" x1="1480" y1="86" x2="1480" y2="1084"/><line class="grid" x1="1560" y1="86" x2="1560" y2="1084"/><line class="grid" x1="1640" y1="86" x2="1640" y2="1084"/><line class="grid" x1="1720" y1="86" x2="1720" y2="1084"/>
    <line class="grid" x1="30" y1="120" x2="1730" y2="120"/><line class="grid" x1="30" y1="200" x2="1730" y2="200"/><line class="grid" x1="30" y1="280" x2="1730" y2="280"/><line class="grid" x1="30" y1="360" x2="1730" y2="360"/><line class="grid" x1="30" y1="440" x2="1730" y2="440"/><line class="grid" x1="30" y1="520" x2="1730" y2="520"/><line class="grid" x1="30" y1="600" x2="1730" y2="600"/><line class="grid" x1="30" y1="680" x2="1730" y2="680"/><line class="grid" x1="30" y1="760" x2="1730" y2="760"/><line class="grid" x1="30" y1="840" x2="1730" y2="840"/><line class="grid" x1="30" y1="920" x2="1730" y2="920"/><line class="grid" x1="30" y1="1000" x2="1730" y2="1000"/><line class="grid" x1="30" y1="1080" x2="1730" y2="1080"/>
  </g>

  <text class="title" x="48" y="54">AutoObject GPU Runtime Architecture</text>
  <text class="subtitle" x="48" y="82">Million-scale AutoObjects: GPU owns runtime state, CPU owns authoring/debug commands, SV owns grid and committed fields.</text>

  <g>
    <rect class="lane" x="45" y="115" width="360" height="855" rx="8"/>
    <text class="lane-title" x="63" y="141">CPU CONTROL PLANE</text>
    <rect class="lane" x="445" y="115" width="360" height="855" rx="8"/>
    <text class="lane-title" x="463" y="141">PROFILE COMPILE</text>
    <rect class="lane" x="845" y="115" width="360" height="855" rx="8"/>
    <text class="lane-title" x="863" y="141">GPU AUTOOBJECT RUNTIME</text>
    <rect class="lane" x="1245" y="115" width="440" height="855" rx="8"/>
    <text class="lane-title" x="1263" y="141">GPU CONSUMERS + SV COMMIT</text>
  </g>

  <g>
    <path class="edge-green" d="M 365 220 L 485 215"/>
    <path class="edge-green" d="M 765 215 L 885 215"/>
    <path class="edge-blue" d="M 365 390 L 885 385"/>
    <path class="edge" d="M 1025 275 L 1025 330"/>
    <path class="edge" d="M 1025 455 L 1025 510"/>
    <path class="edge-blue" d="M 1165 385 L 1285 215"/>
    <path class="edge-blue" d="M 1165 565 L 1285 385"/>
    <path class="edge-orange" d="M 1165 735 L 1285 570"/>
    <path class="edge-blue" d="M 1165 735 L 1285 735"/>
    <path class="edge-orange" d="M 1465 635 L 1465 700"/>
    <path class="edge-blue" d="M 1465 815 L 1465 875"/>
    <path class="edge-dash" d="M 1285 900 L 365 725"/>
    <path class="edge-dash" d="M 1025 825 L 365 725"/>
    <text class="mono" x="560" y="875">selected object / summary only</text>
  </g>

  <g>
    <g id="authoring-prototypes">
      <rect class="node" x="85" y="165" width="280" height="110" rx="8" fill="url(#note-hatch)" stroke="#64748b"/>
      <text class="node-title" x="103" y="193">Authoring prototypes</text>
      <text class="small"><tspan x="103" y="215">AutoObject / AutoRock / AutoVegetation</tspan><tspan x="103" y="232">editor + import + debug only</tspan><tspan x="103" y="249">not per-instance runtime nodes</tspan></text>
    </g>

    <g id="command-queue">
      <rect class="node" x="85" y="330" width="280" height="120" rx="8" fill="url(#autoobject-dot-bg)" stroke="#0891b2"/>
      <text class="node-title" x="103" y="358">Command queue</text>
      <text class="small"><tspan x="103" y="380">spawn / kill / update transform</tspan><tspan x="103" y="397">set profile / flags</tspan><tspan x="103" y="414">procedural spawn may stay GPU-only</tspan></text>
    </g>

    <g id="debug-lookup">
      <rect class="node" x="85" y="665" width="280" height="120" rx="8" fill="url(#note-hatch)" stroke="#64748b"/>
      <text class="node-title" x="103" y="693">Debug lookup</text>
      <text class="small"><tspan x="103" y="715">object_id -&gt; label / source</tspan><tspan x="103" y="732">selected readback only</tspan><tspan x="103" y="749">no full million-object mirror</tspan></text>
    </g>

    <g id="descriptor-source">
      <rect class="node" x="485" y="165" width="280" height="110" rx="8" fill="url(#descriptor-grid)" stroke="#16a34a"/>
      <text class="node-title" x="503" y="193">AutoVoxelDescriptor</text>
      <text class="small"><tspan x="503" y="215">asset semantic source</tspan><tspan x="503" y="232">probes / collision / pivots</tspan><tspan x="503" y="249">compile input, not runtime container</tspan></text>
    </g>

    <g id="profile-container">
      <rect class="node" x="485" y="340" width="280" height="130" rx="8" fill="url(#descriptor-grid)" stroke="#16a34a"/>
      <text class="node-title" x="503" y="368">RuntimeProfileContainer</text>
      <text class="small"><tspan x="503" y="390">profile_table_buffer</tspan><tspan x="503" y="407">probe / collision / pivot buffers</tspan><tspan x="503" y="424">descriptor_hash -&gt; profile_id</tspan><tspan x="503" y="441">dedup + hot update</tspan></text>
    </g>

    <g id="gpu-object-pool">
      <rect class="node" x="885" y="160" width="280" height="130" rx="8" fill="url(#gpu-buffer-bg)" stroke="#7c3aed"/>
      <text class="node-title" x="903" y="188">GPU object pool</text>
      <text class="small"><tspan x="903" y="210">fixed object_id index</tspan><tspan x="903" y="227">alive flag + free list</tspan><tspan x="903" y="244">optional generation guard</tspan><tspan x="903" y="261">GPU is runtime authority</tspan></text>
    </g>

    <g id="soa-buffers">
      <rect class="node" x="885" y="330" width="280" height="130" rx="8" fill="url(#gpu-buffer-bg)" stroke="#7c3aed"/>
      <text class="node-title" x="903" y="358">Object SoA buffers</text>
      <text class="small"><tspan x="903" y="380">object_type / profile_id</tspan><tspan x="903" y="397">transform / bounds / flags / seeds</tspan><tspan x="903" y="414">no Resource / Dictionary / NodePath</tspan><tspan x="903" y="431">million-scale hot path</tspan></text>
    </g>

    <g id="per-voxel-object-refs">
      <rect class="node" x="885" y="510" width="280" height="120" rx="8" fill="url(#gpu-buffer-bg)" stroke="#7c3aed"/>
      <text class="node-title" x="903" y="538">Per-voxel object refs</text>
      <text class="small"><tspan x="903" y="560">SV object-ref GPU buffer</tspan><tspan x="903" y="577">tile refs are aggregates</tspan><tspan x="903" y="594">neighbor + exclusion queries</tspan></text>
    </g>

    <g id="dirty-regions">
      <rect class="node" x="885" y="690" width="280" height="115" rx="8" fill="url(#gpu-buffer-bg)" stroke="#7c3aed"/>
      <text class="node-title" x="903" y="718">SceneVoxelTile dirty</text>
      <text class="small"><tspan x="903" y="740">only normal SV update entry</tspan><tspan x="903" y="757">old/new bounds -&gt; tile ids</tspan><tspan x="903" y="774">dirty flags choose rebuild work</tspan></text>
    </g>

    <g id="prefilter-placement">
      <rect class="node" x="1285" y="165" width="335" height="120" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
      <text class="node-title" x="1303" y="193">GPU route + placement</text>
      <text class="small"><tspan x="1303" y="215">prefilter / physical scoring</tspan><tspan x="1303" y="232">same-type exclusion on GPU</tspan><tspan x="1303" y="249">consume object/profile/SV buffers</tspan></text>
    </g>

    <g id="sv-inputs">
      <rect class="node" x="1285" y="340" width="335" height="120" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
      <text class="node-title" x="1303" y="368">SV resident inputs</text>
      <text class="small"><tspan x="1303" y="390">SV[t - 1] resident fields</tspan><tspan x="1303" y="407">scene + collision query channels</tspan><tspan x="1303" y="424">SV owns grid coordinates</tspan></text>
    </g>

    <g id="source-write-streams">
      <rect class="node" x="1285" y="535" width="335" height="120" rx="8" fill="url(#sv-stripe-amber)" stroke="#d97706"/>
      <text class="node-title" x="1303" y="563">Source stamp / SVBrush</text>
      <text class="small"><tspan x="1303" y="585">rebuilt from dirty SceneVoxelTiles</tspan><tspan x="1303" y="602">AutoSceneVoxel / Brush intent</tspan><tspan x="1303" y="619">not a second SV update entry</tspan></text>
    </g>

    <g id="blend-sv">
      <rect class="node" x="1285" y="700" width="335" height="125" rx="8" fill="url(#sv-stripe-blue)" stroke="#0284c7"/>
      <text class="node-title" x="1303" y="728">blend_scene_voxels()</text>
      <text class="small"><tspan x="1303" y="750">runs only when source changed</tspan><tspan x="1303" y="767">publishes SV[tick] resident fields</tspan><tspan x="1303" y="784">not a separate state root</tspan></text>
    </g>

    <g id="feedback-debug">
      <rect class="node" x="1285" y="875" width="335" height="95" rx="8" fill="url(#note-hatch)" stroke="#64748b"/>
      <text class="node-title" x="1303" y="903">Debug summaries</text>
      <text class="small"><tspan x="1303" y="925">selected object / counters</tspan><tspan x="1303" y="942">async chunked snapshots only</tspan></text>
    </g>
  </g>

  <g>
    <rect x="485" y="995" width="740" height="80" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
    <text class="note-text" x="503" y="1019">Boundary</text>
    <text class="small"><tspan x="503" y="1040">CPU/GPU object commands only mark SceneVoxelTile dirty; no direct committed SV write.</tspan><tspan x="503" y="1057">SV owns grid + fields; full rebuild means dirty all tiles, not per-frame full SV flush.</tspan></text>
  </g>
</svg>
