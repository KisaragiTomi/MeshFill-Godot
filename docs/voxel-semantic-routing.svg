<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
  <title id="title">Voxel Semantic Routing candidate-only pipeline</title>
  <desc id="desc">Diagram of candidate-only semantic routing: upstream anchor prefilter, anchor_autoobject_topk hard gate, optional rerank and validation, EMPTY pruning, candidate_tiles_by_asset aggregation, and physical placement.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101f"/>
      <stop offset="0.58" stop-color="#0b1728"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="prefilter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="rerank" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="prune" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#be123c"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="aggregate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="1" stop-color="#65a30d"/>
    </linearGradient>
    <linearGradient id="placement" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8dd3ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#86efac"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fca5a5"/>
    </marker>
    <style>
      .title { font: 700 34px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 16px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #a5b4fc; }
      .section { font: 700 18px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #f8fafc; }
      .label { font: 600 15px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #e5e7eb; }
      .small { font: 500 13px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #cbd5e1; }
      .tiny { font: 500 12px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #94a3b8; }
      .mono { font: 600 12px Consolas, "Cascadia Mono", monospace; fill: #dbeafe; }
      .card { fill: #0f172a; stroke: #334155; stroke-width: 1.4; rx: 18; filter: url(#shadow); }
      .prefilter-card { fill: url(#prefilter); stroke: #67e8f9; stroke-width: 1.5; rx: 22; filter: url(#shadow); }
      .gate-card { fill: url(#gate); stroke: #818cf8; stroke-width: 1.5; rx: 22; filter: url(#shadow); }
      .rerank-card { fill: url(#rerank); stroke: #c4b5fd; stroke-width: 1.5; rx: 22; filter: url(#shadow); }
      .prune-card { fill: url(#prune); stroke: #fed7aa; stroke-width: 1.5; rx: 22; filter: url(#shadow); }
      .aggregate-card { fill: url(#aggregate); stroke: #bbf7d0; stroke-width: 1.5; rx: 22; filter: url(#shadow); }
      .placement-card { fill: url(#placement); stroke: #7dd3fc; stroke-width: 1.5; rx: 22; filter: url(#shadow); }
      .soft { fill: rgba(15, 23, 42, 0.72); stroke: #64748b; stroke-width: 1.1; rx: 14; }
      .note { fill: #16213a; stroke: #334155; stroke-width: 1; rx: 12; }
      .warn { fill: #2b2038; stroke: #fca5a5; stroke-width: 1.2; rx: 12; }
      .ok { fill: #062f26; stroke: #86efac; stroke-width: 1.2; rx: 12; }
      .arrow { fill: none; stroke: #8dd3ff; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-green { fill: none; stroke: #86efac; stroke-width: 3; marker-end: url(#arrowGreen); }
      .arrow-red { fill: none; stroke: #fca5a5; stroke-width: 2.6; marker-end: url(#arrowRed); }
      .dash { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .dash-green { fill: none; stroke: #86efac; stroke-width: 2.2; stroke-dasharray: 8 7; marker-end: url(#arrowGreen); }
      .dash-red { fill: none; stroke: #fca5a5; stroke-width: 2.2; stroke-dasharray: 8 7; marker-end: url(#arrowRed); }
    </style>
  </defs>

  <rect width="1600" height="1060" fill="url(#bg)"/>
  <circle cx="1350" cy="94" r="220" fill="#1e40af" opacity="0.13"/>
  <circle cx="235" cy="850" r="260" fill="#047857" opacity="0.11"/>
  <circle cx="800" cy="170" r="170" fill="#7c3aed" opacity="0.09"/>

  <text x="58" y="58" class="title">Voxel Semantic Routing — 候选资产路由</text>
  <text x="58" y="88" class="subtitle">语义向量匹配只在每个 anchor 的粗筛候选资产内 rerank / validate / prune；不再从全资产库选择最优 asset。</text>

  <rect x="50" y="132" width="300" height="278" class="prefilter-card"/>
  <text x="82" y="174" class="section">1. 上游 AutoObject 粗筛</text>
  <text x="82" y="204" class="small">收集 dirty anchors：</text>
  <text x="102" y="228" class="mono">ground / target_top</text>
  <rect x="82" y="252" width="236" height="86" class="soft"/>
  <text x="104" y="281" class="label">probe prefilter</text>
  <text x="104" y="306" class="small">AutoObject.semantic_probes</text>
  <text x="104" y="328" class="small">sample TargetSV / SceneVoxel</text>
  <rect x="82" y="356" width="236" height="34" class="ok"/>
  <text x="104" y="378" class="mono">anchor_autoobject_topk</text>

  <rect x="400" y="132" width="300" height="278" class="gate-card"/>
  <text x="432" y="174" class="section">2. Anchor 候选池</text>
  <text x="432" y="204" class="small">每个 anchor 已筛选成功：</text>
  <rect x="432" y="226" width="236" height="106" class="soft"/>
  <text x="454" y="254" class="mono">anchor_id -> [</text>
  <text x="474" y="278" class="mono">asset_index, score,</text>
  <text x="474" y="302" class="mono">anchor_kind, tile_id</text>
  <text x="454" y="326" class="mono">]</text>
  <rect x="432" y="354" width="236" height="36" class="warn"/>
  <text x="454" y="377" class="label">Hard gate：不遍历全资产库</text>

  <rect x="750" y="132" width="340" height="278" class="rerank-card"/>
  <text x="782" y="174" class="section">3. 候选内 rerank / validate</text>
  <text x="782" y="204" class="small">只读取当前 anchor 的 candidates</text>
  <rect x="782" y="226" width="276" height="116" class="soft"/>
  <text x="804" y="254" class="mono">semantic_score = match(...)</text>
  <text x="804" y="278" class="mono">target_score   = validate(...)</text>
  <text x="804" y="302" class="mono">support_hint   = context.y</text>
  <text x="804" y="326" class="mono">route_score    = weighted sum</text>
  <rect x="782" y="360" width="276" height="32" class="ok"/>
  <text x="804" y="381" class="label">保留多个 route，不输出唯一 best_asset</text>

  <rect x="1140" y="132" width="310" height="278" class="prune-card"/>
  <text x="1172" y="174" class="section">4. Route prune / EMPTY</text>
  <text x="1172" y="204" class="small">剔除低置信度和空目标区域</text>
  <rect x="1172" y="226" width="246" height="112" class="soft"/>
  <text x="1194" y="255" class="mono">min_route_accept = 0.25</text>
  <text x="1194" y="279" class="mono">EMPTY_ASSET_ID = 0xffffffff</text>
  <text x="1194" y="303" class="mono">empty_tile_threshold = 0.65</text>
  <text x="1194" y="327" class="mono">EMPTY 不作为 asset 输出</text>
  <rect x="1172" y="360" width="246" height="32" class="warn"/>
  <text x="1194" y="381" class="label">空候选 / 低分 route 不进入 score</text>

  <path d="M 350 271 C 372 271 378 271 400 271" class="arrow"/>
  <path d="M 700 271 C 722 271 728 271 750 271" class="arrow"/>
  <path d="M 1090 271 C 1112 271 1118 271 1140 271" class="arrow"/>

  <rect x="50" y="470" width="300" height="214" class="card"/>
  <text x="82" y="510" class="section">Dirty 更新边界</text>
  <text x="82" y="540" class="small">普通 scene occupancy 变化：</text>
  <text x="102" y="565" class="mono">dirty tile -> affected anchors</text>
  <text x="82" y="596" class="small">Target color / complexity：</text>
  <text x="102" y="621" class="mono">local radius = 4 voxels</text>
  <text x="102" y="645" class="mono">wide radius  = 8 voxels</text>
  <text x="82" y="669" class="tiny">只重建受影响 asset 的 routed tiles。</text>

  <rect x="400" y="470" width="690" height="214" class="card"/>
  <text x="432" y="510" class="section">可选 Context / Preference Buffers</text>
  <text x="432" y="540" class="small">这些 buffer 只用于候选 route 验证和 EMPTY 判断，不用于全库查找。</text>
  <rect x="432" y="566" width="200" height="82" class="soft"/>
  <text x="454" y="594" class="label">voxel_context</text>
  <text x="454" y="618" class="mono">4 vec4 = 16 floats</text>
  <text x="454" y="640" class="small">density / support / y_free</text>
  <rect x="656" y="566" width="200" height="82" class="soft"/>
  <text x="678" y="594" class="label">target_scene_context</text>
  <text x="678" y="618" class="mono">packed RGBA8</text>
  <text x="678" y="640" class="small">local 8³ + wide 16³</text>
  <rect x="880" y="566" width="178" height="82" class="soft"/>
  <text x="902" y="594" class="label">asset_target_pref</text>
  <text x="902" y="618" class="mono">16 RGBA8 cells</text>
  <text x="902" y="640" class="small">tie-break / confidence</text>

  <rect x="1140" y="470" width="310" height="214" class="aggregate-card"/>
  <text x="1172" y="510" class="section">5. Normalize / Aggregate</text>
  <text x="1172" y="540" class="small">存活 routes 去重并按 asset 聚合</text>
  <rect x="1172" y="566" width="246" height="82" class="soft"/>
  <text x="1194" y="594" class="mono">candidate_tiles_by_asset = {</text>
  <text x="1214" y="618" class="mono">asset_index: tile_ids</text>
  <text x="1194" y="642" class="mono">}</text>
  <text x="1172" y="669" class="tiny">asset 无 routed tiles 时本轮 placement 直接跳过。</text>

  <path d="M 920 410 C 920 438 920 438 920 470" class="dash-green"/>
  <path d="M 1090 577 C 1114 577 1118 577 1140 577" class="dash-green"/>
  <path d="M 1295 410 C 1295 436 1295 440 1295 470" class="arrow-green"/>
  <path d="M 350 577 C 374 577 376 577 400 577" class="dash"/>

  <rect x="50" y="736" width="990" height="214" class="card"/>
  <text x="82" y="776" class="section">旧方案 / 禁止回退路径</text>
  <text x="82" y="806" class="small">当前设计不再通过全资产语义查找生成 voxel 级或 tile 级 asset top-K。</text>
  <rect x="82" y="832" width="282" height="78" class="warn"/>
  <text x="104" y="862" class="label">full asset library search</text>
  <text x="104" y="887" class="mono">for asset in all_assets: match()</text>
  <rect x="390" y="832" width="278" height="78" class="warn"/>
  <text x="412" y="862" class="label">legacy buffers</text>
  <text x="412" y="887" class="mono">asset_embedding_buffer</text>
  <rect x="694" y="832" width="314" height="78" class="warn"/>
  <text x="716" y="862" class="label">legacy top-K outputs</text>
  <text x="716" y="887" class="mono">voxel_asset_topk / tile_asset_topk</text>
  <path d="M 365 870 C 374 860 382 860 390 870" class="arrow-red"/>
  <path d="M 668 870 C 678 860 686 860 694 870" class="arrow-red"/>
  <text x="82" y="932" class="tiny">这些只属于旧的“全资产语义查找”方案；第一版不需要。</text>

  <rect x="1140" y="736" width="310" height="214" class="placement-card"/>
  <text x="1172" y="776" class="section">6. Physical Placement</text>
  <text x="1172" y="806" class="small">只对 routed asset/tile dispatch</text>
  <rect x="1172" y="832" width="246" height="82" class="soft"/>
  <text x="1194" y="860" class="label">VoxelPlacementGenerator</text>
  <text x="1194" y="884" class="mono">run_multi_asset()</text>
  <text x="1194" y="906" class="mono">score_voxel_tile.glsl</text>
  <text x="1172" y="934" class="tiny">score 阶段只做 support / collision / clearance / overlap / target fit。</text>

  <path d="M 1295 684 C 1295 710 1295 710 1295 736" class="arrow-green"/>

  <rect x="50" y="984" width="1400" height="42" class="note"/>
  <text x="82" y="1011" class="small">核心约束：粗筛后的 assets 是语义向量匹配候选池；semantic routing 只重排、验证、剔除候选，最终交给物理 placement 决定是否可放置。</text>
</svg>
