<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">Current TargetSceneVoxel GPU Pipeline</title>
  <desc id="desc">Diagram of the current GPU TargetSceneVoxel generation, persistence, and Godot debug visualization flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1728"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gpu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="target" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.55" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="preview" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="0.48" stop-color="#84cc16"/>
      <stop offset="1" stop-color="#a3a3a3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8dd3ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#86efac"/>
    </marker>
    <style>
      .title { font: 700 34px "Segoe UI", Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 16px "Segoe UI", Arial, sans-serif; fill: #a5b4fc; }
      .section { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #f8fafc; }
      .label { font: 600 15px "Segoe UI", Arial, sans-serif; fill: #e5e7eb; }
      .small { font: 500 13px "Segoe UI", Arial, sans-serif; fill: #cbd5e1; }
      .tiny { font: 500 12px "Segoe UI", Arial, sans-serif; fill: #94a3b8; }
      .mono { font: 600 12px Consolas, "Cascadia Mono", monospace; fill: #dbeafe; }
      .card { fill: #0f172a; stroke: #334155; stroke-width: 1.4; rx: 18; filter: url(#shadow); }
      .soft { fill: #111c31; stroke: #475569; stroke-width: 1.2; rx: 14; }
      .gpu-card { fill: url(#gpu); stroke: #67e8f9; stroke-width: 1.5; rx: 22; filter: url(#shadow); }
      .target-card { fill: #101827; stroke: #86efac; stroke-width: 1.5; rx: 20; filter: url(#shadow); }
      .persist-card { fill: #111827; stroke: #fbbf24; stroke-width: 1.4; rx: 18; filter: url(#shadow); }
      .debug-card { fill: #111827; stroke: #c084fc; stroke-width: 1.4; rx: 18; filter: url(#shadow); }
      .arrow { fill: none; stroke: #8dd3ff; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-green { fill: none; stroke: #86efac; stroke-width: 3; marker-end: url(#arrowGreen); }
      .dash { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; }
      .badge { fill: #172554; stroke: #60a5fa; stroke-width: 1; rx: 10; }
      .note { fill: #16213a; stroke: #334155; stroke-width: 1; rx: 12; }
    </style>
  </defs>

  <rect width="1400" height="920" fill="url(#bg)"/>
  <circle cx="1190" cy="80" r="180" fill="#1e40af" opacity="0.14"/>
  <circle cx="190" cy="800" r="240" fill="#047857" opacity="0.12"/>

  <text x="60" y="58" class="title">TargetSceneVoxel 当前 GPU 实现</text>
  <text x="60" y="88" class="subtitle">GPU compute 生成中性目标体素；CPU 只负责 dispatch、readback 持久化与 Godot 调试显示。</text>

  <rect x="48" y="120" width="292" height="626" class="card"/>
  <text x="78" y="158" class="section">输入贴图</text>
  <text x="78" y="184" class="tiny">来自 main.gd 当前场景状态</text>

  <rect x="78" y="218" width="232" height="92" class="soft"/>
  <text x="98" y="248" class="label">scene_depth</text>
  <text x="98" y="274" class="small">地形/当前表面高度</text>
  <text x="98" y="296" class="mono">sampler2D binding 0</text>

  <rect x="78" y="342" width="232" height="92" class="soft"/>
  <text x="98" y="372" class="label">target_height</text>
  <text x="98" y="398" class="small">合成后的目标高度</text>
  <text x="98" y="420" class="mono">sampler2D binding 1</text>

  <rect x="78" y="466" width="232" height="92" class="soft"/>
  <text x="98" y="496" class="label">rock_mask</text>
  <text x="98" y="522" class="small">已放置岩石/刷子约束</text>
  <text x="98" y="544" class="mono">sampler2D binding 2</text>

  <rect x="78" y="596" width="232" height="96" class="note"/>
  <text x="98" y="626" class="label">关键参数</text>
  <text x="98" y="652" class="small">TEX_RES = 256</text>
  <text x="98" y="674" class="small">slice_count = 8</text>

  <path d="M 340 264 C 386 264 390 282 424 302" class="arrow"/>
  <path d="M 340 388 C 386 388 392 382 424 370" class="arrow"/>
  <path d="M 340 512 C 386 512 392 466 424 438" class="arrow"/>

  <rect x="424" y="190" width="372" height="386" class="gpu-card"/>
  <text x="462" y="230" class="section">GPU Compute</text>
  <text x="462" y="258" class="small">scripts/target_scene_voxel_generator.gd</text>
  <text x="462" y="280" class="mono">shaders/target_scene_voxel.glsl</text>

  <rect x="462" y="320" width="294" height="74" fill="#082f49" stroke="#7dd3fc" stroke-width="1.2" rx="14"/>
  <text x="486" y="349" class="label">每个 voxel 在 shader 中计算</text>
  <text x="486" y="374" class="small">height delta / slope / rock signal</text>

  <rect x="462" y="424" width="294" height="100" fill="#052e2b" stroke="#99f6e4" stroke-width="1.2" rx="14"/>
  <text x="486" y="454" class="label">只写中性 TargetSV 字段</text>
  <text x="486" y="482" class="small">color.rgb + value / complexity</text>
  <text x="486" y="506" class="small">collision 使用 peak / max 语义</text>

  <rect x="532" y="604" width="178" height="42" class="badge"/>
  <text x="558" y="631" class="mono">dispatch 8×4×8</text>

  <path d="M 796 380 C 834 380 846 380 878 380" class="arrow-green"/>

  <rect x="878" y="146" width="322" height="488" class="target-card"/>
  <text x="916" y="186" class="section">3D TargetSV Buffer</text>
  <text x="916" y="214" class="small">256 × 8 × 256 target voxels</text>
  <text x="916" y="237" class="tiny">当前是 8 个垂直 slice 的目标场</text>

  <g transform="translate(938 282)">
    <polygon points="0,86 122,24 244,86 122,148" fill="url(#target)" opacity="0.86" stroke="#bbf7d0" stroke-width="1.4"/>
    <polygon points="0,116 122,54 244,116 122,178" fill="url(#target)" opacity="0.64" stroke="#bbf7d0" stroke-width="1.2"/>
    <polygon points="0,146 122,84 244,146 122,208" fill="url(#target)" opacity="0.42" stroke="#bbf7d0" stroke-width="1.1"/>
    <line x1="0" y1="86" x2="0" y2="146" stroke="#86efac" stroke-width="1.2" opacity="0.8"/>
    <line x1="122" y1="148" x2="122" y2="208" stroke="#86efac" stroke-width="1.2" opacity="0.8"/>
    <line x1="244" y1="86" x2="244" y2="146" stroke="#86efac" stroke-width="1.2" opacity="0.8"/>
    <circle cx="84" cy="112" r="9" fill="#22c55e"/>
    <circle cx="134" cy="92" r="11" fill="#a3a3a3"/>
    <circle cx="171" cy="137" r="7" fill="#f59e0b"/>
  </g>

  <rect x="918" y="530" width="242" height="60" fill="#052e16" stroke="#86efac" stroke-width="1.2" rx="14"/>
  <text x="940" y="556" class="mono">vec4(color.rgb, value)</text>
  <text x="940" y="578" class="mono">float collision_peak</text>

  <path d="M 1038 634 C 1038 674 1038 692 1038 724" class="arrow"/>
  <path d="M 1138 634 C 1170 680 1192 702 1220 734" class="arrow"/>

  <rect x="770" y="724" width="340" height="138" class="persist-card"/>
  <text x="806" y="762" class="section">持久化 user://target_scene_voxel/</text>
  <text x="806" y="794" class="mono">target_scene_voxel_visual.rgba32f</text>
  <text x="806" y="818" class="mono">target_scene_voxel_collision.r32f</text>
  <text x="806" y="842" class="mono">target_scene_voxel.json</text>

  <rect x="1140" y="724" width="212" height="138" class="debug-card"/>
  <text x="1170" y="762" class="section">Preview</text>
  <rect x="1174" y="792" width="76" height="44" fill="url(#preview)" stroke="#e9d5ff" stroke-width="1.2" rx="8"/>
  <text x="1262" y="811" class="mono">preview.png</text>
  <text x="1262" y="834" class="tiny">column projection</text>

  <path d="M 1246 724 C 1246 684 1242 664 1204 620" class="dash"/>

  <rect x="86" y="780" width="600" height="82" fill="#111827" stroke="#475569" stroke-width="1.2" rx="18"/>
  <text x="116" y="812" class="section">Godot 调试输入</text>
  <text x="116" y="842" class="small">J：读取已持久化 preview 并在场景中显示 / 隐藏 DebugTargetSceneVoxel</text>
  <text x="116" y="864" class="small">Ctrl+J：全量 GPU 重新计算 TargetSV，自动保存并刷新当前显示</text>

  <path d="M 388 780 C 480 700 534 654 610 646" class="arrow"/>
  <path d="M 686 822 C 724 822 740 822 770 822" class="arrow"/>
  <path d="M 1110 798 C 1130 798 1130 798 1140 798" class="arrow"/>

  <rect x="886" y="54" width="438" height="66" fill="#172033" stroke="#475569" stroke-width="1.1" rx="16"/>
  <text x="914" y="84" class="label">不包含资产标签</text>
  <text x="914" y="107" class="tiny">TargetSV 不写 asset_id / asset_type / tree / rock / grass；只表达目标视觉和碰撞意图。</text>
</svg>
